Q.130 The research paper was full of errors because the data <u>is not verified</u> by any expert.
A. (a) has not been verified
B. (b) is not being verified yet
C. (c) No substitution required
D. (d) was not verified
Ans: (d)
Exp: Sol.130.(d) was not verified The sentence is in the past tense because it refers to a research paper that had already been written. Therefore, the verb phrase must also be in the past tense. Hence, 'was not verified' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.131 She said that she <u>will</u> go to market later.
A. (a) shall go
B. (b) could go
C. (c) can go
D. (d) would go
Ans: (d)
Exp: Sol.131.(d) would go The reporting verb said is in the past tense, so the future form will go changes to would go in indirect speech. Hence, option (d) is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.132 If I <u>was</u> you, I would consult a specialist.
A. (a) No substitution required
B. (b) am you
C. (c) would be you
D. (d) were you
Ans: (d)
Exp: Sol.132.(d) were you "If I were V2 (past form of the verb)" is the correct grammatical structure for a conditional sentence. Hence, 'was' will be replaced with 'were' to make the given sentence grammatically correct.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.133 He has <u>much works</u> to finish.
A. (a) a lot of work
B. (b) plenty works
C. (c) many works
D. (d) lot of tasks
Ans: (a)
Exp: Sol.133.(a) a lot of work "Work" is an uncountable noun, so we cannot say "much works" or "many works." The correct way to express a large quantity is "a lot of work." Hence, option (a) is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.134 He <u>denied to help</u> me.
A. (a) help to me
B. (b) for helping me
C. (c) helping me
D. (d) to helping me
Ans: (c)
Exp: Sol.134.(c) helping me The verb deny is followed by a gerund (-ing form), not an infinitive. Therefore, the correct sentence is "He denied helping me".
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.135 The man is blind <u>of</u> one eye.
A. (a) with one eye
B. (b) by one eye
C. (c) in one eye
D. (d) from one eye
Ans: (c)
Exp: Sol.135.(c) in one eye The preposition "in" is used to indicate blindness in one of the eyes. Hence, 'in one eye' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.136 He is <u>a honest</u> man.
A. (a) the honest
B. (b) an honest
C. (c) one honest
D. (d) honest
Ans: (b)
Exp: Sol.136.(b) an honest The article 'an' will be used as the word 'honest' begins with a vowel sound. Hence, 'an honest' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.137 He came here with a view <u>to meet</u> his old friend.
A. (a) to meet with
B. (b) for meeting
C. (c) in view to meet
D. (d) with a view to meeting
Ans: (d)
Exp: Sol.137.(d) with a view to meeting There are some phrases that are always followed by a gerund(V_ing). Such phrases are 'with a view to, looking forward to, in addition to, accustomed to, habituated to, be used to, prone to, etc. Hence, 'with a view to meeting (V_ine)' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.138 The manager <u>discussed on</u> the issue in detail.
A. (a) discussed the issue
B. (b) discussed about the issue
C. (c) explained the issue
D. (d) talked over the issue
Ans: (a)
Exp: Sol.138.(a) discussed the issue 'Discussed' is a transitive verb and we do not use any preposition to denote its object. Therefore, 'on' must be removed. Hence, 'discussed the issue' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.139 Each of the students <u>have</u> a book.
A. (a) has
B. (b) had
C. (c) gets
D. (d) is having
Ans: (a)
Exp: Sol.139.(a) has 'Everyone/each/ every/ nothing/ everything/ anything/ either/ neither' represents a singular noun. Therefore, singular verbs will be used with them. 'Have' must be replaced with 'has' in the given sentence. Hence, 'has' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.140 The higher you go, the cooler it <u>get</u>.
A. (a) cooler it gets
B. (b) cooler it getting
C. (c) more cooler it gets
D. (d) coolest it becomes
Ans: (a)
Exp: Sol.140.(a) cooler it gets According to the "Subject-Verb Agreement Rule", a singular subject always takes a singular verb. In the given sentence, 'it' is a singular subject that will take 'gets' as a singular verb. Hence, 'cooler it gets' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.141 She prevented me <u>to go</u> there.
A. (a) for going
B. (b) against going
C. (c) going to
D. (d) from going
Ans: (d)
Exp: Sol.141.(d) from going The verb "prevent / refrain / abstain" always takes the preposition 'from' followed by the -ing form of the verb. Hence, 'from going' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.142 Scarcely had I left when it <u>was starting</u> to rain.
A. (a) had started
B. (b) was begun
C. (c) did start
D. (d) started
Ans: (d)
Exp: Sol.142.(d) started We use simple past tense after "when" to indicate the time of another past event. 'Started' is the past form of the verb. Hence, 'started' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.143 This is the boy <u>who he stole</u> the purse.
A. (a) who had stole
B. (b) which stole
C. (c) whom stole
D. (d) who stole
Ans: (d)
Exp: Sol.143.(d) who stole In the given sentence, the pronoun "he" is unnecessary, as "who" already acts as the subject of the relative clause referring to the boy. Therefore, the correct sentence is "This is the boy who stole the purse."
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.144 She is my <u>cousin sister</u>.
A. (a) cousin sibling
B. (b) own cousin
C. (c) cousin girl
D. (d) cousin
Ans: (d)
Exp: Sol.144.(d) cousin The word "cousin" already indicates a family relationship, so adding "sister" is unnecessary and redundant. Hence, "cousin" is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.145 She <u>aren't believe</u> in wasting time during working hours.
A. (a) isn't believe
B. (b) No substitution required
C. (c) wasn't believes
D. (d) doesn't believe
Ans: (d)
Exp: Sol.145.(d) doesn't believe In the given sentence, "aren't believe" is not a proper verb form for the subject "She." The correct negative form is "doesn't," followed by the base verb "believe." Hence, "doesn't believe" is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.146 She is married <u>with</u> a doctor.
A. (a) in a doctor
B. (b) to a doctor
C. (c) by a doctor
D. (d) from a doctor
Ans: (b)
Exp: Sol.146.(b) to a doctor 'To' is the fixed preposition used with the adjective 'married' to indicate the person one is married to. Hence, 'married to a doctor' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.147 I came to know this <u>from a friend</u>.
A. (a) to know this through
B. (b) to know that from
C. (c) to know of it from
D. (d) to know it by
Ans: (a)
Exp: Sol.147.(a) to know this through In the given sentence, the phrase "from a friend" is incorrect. The correct preposition to indicate the source of information is "through." Hence, "to know this through" is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.148 <u>Seldom we have seen</u> such a performance.
A. (a) had we seen
B. (b) did we saw
C. (c) have we seen
D. (d) we had seen
Ans: (c)
Exp: Sol.148.(c) have we seen When a sentence begins with negative words like "seldom, no sooner, never, not only, rarely, scarcely, barely, hardly", the helping verb is placed before the subject. This is called inversion. Hence, "have we seen" is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.149 The students <u>was asked to submit</u> their assignments by Friday.
A. (a) are asked to submitted their Assignments
B. (b) No substitution required
C. (c) were asked to submit their Assignments
D. (d) will asked to submit their assignments
Ans: (c)
Exp: Sol.149.(c) were asked to submit their assignments According to the "Subject-Verb Agreement Rule", a singular subject always takes a singular verb and a plural subject always takes a plural verb. In the given sentence, the subject "students" is plural, so the correct auxiliary verb should be "were" instead of "was." Hence, option (c) is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.150 The doctor advised that he <u>takes</u> rest.
A. (a) must takes rest
B. (b) take rest
C. (c) take the rest
D. (d) should takes rest
Ans: (b)
Exp: Sol.150.(b) take rest In the given sentence, the clause follows "advised that," which requires the subjunctive mood. In the subjunctive, the base form of the verb (take) is used, not "takes." Hence, option (b) is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.151 They <u>returned back to their home</u>.
A. (a) returned to house
B. (b) came back to home
C. (c) returned home
D. (d) went back home
Ans: (c)
Exp: Sol.151.(c) returned home In the given sentence, the word "returned" already implies "going back," so adding "back" makes it redundant. Also, we do not normally use "to their home" with "returned." Therefore, the correct form is "returned home."
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.152 <u>No sooner I reached</u> the platform than the train left.
A. (a) I had no sooner reached
B. (b) No sooner did I reach
C. (c) I no sooner reached
D. (d) No sooner had I reached
Ans: (d)
Exp: Sol.152.(d) No sooner had I reached If a sentence starts with a negative word (hardly / barely / scarcely / rarely / no sooner / not only / never / little), the correct grammatical structure is "Negative word + Helping verb + Subject + Main Verb". We generally use past perfect tense(had + V3 with 'no sooner'. Hence, 'No sooner had I reached(V3)' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.153 The car is moving very <u>fastly</u> on the road.
A. (a) fastliness
B. (b) quickliness
C. (c) fast
D. (d) quicker
Ans: (c)
Exp: Sol.153.(c) fast In English, some words function as both adjectives and adverbs and 'fast' is one of them. The word 'fastly' is incorrect. Hence, 'fast' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.154 The meeting will begin <u>by</u> 3 PM.
A. (a) on
B. (b) from
C. (c) at

Ans: (c)
Exp: Sol.154.(c) at The preposition 'at' is used to indicate a specific point of time. 3 PM indicates a specific time. Hence, 'at' is the most appropriate answer.

Q.155 She is confident <u>to win the match</u>.
A. (a) in winning
B. (b) of winning the match

D. (d) to winning the match
Ans: (b)
Exp: Sol.155.(b) of winning the match The adjective 'confident' is always followed by the preposition 'of' when expressing certainty about something. Hence, 'of winning the match' is the most appropriate answer.

Q.156 She <u>prefers to stay at home than go out</u>.

C. (c) staying at home to going out
D. (d) to stay at home to going out
Ans: (c)
Exp: Sol.156.(c) staying at home to going out The verb 'prefer' is followed by the gerund (-ing form) and takes the structure prefer X to Y. Hence, 'She prefers staying at home to going out' is the most appropriate answer.

Q.157 <u>Hardly he had reached</u> the station when the train left.
A. (a) He had hardly reached
B. (b) Hardly had he reached
C. (c) No sooner he reached
D. (d) He hardly had reached
Ans: (b)
Exp: Sol.157.(b) Hardly had he reached If a sentence starts with a negative word (hardly / barely / scarcely / rarely / no sooner / not only / never / little), the correct grammatical structure is "Negative word + Helping verb + Subject + Main Verb". Hence, 'Hardly had he reached' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.158 He worked very <u>hardly</u> to pass the exam.
A. (a) sincerely
B. (b) regularly
C. (c) hard
D. (d) harder
Ans: (c)
Exp: Sol.158.(c) hard 'Hardly' is a negative word but we need a positive word here. The adverb 'hard' is used in the context of putting a lot of effort into something. The given sentence talks about working very hard to pass the examination. Hence, 'hard' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.159 I prefer tea <u>than</u> coffee.
A. (a) instead coffee
B. (b) to coffee
C. (c) rather coffee
D. (d) over coffee
Ans: (b)
Exp: Sol.159.(b) to coffee 'To' is a fixed preposition used with the verb 'prefer'. Hence, 'to coffee' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.160 He is one of those players who <u>has</u> scored the most goals.
A. (a) have scored
B. (b) had been scoring

D. (d) had scored
Ans: (a)
Exp: Sol.160.(a) have scored The phrase "one of those players who..." refers to "players," which is plural. Therefore, the verb following "who" must agree with the plural noun "players." Hence, "have scored" is the most appropriate answer.

Q.161 He <u>insisted to go</u> home.
A. (a) going on

D. (d) on going
Ans: (d)

Q.162 I am used <u>to eat</u> late at night.
A. (a) for eating
B. (b) eating
C. (c) to eating
D. (d) in eating
Ans: (c)
Exp: Sol.162.(c) to eating The phrase "used to" when expressing a habit is followed by a gerund (-ing form). In the given sentence, "eat" should be replaced with "eating." Therefore, the corrected sentence is "I am used to eating late at night."

Q.163 <u>Hardly I had entered</u> the room when the phone rang.
A. (a) Hardly had I entered

Ans: (a)
Exp: Sol.163.(a) Hardly had I entered If a sentence starts with a negative word (hardly / barely / scarcely / rarely / no sooner/not only / never / little), the correct grammatical structure is "Negative word + Helping verb + Subject + Main Verb". Hence, 'Hardly had I entered' is the most appropriate answer.

Q.164 It is high time you <u>leave the room</u>.
A. (a) have left the room

D. (d) leaves the room
Ans: (c)
Exp: Sol.164.(c) left the room The phrase "It is high time" is followed by a past tense verb to indicate that an action should be done immediately. Hence, 'left the room' is the most appropriate answer.

Q.165 This session is an improvement <u>rather</u> the previous one.

D. (d) over
Ans: (d)
Exp: Sol.165.(d) over The correct phrase is "an improvement over" when comparing something with a previous version. In the given sentence, "rather" should be replaced with "over" to convey the intended comparison. Hence, the corrected sentence is "This session is an improvement over the previous one."

Q.166 The teacher asked <u>that who</u> was absent.
A. (a) that whom

C. (c) who
D. (d) whose
Ans: (c)
Exp: Sol.166.(c) who The word 'that' is unnecessary because 'asked' can be directly followed by an interrogative word like 'who'. Hence, 'who' is the most appropriate answer.

Q.167 The price of petrol <u>has increased yesterday</u>.
A. (a) rose yesterday
B. (b) increased yesterday

D. (d) risen yesterday
Ans: (b)
Exp: Sol.167.(b) increased yesterday In the given sentence, "yesterday" refers to a specific past time. With specific past time expressions, we use the simple past tense. Therefore, the correct form is 'increased yesterday.'

Q.168 I wish I <u>am</u> taller.

B. (b) was taller

D. (d) could be taller
Ans: (a)
Exp: Sol.168.(a) were taller The phrase "I wish" is used in the subjunctive mood to express desires. The correct structure is "I wish + simple past." Therefore, the correct sentence should be "I wish I were taller."

Q.169 We waited for him <u>since two hours</u>.

C. (c) by two hours
D. (d) for two hours
Ans: (d)
Exp: Sol.169.(d) for two hours The sentence is about an action continuing for a period of time, so the correct preposition is for. Therefore, the correct form is "for two hours."

Q.170 The wall is decorated <u>by</u> posters.
A. (a) full of posters
B. (b) painted in posters
C. (c) decorated with posters
D. (d) covered in posters
Ans: (c)
Exp: Sol.170.(c) decorated with posters 'With' is the fixed preposition used with 'decorated.' Therefore, 'decorated with posters' is the correct form.

Q.171 Had I known about the delay, I <u>will wait</u>.
A. (a) would have waited

C. (c) would waited
D. (d) waited
Ans: (a)

Q.172 She <u>said me</u> the truth.
A. (a) told me
B. (b) said to me

D. (d) spoke to me
Ans: (a)
Exp: Sol.172.(a) told me The verb "say" is not directly followed by an object like "me." To convey the meaning correctly, we use "tell someone something." Therefore, the correct sentence is "She told me the truth."

Q.173 He <u>is living here since 2020</u>.

B. (b) He has been living here since 2020.
C. (c) He lives here since 2020.
D. (d) He is here since 2020.
Ans: (b)
Exp: Sol.173.(b) He has been living here since 2020. When an action started in the past and continues up to the present, we use the present perfect continuous tense (has/have been + ing verb). Therefore, the correct sentence is "He has been living here since 2020."

Q.174 He behaves as if he <u>knows</u> everything.
A. (a) known everything
B. (b) knew everything
C. (c) has known everything
D. (d) have known all
Ans: (b)
Exp: Sol.174.(b) knew everything Simple past tense is used after the phrase 'as if / as though'. 'Knew' is the past form of the verb 'know'. Hence, 'knew everything' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.175 Sujata <u>put in</u> the best dress for the party.
A. (a) put off
B. (b) put across
C. (c) put on
D. (d) put out
Ans: (c)
Exp: Sol.175.(c) put on The phrasal verb 'put on' means to wear a dress. The given sentence states that Sujata put on the best dress for the party. Hence, 'put on' is the most appropriate answer.

Q.176 She did her work very <u>good</u>.
A. (a) very well
B. (b) too well
C. (c) quite good
D. (d) really great
Ans: (a)
Exp: Sol.176.(a) very well The given sentence needs an adverb 'well' to modify the verb 'work', not the adjective 'good'. Hence, 'very well' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.177 She was <u>not enough tall</u> to play basketball.
A. (a) too short
B. (b) not tall
C. (c) very short
D. (d) not tall enough
Ans: (d)
Exp: Sol.177.(d) not tall enough The adverb 'enough' is unique as it is used after the adjective. Here, 'enough' will be used after the adjective 'tall'. Hence, 'not tall enough' is the most appropriate answer.

Q.178 She succeeded <u>by virtue of</u> her talent.
A. (a) owing of
B. (b) because
C. (c) cause of
D. (d) due to
Ans: (d)
Exp: Sol.178.(d) due to The phrases 'due to' and 'by virtue of are both similar in meaning as they tell us the reason or cause. Similarly, in the given sentence, her talent is the reason for her success. Hence, 'due to' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.179 She <u>has did her homework</u> already.
A. (a) made homework
B. (b) done her homework
C. (c) made her homework
D. (d) doing her homework
Ans: (b)
Exp: Sol.179.(b) done her homework With 'has/have/had', the third form of the verb is used. 'Done' is the correct third form. Hence, 'done her homework' is the most appropriate answer.

Q.180 We <u>enjoyed during</u> the party last night.

D. (d) enjoyed in the party
Ans: (b)
Exp: Sol.180.(b) enjoyed ourselves at the party There are some verbs that take a reflexive pronoun if these are used without an object. For example: enjoy, avail, hurt, resign, introduce. The pronoun 'we' takes the reflexive pronoun 'ourselves'. Hence, 'enjoyed ourselves at the party' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.181 You must <u>refrain to smoke</u>.
A. (a) quit from smoke
B. (b) stop to smoke
C. (c) stop of smoking
D. (d) refrain from smoking
Ans: (d)
Exp: Sol.181.(d) refrain from smoking 'From' is a fixed preposition used with the verb 'refrain / abstain / prevent'. Hence, 'refrain from smoking' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.182 The criminal was accused <u>for</u> theft.
A. (a) of theft
B. (b) on theft
C. (c) about theft
D. (d) with theft
Ans: (a)
Exp: Sol.182.(a) of theft 'Of' is a fixed preposition used with the verb 'accused'. Hence, 'of theft' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.183 I <u>have visited</u> Delhi last year.
A. (a) had visited
B. (b) visited
C. (c) was visiting

Ans: (b)

Q.184 The fiction and non fictional book, <u>that</u> I borrowed, was interesting.

Ans: (d)

Q.185 None of the <u>option</u> seems appropriate.
A. (a) Any of the optionals

D. (d) None of the options
Ans: (d)

Exam: SSC Stenographer 08/08/2025 (Shift 3)

Q.186 She gave me many <u>informations</u>.
A. (a) many pieces of information

Q.5 'A prolonged and bitter quarrel or dispute'.
A. Consensus
B. Amity
C. Feud
D. Concord

<script>
    const TOPICS = ["Spot the Error", "Sentence Improvement", "Narration", "Voice", "Parajumble", "Cloze Test", "One Word Substitution", "Idioms", "Synonyms", "Antonyms", "Spellings", "Homonyms", "Miscellaneous"];

    const RAW_DATA = { 
        "Spot the Error": `
Q.1 Neither the students nor the teacher (1)/ were ready for the sudden fire drill, (2)/ leading to a moment of confusion (3)/ before everyone evacuated. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: 'Were' should be replaced with 'was'. When 'neither... nor' connects two subjects, the verb agrees with the subject closest to it. In this case, 'the teacher' is singular, so the verb should be singular ('was'). Hence, 'was ready for the sudden fire drill' is the most appropriate answer.
Exam: SSC CGL 12/09/2025 (Shift 1)

Q.2 The profound implications of the burgeoning quantum theories (1)/, a field still largely inscrutable to the uninitiated, remains a contentious subject (2)/ amongst the most eminent physicists (3)/ engaging in spirited academic discourse. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: 'Remains' must be replaced with 'remain'. The subject of the sentence is 'The profound implications' (plural). The phrase 'a field still largely inscrutable to the uninitiated' provides additional information about 'quantum theories' but does not change the number of the main subject. Therefore, a plural verb is required. Hence, 'remain a contentious subject' is the most appropriate answer.
Exam: SSC CGL 12/09/2025 (Shift 1)

Q.3 The myriad challenges confronting modern urban planners (1)/, ranging from sustainable infrastructure to social equity, often demands (2)/ an interdisciplinary approach (3)/ to yield effective solutions. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: 'Demands' must be replaced with 'demand'. The subject of the sentence is 'The myriad challenges' (plural). The phrase 'confronting modern urban planners' is a participial phrase modifying the subject and does not change its number. Therefore, a plural verb is required. Hence, 'often demand' is the most appropriate correction.
Exam: SSC CGL 12/09/2025 (Shift 2)

Q.4 The manager, along with her entire team, (1)/ expects that the project will be completed (2)/ before the deadline, and they shall submits (3)/ the final report on Friday. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: 'Submits' must be replaced with 'submit'. When using modal verbs like 'shall' (or 'will', 'can', 'may', etc.), the main verb that follows must be in its base form. Therefore, 'shall submit' is the correct form. Hence, 'and they shall submit' is the most appropriate correction.
Exam: SSC CGL 12/09/2025 (Shift 2)

Q.5 The committee's objectives included (1)/ increasing membership, improving communication channels, and (2)/ to foster a sense of community (3)/ among its diverse members. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: According to the 'Rule of Parallelism', two or more words or phrases in a list must be in the same form. In the given sentence, "increasing membership" and "improving communication channels" are gerund phrases. "To foster a sense of community" is an infinitive phrase. To maintain parallelism, the third item should also be a gerund phrase. Hence, "and fostering a sense of community" is the most appropriate answer.
Exam: SSC CGL 12/09/2025 (Shift 3)

Q.6 The unique challenges of the project, including its remote location (1)/ and the unpredictable weather patterns, (2)/ makes its successful completion (3)/ a testament to the team's resilience. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: According to the 'Subject-Verb Agreement Rule', a singular subject always takes a singular verb and a plural subject always takes a plural verb. In the given sentence, the main subject is "The unique challenges," which is plural. Therefore, the verb should also be plural ("make") instead of singular ("makes"). Hence, "make its successful completion" is the most appropriate answer.
Exam: SSC CGL 12/09/2025 (Shift 3)

Q.7 The venerable institution aims to both preserve ancient texts (1)/ and promoting critical scholarship (2)/ among its burgeoning community (3)/ of young researchers. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: 'Both ... and' is a fixed conjunction pair and the same part of speech should be used after each. Therefore, 'promoting' must be replaced with 'promote' to match the form of the verb 'preserve'. Hence, 'and promote critical scholarship' is the most appropriate answer.
Exam: SSC CGL 13/09/2025 (Shift 1)

Q.8 The profound impact of digital technology on societal norms (1)/, a phenomenon universally acknowledged by sociologists, (2) / are increasingly becoming a topic (3) / of interdisciplinary academic debate. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: 'Are' must be replaced with 'is'. The subject of the sentence is 'The profound impact' (singular). Therefore, a singular verb is required. Hence, 'is increasingly becoming a topic' is the most appropriate answer.
Exam: SSC CGL 13/09/2025 (Shift 1)

Q.9 She was confident that her plan would succeed, (1)/ for it was not only innovative (2)/ but also it was thoroughly tested (3)/ by an independent team. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: 'Not only ... but also' is a fixed conjunction pair and the same part of speech is used after them. As there is an adjective after 'not only', we need to use an adjective after 'but also'. Therefore, 'it was' must be removed. Hence, 'but also thoroughly tested' is the most appropriate answer.
Exam: SSC CGL 13/09/2025 (Shift 2)

Q.10 What the ancient philosophers believed about the nature of reality (1)/ and the purpose of human existence (2)/ remain a subject of intense debate (3)/ among contemporary thinkers. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: The error is in subject-verb agreement. The subject of the sentence is the noun clause "What the ancient philosophers believed about the nature of reality and the purpose of human existence." Even though it describes multiple concepts, the clause itself functions as a singular entity. Therefore, the verb should be singular, "remains". Hence, 'remains a subject of intense debate' is the most appropriate answer.
Exam: SSC CGL 13/09/2025 (Shift 2)

Q.11 The increase in the number of unresolved Cases (1) / and the lack of clear guidelines from the authorities (2)/ has contributed significantly to the confusion (3)/ surrounding the recent procedural changes. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: In the given sentence, there are two subjects joined by the conjunction 'and', which makes the subject plural. Therefore, 'has' must be replaced with the plural verb 'have'. Hence, 'have contributed significantly to the confusion' is the most appropriate answer.
Exam: SSC CGL 13/09/2025 (Shift 3)

Q.12 The list of recommended candidates for various regional posts (1)/ were prepared in haste without proper background checks, (2)/ which resulted in several administrative complications (3)/ during the initial phase of deployment. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: In the given sentence, the main subject is 'The list', which is singular. Therefore the singular verb 'was' will be used instead of 'were'. Hence, 'was prepared in haste without proper background checks' is the most appropriate answer.
Exam: SSC CGL 13/09/2025 (Shift 3)

Q.13 The principal emphasized that it was not only a lack of funding for extracurricular activities (1)/ that disheartened students, but the inconsistent support from parents and faculty (2)/ which, despite being crucial for success, (3)/ contribute to a decline in overall participation rates. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: D
Exp: According to the Subject-Verb Agreement Rule, a singular subject always takes a singular verb, and a plural subject always takes a plural verb. In the given sentence, the subject "the inconsistent support" is singular, so it must take a singular verb. Hence, "contributes to a decline" is the most appropriate answer.
Exam: SSC CGL 14/09/2025 (Shift 1)

Q.14 The proposal seeks to neither expand existing facilities (1)/ nor hire additional staff members (2)/ until the budget allocation (3)/ for the next fiscal year is confirmed. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: When "neither...nor" follows an infinitive (to + verb), the correct position of "neither" should be after the infinitive marker "to." Hence, "seeks to expand neither existing facilities" is the most appropriate answer.
Exam: SSC CGL 14/09/2025 (Shift 1)

Q.15 The committee, which oversee multiple departments, (1)/ has been granted additional funds (2)/ to implement the new sustainability policies (3)/ across all regional offices. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: According to the "Subject-Verb Agreement Rule," a singular subject always takes a singular verb and a plural subject always takes a plural verb. In the given sentence, the subject "committee" is a collective noun and acts as a single unit. Hence, "which oversees multiple departments" is the most appropriate answer.
Exam: SSC CGL 14/09/2025 (Shift 2)

Q.16 The emergence of new infectious variants (1)/ amid inconsistent global vaccination efforts (2)/ have reignited debates on public health preparedness (3)/ and international cooperation. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: According to the "Subject-Verb Agreement Rule", a singular subject always takes a singular verb and a plural subject always takes a plural verb. In the given sentence, the subject "The emergence" is singular. Hence, "has reignited" is the most appropriate answer.
Exam: SSC CGL 14/09/2025 (Shift 2)

Q.17 That the experimental results contradict prior findings (1)/ and challenges established theories (2)/ suggests the need for further investigation (3)/ into the novel methodology. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: In the given sentence, the subject is a 'that-clause' (That the experimental results contradict prior findings and challenges established theories). There is one clause, which is considered singular. Accordingly, the given sentence uses the singular verb 'suggests', which is the main verb. However, 'that-clause' consists of a plural subject 'results' and two verbs 'contradict' and 'challenges'. Therefore, the plural verb 'challenge' will be used. Hence, 'and challenges established theories' is the most appropriate answer.
Exam: SSC CGL 14/09/2025 (Shift 3)

Q.18 She had barely finished writing her essay (1)/ then the power went out, (2)/ leaving her work unsaved (3)/ and her progress lost. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: 'Barely' forms a pair with 'when', not 'then'. Hence, 'when the power went out' is the most appropriate answer.
Exam: SSC CGL 14/09/2025 (Shift 3)

Q.19 The professor postponed the discussion (1)/ until the research would be published (2)/ to maintain confidentiality (3)/ of the findings. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: After "until", we use the simple present tense to refer to a future event. Hence, "until the research is published" is the most appropriate answer.
Exam: SSC CGL 15/09/2025 (Shift 1)

Q.20 Were she to have known about the danger (1)/ she might have taken (2)/ different precautions to ensure her safety (3)/ and avoid the unfortunate incident. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: This is an inverted third conditional sentence. The correct structure for an inverted third conditional is "Had + subject + past participle." Hence, "Had she known about the danger" is the most appropriate answer.
Exam: SSC CGL 15/09/2025 (Shift 1)

Q.21 Neither the students nor the teacher (1)/ were aware that the schedule (2)/ for the annual function (3)/ have been changed by the principal. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: D
Exp: If the paired conjunctions 'either...or', 'neither...nor', 'not only...but also' are used, the verb agrees with the subject closest to it. Here, the nearest subject is "teacher", which is singular. Hence, "has been changed" is the most appropriate answer.
Exam: SSC CGL 15/09/2025 (Shift 2)

Q.22 The new algorithm, designed to process vast amounts of data, (1)/ promises to revolutionise our approach to analytics, (2)/ but it also rises concerns (3)/ about data privacy and ethical implications. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: 'Rises' must be replaced with 'raises'. 'Rise' means to move upwards or get up, while 'raise' means to bring up a topic for debate or discussion. In this context, concerns are being brought up, so 'raises' is the correct verb. Hence, 'but it also raises concerns' is the most appropriate answer.
Exam: SSC CGL 15/09/2025 (Shift 3)

Q.23 The consensus was, not that the data itself was flawed, but that its interpretation by the junior analysts (1)/ were overly optimistic (2)/ given the volatile market conditions (3)/ and the inherent uncertainties. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: The main subject of the verb in this part of the sentence is "its interpretation" (singular), not "analysts" (plural). Therefore, the verb should be singular 'was', not plural 'were'. The correct phrasing should be "was overly optimistic". Hence, 'was overly optimistic' is the most appropriate answer.
Exam: SSC CGL 15/09/2025 (Shift 3)

Q.24 The committee has postponed (1)/ the announcement until (2)/ further informations is received (3)/ from the regional offices. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: Some Nouns like Cattle, work, Information, Scenery, Furniture, etc. are always written in the singular form so we can't make their plural form. Hence, "further information is" is the most appropriate answer.
Exam: SSC CGL 16/09/2025 (Shift 1)

Q.25 Neither the scientists nor the research team (1)/ were willing to compromise (2)/ on the accuracy of the findings (3)/ despite external pressure. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: "Neither...nor" is a conjunction pair that is used only for two subjects, and the verb is supplied according to the subject closest to the verb. Here, the nearest subject is "the research team," which is singular. Hence, "were willing to compromise" is the most appropriate answer.
Exam: SSC CGL 16/09/2025 (Shift 1)

Q.26 The central bank's decision not only aimed to curve inflation (1)/ but also intended to stimulate economic growth, (2)/ a dual objective that proved challenging (3)/ to balance effectively. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: The use of 'curve' is incorrect in this sentence. Rather, we need to use the word 'curb', which means to control inflation. Hence, "The central bank's decision not only aimed to curb inflation" is the most appropriate answer.
Exam: SSC CGL 16/09/2025 (Shift 2)

Q.27 Hardly did the manager knew (1)/ that his decision would (2)/ trigger such a massive protest (3)/ among the employees. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: When the auxiliary verb do, does, or did is used, the main verb must be in its base form. Hence, "Hardly did the manager know" is the most appropriate answer.
Exam: SSC CGL 16/09/2025 (Shift 3)

Q.28 What we need right now (1)/ are a strong leader (2)/ who can unite the team (3)/ and restore confidence. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: According to the "Subject-Verb Agreement Rule", a singular subject always takes a singular verb and a plural subject always takes a plural verb. In the given sentence, the subject "What we need right now", is singular, so the verb should also be singular. Hence, "is a strong leader" is the most appropriate answer.
Exam: SSC CGL 16/09/2025 (Shift 3)

Q.29 The new research facility (1)/ is equipped with advanced instruments (2)/ that allows scientists to conduct (3)/ complex molecular experiments. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: According to the "Subject-Verb Agreement Rule", a singular subject always takes a singular verb and a plural subject always takes a plural verb. In the given sentence, the subject "instruments" is plural, so the verb should also be plural. Hence, "that allow scientists to conduct" is the most appropriate answer.
Exam: SSC CGL 17/09/2025 (Shift 1)

Q.30 Not only did the committee reject the proposal (1)/ for its impracticality, but also criticized (2)/ the team for poor presentation. (3)/ No error (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: According to the Rule of Parallelism, when two or more verbs are connected by conjunctions such as and, or, nor, not only... but also, they must be in the same grammatical form. Hence, "but also criticize" is the most appropriate answer.
Exam: SSC CGL 17/09/2025 (Shift 1)

Q.31 The fishermen caught many fishes (1)/ from the lake yesterday (2)/ and sold them in the market (3)/ at a good price. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: Generally, the plural of 'fish' is 'fish'. 'Fishes' is used only when there is a mention of different species of fish. But there is no such mention in the sentence. Hence, 'The fisherman caught many fish' is the most appropriate answer.
Exam: SSC CGL 17/09/2025 (Shift 2)

Q.32 Seldom we realize (1)/ how fortunate we are (2)/ to have access to clean water (3)/ and healthy food. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: After a negative adverb like 'seldom', inversion is required. Inversion is a structure in which the helping verb comes before the subject and the main verb comes after the subject. The helping verb 'do' will be used for the plural subject 'we'. Hence, 'Seldom do we realize' is the most appropriate answer.
Exam: SSC CGL 17/09/2025 (Shift 2)

Q.33 The committee is committed (1)/ for ensuring that all members (2)/ have an equal opportunity (3)/ to voice their opinions. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: 'To' is a fixed preposition used after the adjective 'committed' to indicate purpose or dedication. Hence, "committed to ensuring" is the most appropriate answer.
Exam: SSC CGL 17/09/2025 (Shift 3)

Q.34 It was not until she finished her degree (1)/ and gained some experience (2)/ did she feel confident enough (3)/ to start her own business. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: The structure "It was not until" requires that the clause which follows should be in the affirmative form, not in the interrogative structure. Hence, "that she felt confident" is the most appropriate answer.
Exam: SSC CGL 17/09/2025 (Shift 3)

Q.35 After years of hard work (1)/ he finally decided to call off from (2)/ his struggling business and start anew (3)/ in a different field. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: The phrasal verb 'call off' does not take any preposition after it. 'Call off' means to cancel or abandon. Therefore, 'from' must be removed. Hence, 'he finally decided to call off' is the most appropriate answer.
Exam: SSC CGL 18/09/2025 (Shift 1)

Q.36 The museum, which located near the river, (1)/ attracts thousands of visitors (2)/ every year for its rare collection (3)/ of ancient manuscripts. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: In the given sentence, there is a relative clause (which located near the river) after the subject 'The museum'. In the relative clause, there is no verb after the pronoun 'which'. Here, we need to use the singular verb 'is' for the singular antecedent 'The museum'. Hence, 'The museum, which is located near the river' is the most appropriate answer.
Exam: SSC CGL 18/09/2025 (Shift 1)

Q.37 The main actor, as well as the supporting cast, (1)/ were praised (2)/ for their outstanding performance (3)/ in the play. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: When two subjects are joined by "along with," "as well as," or "in addition to," the verb agrees with the first subject. Here, the first subject is "The main actor," which is singular. Hence, "was praised" is the most appropriate answer.
Exam: SSC CGL 18/09/2025 (Shift 2)

Q.38 The minister assured that (1)/ all possible measures (2)/ were being taken to address (3)/ the crisis effectively. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: The verb "assured" when used with a direct object usually follows the structure "assured someone that..." In the given sentence, there is no object after "assured." Hence, "assured the public that" or "assured the people (or us) that" is the most appropriate answer.
Exam: SSC CGL 18/09/2025 (Shift 2)

Q.39 He seldom if never (1)/ visits his family, (2)/ even though they live (3)/ in the same town. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: 'Seldom if never' should be replaced with 'seldom if ever'. The correct phrase is 'seldom if ever', meaning very rarely or almost never. 'Seldom if never' is grammatically incorrect. Hence, 'He seldom if ever' is the most appropriate answer.
Exam: SSC CGL 18/09/2025 (Shift 3)

Q.40 The committee recommended that the proposal (1)/ is reviewed by an independent expert (2)/ to ensure impartiality (3)/ before final approval. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: 'Is reviewed' should be replaced with 'be reviewed'. After verbs like 'recommend, suggest, insist, demand' the subjunctive mood ("be + V3" for passive structure) is used. Hence, "be reviewed by an independent expert" is the most appropriate answer.
Exam: SSC CGL 18/09/2025 (Shift 3)

Q.41 He drives (1)/ very reckless (2)/ on the highway, ignoring (3)/ all traffic rules. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: The word reckless is an adjective, but after very, we need an adverb to describe the verb drives. Hence, "very recklessly" is the most appropriate answer.
Exam: SSC CGL 19/09/2025 (Shift 1)

Q.42 So profound was the impact (1)/ of the new policy that it not only changed recruitment standards (2)/ but also reduced with overall efficiency (3)/ across departments. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: The verb "reduce" is a transitive verb, meaning it directly takes an object without needing a preposition. Hence, "reduced overall efficiency" is the most appropriate answer.
Exam: SSC CGL 19/09/2025 (Shift 1)

Q.43 The committee, comprising (1)/ experts from various fields, (2)/ have submitted its report to the governing (3)/ body for review and approval. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: 'Committee' is a collective noun which is generally considered singular. Therefore, 'have' must be replaced with the singular verb 'has'. Hence, "has submitted its report to the governing" is the most appropriate answer.
Exam: SSC CGL 19/09/2025 (Shift 2)

Q.44 The number of participants (1)/ in the advanced workshop (2)/ were surprisingly low (3)/ given the extensive promotion. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: "The number + of + plural noun + singular verb" is the correct grammatical structure. Therefore, 'were' must be replaced with the singular verb 'was'. Hence, 'was surprisingly low' is the most appropriate answer.
Exam: SSC CGL 19/09/2025 (Shift 2)

Q.45 She emphasized on (1)/ the need for (2)/ regular practice (3)/ to improve performance. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: The verb "emphasize" is not followed by "on." It is a transitive verb that takes a direct object. Hence, "emphasized the need for" is the most appropriate answer.
Exam: SSC CGL 19/09/2025 (Shift 3)

Q.46 Neither of the applicants (1)/ have submitted (2)/ the required documents (3)/ to the office yet. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: The phrase "neither of" is always singular, so it must be followed by a singular verb. Hence, "applicants has submitted" is the most appropriate answer.
Exam: SSC CGL 19/09/2025 (Shift 3)

Q.47 The newly discovered species was (1)/ quite unique, possessing characteristics (2)/ that set it apart from (3)/ all its known relatives. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: 'Unique' is an absolute or non-gradable adjective. This means we cannot use any quantifier with it. Therefore, 'quite' must be removed. Hence, 'unique, possessing characteristics' is the most appropriate answer.
Exam: SSC CGL 20/09/2025 (Shift 1)

Q.48 The committee insisted that (1)/ each member provides a written report (2)/ before the final presentation (3)/ scheduled next week. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: After verbs like insist, suggest, recommend, demand, request, we use the subjunctive mood, where the base form of the verb (without "-s") follows that. Hence, "each member provides a written report" is the most appropriate answer.
Exam: SSC CGL 20/09/2025 (Shift 2)

Q.49 The director explained that (1)/ the report was delayed (2)/ because the data (3)/ was not yet collected. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: D
Exp: The main verb "explained" is in the past tense, indicating that the action of data collection occurred earlier. Therefore, the correct tense should be past perfect passive. Hence, "data had not yet been collected" is the most appropriate form.
Exam: SSC CGL 20/09/2025 (Shift 2)

Q.50 The company plans to hire (1)/ new group of interns (2)/ to assist with the upcoming (3)/ marketing campaign this summer. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: In the given sentence, the noun "group" is singular and countable, so it requires the article "a" before it. Hence, "a new group of interns" is the most appropriate answer.
Exam: SSC CGL 20/09/2025 (Shift 3)

Q.51 That the expedition faced unforeseen challenges (1)/ in the treacherous mountain terrain (2)/ were evident from their delayed return (3)/ and exhausted appearance. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: The subject of the sentence is the noun clause "That the expedition faced unforeseen challenges in the treacherous mountain terrain". As there is only one noun clause, the subject is singular. Therefore, the verb should be singular 'was', not plural 'were'. Hence, 'was evident from their delayed return' is the most appropriate answer.
Exam: SSC CGL 21/09/2025 (Shift 1)

Q.52 The sudden influx of tourists, (1)/ attracted by the newly opened resort, (2)/ have caused significant strain (3)/ on the local infrastructure. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: In the given sentence, 'The sudden influx' is a singular subject that will take a singular verb. Therefore, 'have' must be replaced with 'has'. Hence, 'has caused significant strain' is the most appropriate answer.
Exam: SSC CGL 21/09/2025 (Shift 1)

Q.53 The new decorative pillows (1)/ perfectly compliment the colors (2)/ of the sofa and the curtains, (3)/ tying the whole room together. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: In the given sentence, the word compliment is incorrectly used. The word compliment means to praise or express admiration, whereas complement means to complete or go well with something. Hence, "perfectly complement the colors" is the most appropriate answer.
Exam: SSC CGL 21/09/2025 (Shift 2)

Q.54 The research team concluded that (1)/ each participant must submit (2)/ their reports before (3)/ the deadline on Monday. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: 'Each participant' is a singular pronoun and we generally use 'his' for singular indefinite pronouns. Therefore, 'their' must be replaced with 'his'. Hence, 'his report before' is the most appropriate answer.
Exam: SSC CGL 21/09/2025 (Shift 3)

Q.55 The players in the national team (1)/ works tirelessly (2)/ to improve their performance (3)/ before every major tournament. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: In the given sentence, 'players' is a plural subject that will take a plural verb. Therefore, 'works' must be replaced with 'work'. Hence, 'work tirelessly' is the most appropriate answer.
Exam: SSC CGL 21/09/2025 (Shift 3)

Q.56 The CEO, along with his senior advisors, (1)/ are traveling to the international conference (2)/ to announce the company's (3)/ latest technological breakthrough. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: If paired phrases like "along with," "together with," or "as well as" are used, the verb agrees with the subject to which they are attached. In the given sentence, the subject "The CEO" is singular and is followed by "along with his senior advisors," so the correct verb is "is traveling." Hence, "is traveling" is the most appropriate answer.
Exam: SSC CGL 22/09/2025 (Shift 1)

Q.57 The strict rules of the library don't let students (1)/ to take more than two books (2)/ out at a time, which is often (3)/ inconvenient for researchers. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: The verb 'let' is followed by an object and then the bare infinitive(V1). Therefore, 'to' must be removed. Hence, 'take more than two books' is the most appropriate answer.
Exam: SSC CGL 22/09/2025 (Shift 2)

Q.58 My neighbor constantly complains for the noise coming from the children playing in the park.
A. coming from
B. in the park
C. My neighbor
D. complains for
Ans: D
Exp: The verb 'complain' is typically followed by the preposition 'about' or 'of' when stating the reason for the complaint, not 'for'. Hence, 'complains about the noise' is the most appropriate answer.
Exam: SSC CGL 22/09/2025 (Shift 2)

Q.59 The manager appreciated (1)/ not only her dedication (2)/ but also for her innovative ideas. (3)/ Everyone was motivated by her example. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: When using "not only ... but also", the structure should be parallel. In the given sentence, "her dedication" is a noun phrase, so "her innovative ideas" should also be a noun phrase. Therefore, "her innovative ideas" is the most appropriate correction.
Exam: SSC CGL 22/09/2025 (Shift 3)

Q.60 He seldom if never agrees to attend public events without thorough preparation.
A. seldom
B. never
C. attend
D. without
Ans: B
Exp: The correct phrase is "seldom if ever", which means rarely. Hence, 'seldom if ever' is the most appropriate answer.
Exam: SSC CGL 23/09/2025 (Shift 1)

Q.61 They are planning to build (1)/ a research centre near the river (2)/ where will scientists conduct (3)/environmental studies in the coming years. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: When the Wh-word (what, how, why, where, when, etc) is used to start a relative clause in a sentence, the helping verb and the main verb both are used after the subject in the clause. Therefore, modal 'will' should be used after the subject 'scientists'. Hence, 'where scientists will conduct' is the most appropriate answer.
Exam: SSC CGL 23/09/2025 (Shift 1)

Q.62 A large number of equipments were delivered to the warehouse (1)/ last week (2)/ to support the upcoming production schedule (3)/ without any delay. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: The word "equipment" is an uncountable noun and does not have a plural form. Therefore, "equipments" is incorrect and should be "equipment." Hence, "A large number of equipment were" is the most appropriate answer.
Exam: SSC CGL 23/09/2025 (Shift 2)

Q.63 The cybersecurity team is proficient for detecting (1)/ vulnerabilities in legacy systems that often evade (2)/ conventional monitoring tools and protocols (3)/ during routine audits. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: 'In' is a fixed preposition used after the adjective 'proficient' to indicate skill in doing something. The given sentence uses "proficient for detecting", which is incorrect. Hence, "proficient in detecting" is the most appropriate correction.
Exam: SSC CGL 23/09/2025 (Shift 3)

Q.64 Had she not postponed the meeting several times, (1)/ the committee would have had a greater opportunity (2)/ to discussing the budget allocations in detail (3)/ before the quarterly report was finalized. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: After "to", we use the base form of the verb, not the gerund (-ing form). Hence, "opportunity to discuss" is the most appropriate answer.
Exam: SSC CGL 23/09/2025 (Shift 3)

Q.65 She enjoys reading novels (1)/, listening to music (2)/ and to paint landscapes (3)/ during her free time. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: In the given sentence, there is an error of parallelism. 'Enjoys' is the main verb (finite verb) and there are three non-finite verbs after it. 'Enjoy' is followed by a gerund. The two verbs are in gerund form (reading, listening). The third verb 'to paint' must be replaced with the gerund form 'painting'. Hence, 'and painting landscapes' is the most appropriate answer.
Exam: SSC CGL 24/09/2025 (Shift 1)

Q.66 The ancient tree is famous for (1)/ it's beautiful, sprawling branches (2)/ which provide shade for the entire park (3)/during the hot summer months. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: The word "It's" is a contraction and should be used where a sentence would read "it is." "Its," with no apostrophe, is the possessive pronoun, used for nouns without gender. In the given sentence, the branches belong to the tree, so the possessive pronoun is required. Hence, "Its beautiful, sprawling branches" is the most appropriate answer.
Exam: SSC CGL 24/09/2025 (Shift 2)

Q.67 The volunteers served sandwiches (1)/ to all the hungry children (2)/ at the shelter on paper plates (3)/ decorated with colorful patterns. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: The phrase "on paper plates" is meant to describe how the sandwiches were served, but its placement in the sentence makes it sound like the children or the shelter were on the plates. It should be placed closer to the word it modifies. Hence "The volunteers served sandwiches on paper plates to all the hungry children at the shelter" is the most appropriate answer.
Exam: SSC CGL 24/09/2025 (Shift 2)

Q.68 The volunteers, (1)/ while collecting supplies for the flood victims, (2)/ the storage facility was inspected (3)/ for safety compliance. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: In the given sentence, 'The volunteers' is the subject and the phrase 'while collecting supplies for the flood victims' modifies the subject. Here, 'The volunteers' is the doer of the action (inspecting), therefore, the verb should be in the active form, not in the passive form. Therefore, 'the storage facility was inspected' must be replaced with 'inspected the storage facility'. Hence, 'inspected the storage facility' is the most appropriate answer.
Exam: SSC CGL 24/09/2025 (Shift 3)

Q.69 She apologised (1)/ for the delay and (2)/ promised to submit (3)/ the report soon. (4)
A. (4)
B. (1)
C. (3)
D. (2)
Ans: D
Exp: 'For' is used with the verb 'apologise' to indicate the reason for apology. Similarly, in the given sentence, 'delay' is the reason for apologizing. Hence, 'for the delay' is the most appropriate answer.
Exam: SSC CGL 25/09/2025 (Shift 1)

Q.70 Hardly had the preliminary review been completed (1)/ when the auditors noticed (2)/ that several financial projections (3)/ was calculated using outdated parameters. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: D
Exp: In the given sentence, 'several projections' is a plural subject that will take a plural helping verb. Therefore, 'was' must be replaced with 'were'. Hence, 'were calculated using outdated parameters' is the most appropriate answer.
Exam: SSC CGL 25/09/2025 (Shift 1)

Q.71 If the guidelines is enforced strictly (1)/ every participating institution (2)/ will be required to update its database (3)/ before the annual review begins. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: According to the "Subject-Verb Agreement Rule", the verb must match the noun (subject) in number. Here, the noun "guidelines" is plural, so it must take a plural verb. Hence, "If the guidelines are enforced strictly" is the most appropriate answer.
Exam: SSC CGL 25/09/2025 (Shift 2)

Q.72 The coordinator carefully explained about the revised procedures (1)/ to all the participants during the orientation session (2)/ so that everyone could follow the updated guidelines (3)/ without any confusion or delay. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: Verbs like "explain, mention, discuss, emphasise, enter, accompany, etc," do not take any preposition when used with an object. Therefore, 'about' must be removed. Hence, "The coordinator carefully explained the revised procedures" is the most appropriate answer.
Exam: SSC CGL 25/09/2025 (Shift 3)

Q.73 The novice programmer made (1) / a blunder mistake (2) / in the coding, which (3) / crashed the entire system. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: 'Blunder mistake' is a superfluous expression. 'Blunder' means a huge mistake. So, we cannot use 'mistake' and 'blunder' together. Therefore, 'mistake' will be removed. Hence, 'a blunder' is the most appropriate answer.
Exam: SSC CGL 25/09/2025 (Shift 3)

Q.74 Had the manager explained the policy clearly (1)/ to the staff members, (2)/ they would not have made (3)/ so many confusions. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: D
Exp: The word "confusion" is an uncountable noun and does not have a plural form. 'Much' is used with uncountable nouns, not 'many'. Hence, "so much confusion" is the most appropriate answer.
Exam: SSC CGL 26/09/2025 (Shift 1)

Q.75 The manager distributed (1)/ many important informations (2)/ during the morning briefing, (3)/ causing some confusion. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: The word 'information' is an uncountable noun and does not have a plural form. It should be used as 'many pieces of important information'. Hence, 'many pieces of important information' is the most appropriate answer.
Exam: SSC CGL 26/09/2025 (Shift 2)

Q.76 The company has decided (1)/ to implement new strategies (2) in order to boost its sale (3)/ and improve customer satisfaction. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: The word "sale" (singular) usually refers to a single transaction or act of selling, while "sales" (plural) refers to overall revenue, business performance, or multiple transactions. Hence, "in order to boost its sales" is the most appropriate answer.
Exam: SSC CGL 26/09/2025 (Shift 3)

Q.77 The manager appreciated (1)/ not only her dedication (2)/ but also for her innovative ideas. (3)/ Everyone was motivated by her example. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: When using "not only ... but also", the structure should be parallel. In the given sentence, "her dedication" is a noun phrase, so "her innovative ideas" should also be a noun phrase. Therefore, "her innovative ideas" is the most appropriate correction.
Exam: SSC CGL 14/10/2025 (Shift 1)

Q.78 He seldom if never (1)/ visits his family, (2)/ even though they live (3)/ in the same town. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: 'Seldom if never' should be replaced with 'seldom if ever'. The correct phrase is 'seldom if ever', meaning very rarely or almost never. 'Seldom if never' is grammatically incorrect. Hence, 'He seldom if ever' is the most appropriate answer.
Exam: SSC CGL 14/10/2025 (Shift 1)

Q.79 Neither of the applicants (1)/ have submitted (2)/ the required documents (3)/ to the office yet. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: The phrase "neither of" is always singular, so it must be followed by a singular verb. Hence, "applicants has submitted" is the most appropriate answer.
Exam: SSC CGL 14/10/2025 (Shift 1)

Q.80 The training programme of the new coach was (1)/ more effective than the previous coach, (2)/ as it offered better structure and helped (3)/ participants stay focused for a greater portion of the day. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: In the given sentence, the comparison is between the training programmes, not the coaches. Therefore, 'the previous coach' must be replaced with 'that of the previous coach'. Hence, 'more effective than that of the previous coach' is the most appropriate answer.
Exam: SSC CGL 14/10/2025 (Shift 2)

Q.81 The unique challenges of the project, including its remote location (1)/ and the unpredictable weather patterns, (2)/ makes its successful completion (3)/ a testament to the team's resilience. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: According to the 'Subject-Verb Agreement Rule', a singular subject always takes a singular verb and a plural subject always takes a plural verb. In the given sentence, the main subject is "The unique challenges," which is plural. Therefore, the verb should also be plural ("make") instead of singular ("makes"). Hence, "make its successful completion" is the most appropriate answer.
Exam: SSC CGL 14/10/2025 (Shift 3)

Q.82 That the expedition faced unforeseen challenges (1)/ in the treacherous mountain terrain (2)/ were evident from their delayed return (3)/ and exhausted appearance. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: The subject of the sentence is the noun clause "That the expedition faced unforeseen challenges in the treacherous mountain terrain". As there is only one noun clause, the subject is singular. Therefore, the verb should be singular 'was', not plural 'were'. Hence, 'was evident from their delayed return' is the most appropriate answer.
Exam: SSC CGL 14/10/2025 (Shift 3)

Q.83 Find the part of the sentence that contains an error: The suspect was charged (1)/ of murder after (2)/ the police found (3)/ the weapon in his car. (4)
A. The suspect was charged (1)
B. of murder after (2)
C. the police found (3)
D. the weapon in his car. (4)
Ans: B
Exp: The verb "charged" is followed by the preposition "with" when we talk about accusing someone of a crime. Hence, 'charged with murder' is the most appropriate answer.
Exam: Matriculation Level 24/07/2025 (Shift - 1)

Q.84 Find the part of the sentence that contains an error: We walked (1) / across the riverbank (2) / and rested (3) / under the old bridge. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: 'Across' must be replaced with 'along'. 'Across' is used when moving from one side to the other. 'Along' is used to indicate the movement next to something long such as a road or a river. The given sentence talks about walking beside the riverbank. Hence, 'along the riverbank' is the most appropriate answer.
Exam: Matriculation Level 24/07/2025 (Shift - 1)

Q.85 Find the part of the sentence that contains an error: The victim went (1)/ to the police station (2)/ to lodge (3)/ a FIR. (4)
A. victim went (1)
B. to the police station (2)
C. lodge (3)
D. a FIR. (4)
Ans: D
Exp: The article 'an' is used before the words starting with a vowel sound. Similarly, in the given sentence, the word 'FIR' starts with a vowel sound. Hence, 'to lodge an FIR' is the most appropriate answer.
Exam: Matriculation Level 24/07/2025 (Shift - 1)

Exp: When the phrase 'By the time' is used with simple present tense, future perfect tense is used in the 2nd clause. In the second clause, 'the final draft' is the subject, which receives the action rather than performs it. Therefore, passive voice structure will be used. 'Will have been + V3' is the correct passive structure for future perfect tense. Hence, 'will have been sent' is the most appropriate answer.

Q.135 Find the part of the sentence that contains an error: The teacher recommended that (1)/ each student submits (2)/ the assignment (3)/ by the end of the week. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: After verbs like 'recommend, suggest, insist, demand', the base form(V1) of the verb is used in the present tense even if the subject is plural. Therefore, 'submits' must be replaced with 'submit'. Hence, 'each student submit' is the most appropriate answer.
Exam: Graduate Level 24/07/2025 (Shift - 3)

Q.136 Find the part of the sentence that contains an erroг: The committee (1)/ turned down (2)/ the proposal (3)/ without stating the concerns out. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: D
Exp: 'Out' is not required in this sentence, therefore it must be removed. Hence, 'without stating the concerns' is the most appropriate answer.
Exam: Graduate Level 25/07/2025 (Shift - 3)

Q.137 Find the part of the sentence that contains an error: The HR officer followed up (1)/ on the complaints (2)/ but could not draw on (3)/ the main issues raised by employees. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: 'Draw on' must be replaced with 'draw out'. The phrasal verb 'draw out' means to elicit or extract information, which fits the context of identifying the main issues raised by employees. The given sentence talks about bringing out or identifying the key concerns. Hence, 'could not draw out' is the most appropriate answer.
Exam: Graduate Level 25/07/2025 (Shift - 3)

Q.138 Find the part of the sentence that contains an erroг: The supervisor (1) carried out (2)/ the inspection (3)/ without pointing any issue out. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: D
Exp: 'Out' is not required in this sentence, therefore it must be removed. Hence, 'without pointing any issue' is the most appropriate answer.
Exam: Graduate Level 26/07/2025 (Shift - 3)

Q.139 Find the part of the sentence that contains an error: The supervisor reached out (1)/ to the staff members (2)/ but could not figure up (3)/ the exact cause of the conflict. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: 'Figure up' must be replaced with 'figure out'. The phrasal verb 'figure out' means to understand or determine something after thinking about it. The given sentence talks about identifying the exact cause of the conflict. Hence, 'could not figure out' is the most appropriate answer.
Exam: Graduate Level 26/07/2025 (Shift - 3)

Q.140 Find the part of the sentence that contains an error: The scientist explained (1)/ that the experiment (2)/ was unsuccessful because the equipment (3)/ malfunctions during the final stage. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: D
Exp: The given sentence is in the simple past tense, therefore the past form of the verb will be used. 'malfunctions' must be replaced with 'malfunctioned'. Hence, 'malfunctioned during the final stage' is the most appropriate answer.
Exam: Graduate Level 28/07/2025 (Shift - 3)

Q.141 Find the part of the sentence that contains an error: The document was replete by errors (1)/ despite several rounds (2)/ of proofreading (3)/ by the editorial team. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: 'With' is the correct preposition to use here instead of 'by'. The expression 'replete with' means full of or filled with something. In the given sentence, the document is described as being full of errors. Hence, The document was replete with errors' is the most appropriate answer.
Exam: Graduate Level 28/07/2025 (Shift - 3)

Q.142 Find the part of the sentence that contains an error: The agreement (1)/ remained effective since three years (2)/ despite multiple challenges (3)/ from stakeholders. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: 'Since' is used to denote a point of time, which indicates the starting point of an action. 'For' is used for a fixed period of time (countable), such as 2 years, 3 months, or 4 days. In the given sentence, the phrase 'three years' indicates a duration, not a starting point. Therefore, 'since' must be replaced with 'for'. Hence, 'remained effective for three years' is the most appropriate answer.
Exam: Graduate Level 29/07/2025 (Shift - 3)

Q.143 Find the part of the sentence that contains an error: The committee's revised proposal (1)/ aimed at improving transparency (2)/ unexpectedly creating (3)/ new layers of administrative delay. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: C
Exp: The given sentence needs a finite verb to show what the proposal actually did. The word 'creating' is a present participle and cannot function as the main verb of the clause without an auxiliary verb. Therefore, 'creating' must be replaced with a finite verb such as 'created'. Hence, 'unexpectedly created' is the most appropriate answer.
Exam: Graduate Level 29/07/2025 (Shift - 3)

Q.144 Find the part of the sentence that contains an error: She is one of the best (1)/ dancer who (2)/ perform flawlessly (3)/ on stage. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: B
Exp: 'One of plural noun' is the correct grammatical structure. Therefore, the singular noun 'dancer' must be replaced with the plural noun 'dancers'. Hence, 'one of the best dancers who' is the most appropriate answer.
Exam: Graduate Level 31/07/2025 (Shift - 3)

Q.145 Find the part of the sentence that contains an error: Had they been understanding (1)/ the financial risks involved, (2)/ they would not have (3)/ invested so aggressively. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: The given sentence is an example of the third conditional sentence and 'had + subject + V3, subject + would have + V3' is the correct grammatical structure for it. Therefore, 'been understanding' must be replaced with the third form 'understood'. Hence, 'Had they understood' is the most appropriate answer.
Exam: Graduate Level 31/07/2025 (Shift - 3)

Q.146 Find the part of the sentence that contains an error: Her presentation displayed (1)/ strong arguments (2)/ yet it missed (3)/ structure and coherent. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: D
Exp: The conjunction 'and' is used to join two similar parts of speech. In the given sentence, 'structure and coherent' functions as the object of the verb 'missed', and the object must be a noun. 'Structure' is already a noun, so we need to replace the adjective 'coherent' with its noun form 'coherence' to maintain parallelism. Hence, 'structure and coherence' is the most appropriate answer.
Exam: Graduate Level 02/08/2025 (Shift - 3)

Q.147 Find the part of the sentence that contains an error: The company tried to bring over (1)/ fresh ideas (2)/ to improve customer (3)/ engagement strategies. (4)
A. (1)
B. (2)
C. (3)
D. (4)
Ans: A
Exp: 'Bring over' must be replaced with 'bring in'. The phrasal verb 'bring in' means to introduce or introduce something new. The given sentence talks about introducing new or fresh ideas to improve customer engagement strategies. Hence, 'tried to bring in fresh ideas' is the most appropriate answer.
Exam: Graduate Level 02/08/2025 (Shift - 3)

Q.148 Identify the error in the sentence. Of all the applicants, she was the smarter.
A. applicants
B. smarter
C. was
D. all
Ans: B
Exp: When there is a comparison between two persons or things, the comparative degree is used. But the given sentence compares one applicant with all the applicants, which means the comparison is made within a group of more than two. Therefore, the superlative degree 'smartest' will be used instead of 'smarter'. Hence, 'smartest' is the most appropriate answer.
Exam: Graduate Level 29/08/2025 (Shift - 1)

Q.149 Identify the error in the sentence. By the time they arrive, the concert had ended.
A. time
B. arrive
C. concert
D. ended
Ans: B
Exp: The given sentence is in the past tense, therefore, the past form of the verb (arrived) will be used. Hence, 'arrived' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.150 Find the incorrect part of the sentence: He was senior than me in college.
A. senior than
B. No error
C. me in college
D. He was
Ans: A
Exp: There are some words that imply comparison but do not take 'than'. Rather, 'to' is used with them. For example:- superior to, inferior to, prior to, senior to, junior to, elder to, etc. Hence, 'senior to me' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.151 Find the incorrect part of the sentence: She has been teaching in this school since five years.
A. No error
B. She has been teaching
C. in this school
D. since five years
Ans: D
Exp: 'For' is used for a definite period of time. For example: five years, six months, ten days, etc. 'Since' is used to denote a time in the past when something started. Hence, 'for five years' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.152 Select the sentence with correct use of article 'the.'
A. Dr. Johnson met the Shakespeare in England.
B. Kalidas is the Shakespeare of India.
C. Dr. Johnson saw the Shakespeare acting in King Lear.
D. Dr. Johnson had instructed the Shakespeare to write The Tempest.
Ans: B
Exp: Generally, we do not use any article before proper nouns. However, when we compare a person or place to another person/place that is renowned for its greatness, we use the definite article before them. Similarly, Shakespeare is a renowned poet and the given sentence compares Kalidas with Shakespeare. Therefore, the article 'the' is used before 'shakespeare'.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.153 Find the part of the sentence that contains an error: The teacher who had conducted the workshop earlier, (1)/ along with his assistants, (2)/ have submitted the final report to the board (3)/ before the deadline last week. (4)
A. before the deadline last week (4)
B. have submitted the final report to the board (3)
C. The teacher who had conducted the workshop earlier (1)
D. along with his assistants (2)
Ans: B
Exp: According to the "Subject-Verb Agreement Rule", a singular subject always takes a singular verb. In the given sentence, 'teacher' is a singular subject that will take 'has' as a singular verb. Hence, 'has submitted the final report to the board' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.154 Find the part of the sentence that contains an error: Each participant who registered online for the event (1)/ were given a welcome kit (2)/ along with the program schedule and map (3)/ at the helpdesk near the entrance. (4)
A. at the helpdesk near the entrance. (4)
B. were given a welcome kit (2)
C. along with the program schedule and map (3)
D. Each participant who registered online for the event (1)
Ans: B
Exp: 'Everyone/each/ every/ nothing/ everything/ anything/ either/ neither' represents a singular noun. Singular verbs are used with them. Therefore, 'were' will be replaced with 'was'. Hence, 'was given a welcome kit' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.155 Find the part of the sentence that contains an error: One of the guest speakers who addressed the seminar (1)/ and interacted with students (2)/ were praised widely for their clarity and enthusiasm (3)/ during the closing ceremony. (4)
A. and interacted with students (2)
B. were praised widely for their clarity and enthusiasm (3)
C. during the closing ceremony (4)
D. One of the guest speakers who addressed the seminar (1)
Ans: B
Exp: 'One + of plural noun + singular verb' is the correct grammatical structure. Therefore, 'were' should be replaced with the singular verb 'was'. Hence, 'was praised widely for their clarity and enthusiasm' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.156 Identify the part containing a grammatical or structural error: Neither the Principal nor the teachers was present.
A. No error
B. nor the teachers
C. was present
D. Neither the Principal
Ans: C
Exp: "Neither...nor/ Either...or" is a conjunction pair that is used only for two subjects, and the verb is supplied according to the subject closest to the verb. This is called the rule of proximity. 'Teachers' is the nearest subject and its plural. Therefore, the plural verb 'were' should be used. Hence, 'were present' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.157 Identify the incorrect part. He prevented me from get lost when we drove back from the airport.
A. He prevented
B. get lost when we drove back
C. from the airport
D. me from
Ans: B
Exp: We generally use a gerund (V-ing) after a preposition('from' in the given sentence). Therefore, 'get' will be replaced with 'getting'. Hence, "getting lost when we drove back" is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.158 Identify the word in this sentence that contains an error. The keys are inside the table drawer.
A. keys
B. drawer
C. table
D. inside
Ans: D
Exp: In the given sentence, the word "inside" is incorrect because the correct preposition should be "in". We usually say "in the drawer", not "inside the drawer" when referring to location in everyday English.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.159 Find the incorrect part of the sentence: One must keep his promises.
A. One
B. No error
C. must keep
D. his promises
Ans: D
Exp: The pronoun "One" is indefinite, so the corresponding possessive pronoun should also be indefinite 'one's', not "his." Therefore, the correct sentence should be 'One must keep one's promises'.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.160 Identify the part containing a grammatical or structural error: The behaviour of these students leave much to be desired.
A. leave much
B. The behaviour
C. of these students
D. to be desired
Ans: A
Exp: According to the "Subject-Verb Agreement Rule", a singular subject always takes a singular verb and a plural subject always takes a plural verb. In the given sentence, 'The behaviour' is a singular subject that will take 'leaves' as a singular verb. Hence, 'leaves much' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.161 Find the incorrect part of the sentence: Neither Ram nor his brothers is reliable.
A. Neither Ram
B. is reliable
C. No error
D. nor his brothers
Ans: B
Exp: When using "Neither...nor" with a plural noun, the verb should agree with the nearest subject. Here, the nearest subject is "his brothers" (plural), so the correct verb should be are.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.162 Identify the error in the sentence. He has saw the movie three times already.
A. movie
B. three
C. already
D. saw
Ans: D
Exp: The sentence uses the present perfect tense ("He has..."). In the present perfect tense, the auxiliary verb "has" for the third person singular is followed by the past participle of the main verb. The past participle of "see" is "seen," not "saw." Hence, "He has seen" is the most appropriate form.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.163 Find the incorrect part of the sentence: She is junior than me.
A. She is
B. junior than
C. No error
D. me
Ans: B
Exp: The word "junior" is followed by the preposition "to," not "than," when making a comparison. The correct phrase should be "junior to me."
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.164 Find the incorrect part of the sentence: She is more smarter than her sister.
A. No error
B. more smarter
C. She is
D. than her sister
Ans: B
Exp: The word "smarter" is already the comparative form of "smart," so adding "more" is redundant. Therefore, the correct form is "She is smarter than her sister."
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.165 Identify the word in this sentence that contains an error. She arrived to the office early this morning.
A. to
B. morning
C. arrived
D. office
Ans: A
Exp: The verb "arrive" is not followed by "to". The correct preposition is "at" for a specific place. Hence, 'arrive at is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.166 Identify the part containing a grammatical or structural error: It is high time you start studying seriously.
A. studying seriously
B. It is high time
C. No error
D. you start
Ans: D
Exp: The phrase "It is high time" is followed by the simple past tense, even when referring to a present or future action. This structure expresses that something should have already happened or should begin immediately. Therefore, "you start" should be "you started."
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.167 Identify the part containing a grammatical or structural error: Neither Ramesh nor his friends is willing to join.
A. is willing to join
B. No error
C. nor his friends
D. Neither Ramesh
Ans: A
Exp: "Neither...nor/ Either...or" is a conjunction pair that is used only for two subjects, and the verb is supplied according to the subject closest to the verb. This is called the rule of proximity. 'His friends' is a plural subject that will take 'are' as a plural verb. Hence, 'are willing to join' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.168 Find the incorrect part of the sentence: He could not cope up with the pressure.
A. cope up with
B. the pressure
C. No error
D. He could not
Ans: A
Exp: 'Cope up with' is an incorrect verb. 'Cope with' is the correct phrasal verb, which means to deal with a difficult situation. Hence, 'cope with' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.169 Identify the error in the sentence. This route is most safer than the highway.
A. safer
B. highway
C. most
D. route
Ans: C
Exp: The given sentence needs a comparative degree to make a comparison between the safety of this route and the highway. 'Safer' is the correct comparative degree. Therefore, 'most' must be removed. Hence, 'most' is the incorrect part.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.170 Find the incorrect part of the sentence: The police has arrested the culprit.
A. has arrested
B. The police
C. the culprit
D. No error
Ans: A
Exp: 'Police' is a plural noun, therefore a plural verb should be used with it. 'Has' must be replaced with the plural verb 'have'. Hence, 'have arrested' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.171 Choose the part of the sentence that contains an error: She gave me a good advice.
A. good
B. She gave me
C. a good advice
D. No error
Ans: C
Exp: 'Advice' is an uncountable noun, so we cannot use the indefinite article 'a' before it. Rather we use the phrase 'a piece of. Hence, 'a piece of good advice' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.172 Choose the part of the sentence that contains an error: Neither the teacher nor the students was present.
A. No error
B. was present
C. Neither the teacher
D. nor the students
Ans: B
Exp: If the paired conjunction "neither...nor" is used, the verb agrees with the subject closest to it. Here, the nearest subject is the plural noun "students," so the verb should be "were." Therefore, the correct sentence is "Neither the teacher nor the students were present".
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.173 Find the incorrect part of the sentence: She is angry upon me.
A. me
B. No error
C. angry upon
D. She is
Ans: C
Exp: The correct preposition to use with "angry" when referring to someone is "with", not "upon." Therefore, the correct sentence is "She is angry with me".
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.174 Find the incorrect part of the sentence: I returned back from Mumbai last week.
A. last week
B. from Mumbai
C. No error
D. I returned back
Ans: D
Exp: In the given sentence, the verb "returned" already implies coming back, so adding "back" is redundant. Therefore, the correct sentence is "I returned from Mumbai last week".
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.175 Which among the following sentences uses the article (if required) before the word 'honour' correctly?
A. It is the honour to be here.
B. It is an honour to be here.
C. It is honour to be here.
D. It is a honour to be here.

Exp: The word "honour" begins with a vowel sound, so it requires the article "an." Hence, option (b) is the most appropriate answer.

Q.176 Find the incorrect part of the sentence: She congratulated him for his success.
A. No error
B. him for
C. his success!
D. She congratulated
Ans: B
Exp: "On" is the fixed preposition used with the verb "congratulate" to indicate the achievement someone is being congratulated for. Therefore, "him on" is the correct form.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.177 Identify the part containing a grammatical or structural error: No sooner he had arrived than the meeting started.
A. he had arrived
B. No error
C. No sooner
D. than the meeting started
Ans: A
Exp: After "No sooner," the sentence must use inversion, meaning the auxiliary verb comes before the subject. Therefore, "had he arrived" is the correct form.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.178 Find the incorrect part of the sentence: The officer has issued an order to arrest him immediately.
A. The officer
B. No error
C. has issued
D. an order to arrest him immediately
Ans: B
Exp: The sentence is grammatically correct.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.179 Identify the error in the sentence. He made a quick shower before heading to the office.
A. quick
B. shower
C. before
D. made
Ans: D
Exp: The correct verb to use with 'shower' is "have/take". For example:- take a shower / have a shower. Past form 'took' will be used here. Hence, 'took a quick shower' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.180 Identify the error in the sentence. Mount Everest is more highest peak in the world.
A. world
B. more
C. highest
D. everest
Ans: B
Exp: In the given sentence, the word "highest" is already a superlative, so using "more" is redundant. Therefore, the correct sentence is "Mount Everest is the highest peak in the world."
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.181 Identify the part containing a grammatical or structural error: The teacher advised to listen attentively.
A. to listen attentively
B. No error
C. The teacher
D. advised
Ans: A
Exp: The verb 'advise' is usually followed by an object before the infinitive (to + verb). The correct structure is: advised + object + to + verb. Therefore, the correct sentence should be 'The teacher advised the students to listen attentively.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.182 Identify the error in the sentence. She danced graceful on stage during the annual show.
A. graceful
B. stage
C. show
D. during
Ans: A
Exp: In the given sentence, the word "graceful" is used as an adjective, but to describe the verb "danced," we need an adverb. Therefore, the correct word should be "gracefully."
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.183 Find the incorrect part of the sentence: She is one of the best singer in the city.
A. singer in the city
B. She is one
C. of the best
D. No error
Ans: A
Exp: "One of the + Superlative degree adjective + Plural Subject" is grammatically the correct structure. For example one of the best men, one of the greatest kings, one of the worst phones, etc. Hence, 'She is one of the best singers in the city' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.184 Find the incorrect part of the sentence: She delivered a speech in the prize distribution function.
A. She delivered
B. in the prize distribution function
C. No error
D. a speech
Ans: B
Exp: The correct preposition here is 'at', which is used to refer to a specific event or occasion. In the given sentence, the prize distribution function is an event. Hence, 'at the prize distribution function' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.185 Choose the part of the sentence that contains an error: He succeeded to win the prize.
A. the prize
B. to win
C. No error
D. He succeeded
Ans: B
Exp: The verb 'succeed' is always followed by the preposition 'in'. We generally use a gerund (V-ing) after any preposition. Hence, 'in winning (V-ing)' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.186 Identify the error in the sentence. He is a fastly growing leader in the organization.
A. leader
B. growing
C. fastly
D. organization
Ans: C
Exp: The word 'fastly' is incorrect. In the given sentence, an adverb is required, so the adverb 'fast' should be used instead of 'fastly". Hence, 'fast' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.187 Find the incorrect part of the sentence: You should not laugh on others.
A. laugh on
B. No error
C. You should not
D. others
Ans: A
Exp: 'Laugh at someone' is the correct phrase, which means to make fun of someone. Hence, 'laugh at others' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.188 Identify the part containing a grammatical or structural error: The manager together with his staff have gone for lunch.
A. together with his staff
B. No error
C. The manager
D. have gone for lunch
Ans: D
Exp: According to the "Subject-Verb Agreement Rule", a singular subject always takes a singular verb. In the given sentence, 'manager' is a singular subject that will take 'has' as a singular verb. Hence, 'has gone for lunch' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.189 Identify the part containing a grammatical or structural error: One of the questions were very difficult.
A. very difficult
B. were
C. One of the questions
D. No error
Ans: B
Exp: 'One of + plural noun + singular verb' is the correct grammatical structure. Therefore, 'were' must be replaced with the singular verb 'was'. Hence, 'was' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.190 Identify the error in the sentence. She adopted a honest approach to resolving the issue.
A. honest
B. issue
C. resolving
D. a
Ans: D
Exp: The article 'an' is used before words that begin with a vowel sound. In the given sentence, the word 'honest' starts with a vowel sound, so the article 'an' will be used before it. Hence, 'adopted an honest approach' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.191 Find the incorrect part of the sentence: This book comprises of five chapters.
A. No error
B. comprises of
C. This book
D. five chapters
Ans: B
Exp: The verb 'comprises' does not take the preposition 'of'. Therefore, 'of' must be removed. Hence, 'comprises five chapters' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 2)

Q.192 Find the incorrect part of the sentence: He divided the sweets between his five friends.
A. He divided
B. between his five friends
C. No error
D. the sweets
Ans: B
Exp: 'Between' is replaced by 'among' because 'among' is used when referring to more than two people, while 'between' is used for two entities only. In the given sentence, the sweets are divided among five friends. Hence, 'sweets among his five friends' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 3)

Q.193 Find the incorrect part of the sentence: Neither of the two brothers are trustworthy.
A. Neither of the two brothers
B. are
C. trustworthy
D. No error
Ans: B
Exp: "Neither...nor" is a conjunction pair used only for two subjects, and the verb is supplied according to the subject closest to the verb. The subject 'Neither' is singular, so it should be followed by the singular verb 'is' instead of 'are'. Hence, the correct sentence is "Neither of the two brothers is trustworthy."
Exam: SSC Stenographer 07/08/2025 (Shift 3)

Q.194 Choose the part of the sentence that contains an error: The child is afraid from the dark.
A. The child is
B. the dark
C. No error
D. afraid from
Ans: D
Exp: The correct preposition after the adjective "afraid" is "of." Hence, 'afraid of the dark' is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 3)

Q.195 Choose the part of the sentence that contains an error: You should avail of every opportunity.
A. every opportunity
B. No error
C. avail of
D. You should
Ans: B
Exp: The sentence is grammatically correct.
Exam: SSC Stenographer 07/08/2025 (Shift 3)

Q.196 Identify the part containing a grammatical or structural error: The father with his sons are arriving soon.
A. with his sons
B. No error
C. The father
D. are arriving soon
Ans: D
Exp: The subject "The father" is singular, and the phrase "with his sons" is only an accompanying detail. Therefore, the verb should be singular. Hence, "is arriving soon" is the most appropriate answer.
Exam: SSC Stenographer 07/08/2025 (Shift 3)

Q.197 Find the incorrect part of the sentence: The judge ordered the prisoner to hung till death.
A. to hung till death
B. No error
C. The judge ordered
D. the prisoner
Ans: A
Exp: The verb "ordered" is followed by the base form of the verb after "to." In the given sentence, "hung" should be replaced with "hang." Therefore, "to hang till death" is the correct phrase.
Exam: SSC Stenographer 07/08/2025 (Shift 3)

Q.198 Choose the part of the sentence that contains an error: My elder sister is married with a doctor.
A. a doctor
B. No error
C. is married with
D. My elder sister
Ans: C
Exp: 'To' is a fixed preposition used with the verb 'marry.' Therefore, 'is married to' is the correct form.
Exam: SSC Stenographer 08/08/2025 (Shift 1)

Q.199 Find the incorrect part of the sentence: The ship drowned in the sea.
A. in the sea
B. drowned
C. No error
D. The ship
Ans: B
Exp: The verb "drown" is used for humans or animals, not for ships. Therefore, the correct sentence is "The ship sank in the sea."
Exam: SSC Stenographer 08/08/2025 (Shift 1)

Q.200 Choose the part of the sentence that contains an error: She insisted to accompany me.
A. to accompany
B. me
C. No error
D. She insisted
Ans: A
Exp: In the given sentence, the verb "insist" is correctly followed by "on" + gerund (V-ing form). Therefore, the correct sentence is "she insisted on accompanying me."
Exam: SSC Stenographer 08/08/2025 (Shift 1)

Q.201 Which of the following sentences is grammatically correct?
A. When we reached the station, the train have already left.
B. When we reached the station, the train has already left.
C. When we reached the station, the train had already left.
D. When we reached the station, the train already left.
Ans: C
Exp: The given sentence demonstrates the correct use of the Past Perfect Tense for an action that occurred before another action in the past.
Exam: SSC Stenographer 08/08/2025 (Shift 1)

Q.202 Identify the part containing a grammatical or structural error: The jury was divided in their opinions.
A. No error
B. The jury
C. was divided
D. in their opinions
Ans: D
Exp: The word "jury" is a collective noun and is treated as singular. Therefore, the correct sentence is "The jury was divided in its opinions."
Exam: SSC Stenographer 08/08/2025 (Shift 1)

Q.203 Find the incorrect part of the sentence: He has come yesterday.
A. yesterday
B. No error
C. come
D. He has come
Ans: D
Exp: The present perfect tense "has come" is used for actions that have a connection to the present and is not used with a specific past time expression like "yesterday." Therefore, the correct sentence is "He came yesterday."
Exam: SSC Stenographer 08/08/2025 (Shift 1)

Q.204 Choose the part of the sentence that contains an error: He is living in Chennai since five years.
A. No error
B. He is living
C. since five years
D. in Chennai
Ans: C
Exp: 'Since' is used to indicate a starting point in time. To indicate a duration of time, we use 'for' Therefore, 'for five years' is the correct form.
Exam: SSC Stenographer 08/08/2025 (Shift 1)

Q.205 Identify the part containing a grammatical or structural error: Hardly had he left the room when the guests have arrived.
A. Hardly had he
B. No error
C. left the room
D. when the guests have arrived
Ans: D
Exp: The given sentence is in the simple past tense, therefore the past form of the verb will be used. 'have arrived' must be replaced with 'arrived (V2)'. Hence, 'when the guests arrived' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 1)

Q.206 Which of the following sentences is grammatically correct?
A. He went to college in a train.
B. He went to college with a train.
C. He went to college by a train.
D. He went to college on a train.
Ans: D
Exp: The correct preposition to use with modes of transport like "train" is "on." Hence, option (d) is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 1)

Q.207 Find the incorrect part of the sentence: No less than fifty students were absent.
A. No error
B. were absent
C. fifty students
D. No less than
Ans: D
Exp: "No less than" is used for uncountable nouns. But in the given sentence, "students" is a countable noun. Therefore, the correct phrase is "no fewer than."
Exam: SSC Stenographer 08/08/2025 (Shift 1)

Q.208 Find the incorrect part of the sentence: The old man fell down from the stairs.
A. fell down
B. No error
C. from the stairs
D. The old man
Ans: C
Exp: The correct preposition to use when someone falls from a higher level, such as stairs, is typically "down the stairs" or "off the stairs." The old man fell down the stairs, not "fell down from the stairs." The word "from" is unnecessary here. Therefore, the correct form is "fell down the stairs."
Exam: SSC Stenographer 08/08/2025 (Shift 1)

Q.209 Find the incorrect part of the sentence: I have visited Agra last month.
A. have visited
B. No error
C. last month
D. Agra
Ans: A
Exp: The phrase 'last month' indicates simple past tense. Therefore, 'have visited' must be replaced with the past form of the verb 'visited'. Hence, 'visited' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.210 Choose the part of the sentence that contains an error: She does not know to swim.
A. She does not
B. know to swim
C. swim
D. No error
Ans: B
Exp: When we talk about knowing or learning an activity, the correct structure is "know / learn + how + to + V,". Hence, "know how to swim" is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.211 Find the incorrect part of the sentence: She is better in mathematics than English.
A. than English
B. No error
C. She is
D. better in mathematics
Ans: D
Exp: "Good + at + something / doing something" is the correct grammatical structure. 'Better' is the comparative degree of 'good'. Hence, 'better at mathematics' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.212 Choose the part of the sentence that contains an error: I prefer tea than coffee.
A. coffee
B. No error
C. I prefer
D. tea than
Ans: D
Exp: 'To' is a fixed preposition used after the verb 'prefer'. Hence, 'tea to' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.213 Identify the part containing a grammatical or structural error: The news are too good to be true.
A. No error
B. are too good
C. The news
D. to be true
Ans: B
Exp: 'The news' is a singular noun so it will take the singular verb 'is'. Hence, 'is too good' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.214 Find the incorrect part of the sentence: The sceneries of Ooty was wonderful.
A. of Ooty
B. The sceneries
C. No error
D. were wonderful
Ans: B
Exp: 'Scenery' is an uncountable noun and its plural form does not exist. Hence, 'The scenery' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.215 Choose the part of the sentence that contains an error: She resembles with her mother.
A. mother
B. with her mother
C. She resembles
D. No error
Ans: B
Exp: The verb 'resemble' means to have some kind of similarities. However, we do not use the preposition 'with' after the verb 'resemble'. Therefore, 'with' must be removed. Hence, 'resembles her mother' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.216 Identify the part containing a grammatical or structural error: He asked me that where I was going.
A. I was going
B. He asked me
C. No error
D. that where
Ans: D
Exp: 'That' is not used in reported speech after the verb 'asked'. Therefore, 'that' must be removed. Hence, 'asked me where' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.217 Find the incorrect part of the sentence: She married with a doctor.
A. a doctor
B. with
C. She married
D. No error
Ans: B
Exp: We do not use the preposition 'with / to' after the verb 'married' active voice. Therefore, 'with' must be removed. Hence, 'married a doctor' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.218 Find the incorrect part of the sentence: He as well as his brothers were present.
A. He as well as
B. his brothers
C. were present
D. No error
Ans: C
Exp: When subjects are joined by 'as well as', the verb agrees with the first subject only. In the given sentence, the first subject is 'He' (singular), so the correct verb should be 'was', not 'were'. Hence, 'was present' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 3)

Q.219 Identify the part containing a grammatical or structural error: The number of applicants have increased this year.
A. The number of applicants
B. No error
C. this year
D. have increased
Ans: D
Exp: "The number of plural noun + singular verb" is the correct grammatical structure. Therefore, 'have' must be replaced with 'has'. Hence, 'has increased' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 3)

Q.220 Find the incorrect part of the sentence: She prevented me to enter the hall.
A. me to enter
B. the hall
C. She prevented
D. No error
Ans: A
Exp: 'From' is a fixed preposition used after the verb 'prevent / prohibit / refrain / abstain'. We generally use a gerund (V-ing) after any preposition. Hence, "me from entering (V-ing)" is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 3)

Q.221 Choose the part of the sentence that contains an error: The team were playing well.
A. No error
B. were playing
C. The team
D. well
Ans: B
Exp: Collective nouns are generally considered singular and we use a singular verb with them when all the members of the group are acting together rather than individually. Therefore, 'were' must be replaced with 'was'. Hence, 'was playing' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 3)

Q.222 Find the incorrect part of the sentence: The thief was hung for his crimes.
A. hung
B. No error
C. The thief was
D. for his crimes
Ans: A
Exp: 'Hung' must be replaced with 'hanged'. The verb 'hang' has two third forms. 'Hanged' is used when we talk about the death penalty by a loop around the neck. 'Hung' is used when an object(clothes / painting) is suspended in the air with the support of a string or hook. The given sentence talks about punishing thief for his crimes. Hence, 'hanged' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 3)

Q.223 Choose the part of the sentence that contains an error: The committee have given its decision.
A. have given
B. No error
C. its decision
D. The committee
Ans: A
Exp: When a decision is taken unanimously by a team, jury or a committee, a singular verb is used. Similarly, in the given sentence, the committee has given a single decision. Therefore, 'have' must be replaced with the singular verb 'has'. Hence, 'has given' is the most appropriate answer.
Exam: SSC Stenographer 08/08/2025 (Shift 3)`,
        "Sentence Improvement": `Q.1 The manager insisted <u>on meet the deadline</u>.
A. (a) to meet the deadline
B. (b) on meeting the deadline
C. (c) to have met the deadline
D. (d) for meeting the deadline
Ans: (b)
Exp: The verb 'insist' is typically followed by the preposition 'on', which then takes a gerund (V-ing form) as its object. Hence, 'on meeting the deadline' is the most appropriate answer.
Exam: SSC CGL 12/09/2025 (Shift 1)

Q.2 The librarian instructed the patrons to return books on time and <u>keeping</u> noise levels down in the reading area.
A. (a) to return books on time and to keep the noise levels down
B. (b) returning books on time and keeping noise levels down
C. (c) to return books on time and keep down the noise levels
D. (d) returning books on time and to keep noise levels down
Ans: (a)
Exp: Sol.2.(a) to return books on time and to keep the noise levels down The sentence uses parallel structure with the infinitive "to return books on time." Therefore, 'keeping' must be replaced with 'to keep' to maintain parallel structures. Hence, option (a) is the most appropriate answer.
Exam: SSC CGL 12/09/2025 (Shift 1)

Q.3 Scarcely had she finished her speech <u>then</u> the applause erupted.
A. (a) than the applause erupted
B. (b) when the applause had erupted
C. (c) when the applause erupted
D. (d) that the applause erupted
Ans: (c)
Exp: Sol.3.(c) when the applause erupted 'Scarcely...when' is a fixed conjunction pair. Simple past tense is used after 'when' and past perfect tense is used after 'scarcely'. Hence, 'when the applause erupted' is the most appropriate answer.
Exam: SSC CGL 12/09/2025 (Shift 2)

Q.4 The committee decided <u>on to postpone</u> the decision until the next meeting.
A. (a) to postpone
B. (b) on postponing
C. (c) for postponing
D. (d) postpone
Ans: (a)
Exp: Sol.4.(a) to postpone The verb 'decided' is generally followed by an infinitive (to + V1) to indicate the action that was decided. The phrase "on to postpone" is grammatically incorrect. Hence, 'to postpone' is the most app
Exam: SSC CGL 12/09/2025 (Shift 2)

Q.5 They proposed <u>us to consider</u> a different approach.
A. (a) that we consider a different approach
B. (b) us considering a different approach
C. (c) to consider a different approach by us
D. (d) that we considered a different approach
Ans: (a)
Exp: Sol.5.(a) that we consider a different approach The verb "propose," when followed by a suggestion for action, is typically followed by a 'that' containing the subjunctive form of the verb (base form). Hence, "that we consider a different approach" is the most appropriate answer.
Exam: SSC CGL 12/09/2025 (Shift 3)

Q.6 I wonder <u>what is the reason</u> for her sudden departure.
A. (a) what the reason is for her sudden departure
B. (b) what the reason for her sudden departure is
C. (c) what is the reason her sudden departure
D. (d) the reason for her sudden departure is what
Ans: (a)
Exp: Sol.6.(a) what the reason is for her sudden departure. The given sentence is an indirect question, and in such structures, the correct grammatical order after the 'wh-word' is "subject + verb," not "verb + subject." In the given sentence, "what the reason is for her sudden departure" correctly follows this structure: "what" (wh-word) + "the reason" (subject) + "is" (verb). Hence, "what the reason is for her sudden departure" is the most appropriate answer.
Exam: SSC CGL 12/09/2025 (Shift 3)

Q.7 The teacher insisted that every student <u>answers</u> the question carefully.
A. (a) answered the question carefully
B. (b) answer the question carefully
C. (c) has answered the question carefully
D. (d) should answers the question carefully
Ans: (b)
Exp: Sol.7.(b) answer the question carefully After verbs like insist, suggest, demand, or recommend, the subjunctive mood is used, which takes the base form of the verb. Therefore, 'answers' should be replaced with 'answer'. Hence, 'answer the question carefully' is the most appropriate answer.
Exam: SSC CGL 13/09/2025 (Shift 1)

Q.8 She is accustomed <u>to working</u> long hours during peak season.
A. (a) to work
B. (b) for working
C. (c) with working
D. (d) to working
Ans: (d)
Exp: Sol.8.(d) to working There are some phrases that are always followed by a gerund(V-ing). Such phrases are 'with a view to, looking forward to, in addition to, accustomed to, habituated to, be used to, prone to, etc. Hence, 'accustomed to working' is the most appropriate answer.
Exam: SSC CGL 13/09/2025 (Shift 1)

Q.9 The students formed a study group with a view <u>to achieve</u> higher grades.
A. (a) achieving higher grades
B. (b) to achieve higher grades
C. (c) for achieving higher grades
D. (d) achieve higher grades
Ans: (a)
Exp: Sol.9.(a) achieving higher grades There are some phrases that are always followed by a gerund(V-ing). Such phrases are "with a view to, looking forward to, in addition to, accustomed to, habituated to, be used to, prone to, etc." Hence, 'achieving higher grades' is the most appropriate answer.
Exam: SSC CGL 13/09/2025 (Shift 2)

Q.10 Many people consider him <u>as their leader</u>.
A. (a) for their leader
B. (b) their leader
C. (c) to be their leader
D. (d) as being their leader
Ans: (b)
Exp: Sol.10.(b) their leader The verb 'consider' is followed directly by the object and its complement (an adjective or noun) without the need for 'as' or 'to be'. Hence, "their leader" is the most appropriate answer.
Exam: SSC CGL 13/09/2025 (Shift 2)

Q.11 As we <u>approached near</u> the station, it started to rain heavily.
A. (a) approached to
B. (b) approached
C. (c) approached towards
D. (d) went nearby
Ans: (b)
Exp: Sol.11.(b) approached The verb 'approach' is used without any preposition as it means to come near to something. Hence, 'approached' is the most appropriate answer.
Exam: SSC CGL 13/09/2025 (Shift 3)

Q.12 The politician was widely criticised <u>at</u> his controversial remarks.
A. (a) for his controversial remarks
B. (b) on his controversial remarks
C. (c) with his controversial remarks
D. (d) about his controversial remarks
Ans: (a)
Exp: Sol.12.(a) for his controversial remarks 'For' is used to indicate the reason or purpose of something. Similarly, in the given sentence, 'for' indicates the reason for criticism of the politician. Hence, 'for his controversial remarks' is the most appropriate answer.
Exam: SSC CGL 13/09/2025 (Shift 3)

Q.13 If she <u>knew</u> you were coming, she would have baked a cake.
A. (a) knows you were coming
B. (b) had known you were coming
C. (c) was knowing you were coming
D. (d) has known you were coming
Ans: (b)
Exp: Sol.13.(b) had known you were coming The given sentence is an example of a third conditional sentence and the correct grammatical structure for it is "If + past perfect(had + V3)......... Would have + V3". Hence, "had known you were coming" is the most appropriate answer.
Exam: SSC CGL 14/09/2025 (Shift 1)

Q.14 It's high time they <u>should start preparing</u> for the exam.
A. (a) started preparing for the exam
B. (b) should have started preparing for the exam
C. (c) start to prepare for the exam
D. (d) will start preparing for the exam
Ans: (a)
Exp: Sol.14.(a) started preparing for the exam "It's high time" is followed by a past tense verb to indicate that something should have already been done. Hence, "started preparing for the exam" is the most appropriate answer.
Exam: SSC CGL 14/09/2025 (Shift 1)

Q.15 The committee <u>discussed about implementing</u> new safety protocols during the meeting.
A. (a) discussed implementing
B. (b) had a discussion about implementing
C. (c) were discussing about implementing
D. (d) had been discussed implementing
Ans: (a)
Exp: Sol.15.(a) discussed implementing The verb "discuss" is transitive, meaning it takes a direct object and does not require the preposition "about." Hence, "discussed implementing" is the most appropriate answer.
Exam: SSC CGL 14/09/2025 (Shift 2)

Q.16 Strict regulations were enacted to prevent industries <u>to discharge</u> untreated waste into the river.
A. (a) from discharging untreated waste into
B. (b) from discharge of untreated waste into
C. (c) to discharging untreated waste into
D. (d) for discharging untreated waste in
Ans: (a)
Exp: Sol.16.(a) from discharging untreated waste into The verb "prevent" is always followed by "from + verb-ing" to indicate restriction or prohibition. Hence, "from discharging untreated waste into" is the most appropriate answer.
Exam: SSC CGL 14/09/2025 (Shift 2)

Q.17 The committee <u>is comprised of</u> members from various disciplines.
A. (a) is comprised by
B. (b) comprises of
C. (c) comprises
D. (d) is comprising
Ans: (c)
Exp: Sol.17.(c) comprises The verb 'comprise' is used without any preposition. 'Comprise' is a stative verb and stative verbs are generally not used in continuous tense. In the given sentence, 'comprise' is a singular verb that will take 'comprises' as the singular verb. Hence, 'comprises' is the most appropriate answer.
Exam: SSC CGL 14/09/2025 (Shift 3)

Q.18 The new regulations are effective <u>from</u> January 1st across all sectors.
A. (a) with January 1st
B. (b) by January 1st
C. (c) as of January 1st
D. (d) on January 1st
Ans: (c)
Exp: Sol.18.(c) as of January 1st The phrase 'as of' is the most appropriate and common way to indicate the time from which something starts to be effective or true.
Exam: SSC CGL 14/09/2025 (Shift 3)

Q.19 She is junior <u>than him</u> in experience.
A. (a) junior from him
B. (b) more junior than him
C. (c) junior to him
D. (d) younger to him
Ans: (c)
Exp: Sol.19.(c) junior to him There are some words that imply comparison but do not take 'than'. Rather, 'to' is used with them. For example:- superior to, inferior to, prior to, senior to, junior to, elder to, etc. Hence, "junior to him" is the most appropriate answer.
Exam: SSC CGL 15/09/2025 (Shift 1)

Q.20 He <u>do not likes</u> to be disturbed while studying.
A. (a) do not like
B. (b) does not liked
C. (c) does not like
D. (d) is not liking
Ans: (c)
Exp: Sol.20.(c) does not like According to the "Subject-Verb Agreement Rule", a singular subject always takes a singular verb and a plural subject always takes a plural verb. The subject 'He' is singular and therefore takes the singular helping verb 'does'. Hence, "does not like" is the most appropriate answer.
Exam: SSC CGL 15/09/2025 (Shift 1)

Q.21 The tourists <u>are going to abroad</u> for a cultural exchange program.
A. (a) are going abroad
B. (b) are going for abroad
C. (c) are going in abroad
D. (d) are going towards abroad
Ans: (a)
Exp: Sol.21.(a) are going abroad The word "abroad" already means to or in a foreign country, so it does not take a preposition like to, for, in, or towards before it. Hence, "are going abroad" is the most appropriate answer.
Exam: SSC CGL 15/09/2025 (Shift 2)

Q.22 She is looking forward <u>to meet</u> you.
A. (a) is looking forward for meeting you
B. (b) is looking forward to meeting you
C. (c) is looking forward about meeting you
D. (d) is looking forward meet you
Ans: (b)
Exp: Sol.22.(b) is looking forward to meeting you The phrase "look forward to" is always followed by a gerund (V+ing form), not the base form. Hence, "looking forward to meeting you" is the most appropriate answer.
Exam: SSC CGL 15/09/2025 (Shift 2)

Q.23 She ran very <u>quick</u> to catch the bus.
A. (a) quickly very
B. (b) quick
C. (c) quickly
D. (d) more quickly
Ans: (c)
Exp: Sol.23.(c) quickly The word 'quick' is an adjective, but the sentence requires an adverb to describe how she ran. 'Quickly' is the adverbial form of 'quick' and correctly modifies the verb 'ran'. Hence, 'quickly' is the most appropriate answer.
Exam: SSC CGL 15/09/2025 (Shift 3)

Q.24 You will not succeed unless you <u>do not work</u> harder.
A. (a) unless you work
B. (b) if you did not work
C. (c) unless you will work
D. (d) if you work
Ans: (a)
Exp: Sol.24.(a) unless you work The conjunction 'unless' already means 'if not'. Therefore, using 'do not' after 'unless' creates a double negative, making the phrase grammatically incorrect. The correct structure is 'unless you work harder'. Hence, 'unless you work' is the most appropriate answer.
Exam: SSC CGL 15/09/2025 (Shift 3)

Q.25 She <u>discussed about</u> the issue with her manager.
A. (a) discussed on the issue
B. (b) discussed the issue
C. (c) had discussed about the issue
D. (d) was discussed the issue
Ans: (b)
Exp: Sol.25.(b) discussed the issue The verb "discuss" is a transitive verb, which means it takes a direct object without a preposition. Hence, "discussed the issue" is the most appropriate answer.
Exam: SSC CGL 16/09/2025 (Shift 1)

Q.26 Either the committee members or the chairperson <u>have</u> agreed to the proposal.
A. (a) have agreed
B. (b) has agreed
C. (c) are agreeing
D. (d) were agreed
Ans: (b)
Exp: Sol.26.(b) has agreed If the paired conjunctions 'either...or', 'neither...nor', 'not only...but also' are used, the verb agrees with the subject closest to it. Here, the nearest subject is "the chairperson," which is singular. Hence, "has agreed" is the most appropriate answer.
Exam: SSC CGL 16/09/2025 (Shift 1)

Q.27 He decided <u>to marry with</u> her despite his parents' objections.
A. (a) marry her
B. (b) marrying with her
C. (c) to marry to her
D. (d) to marry her
Ans: (d)
Exp: Sol.27.(d) to marry her When 'marry' is used as a transitive verb (with a direct object), it does not require a preposition like 'with' or 'to'. Therefore, 'with' must be removed. Hence, 'to marry her' is the most appropriate answer.
Exam: SSC CGL 16/09/2025 (Shift 2)

Q.28 Every one of the participants <u>have completed</u> the arduous obstacle course.
A. (a) has completed
B. (b) are completing
C. (c) were completing
D. (d) complete
Ans: (a)
Exp: Sol.28.(a) has completed "Every one of" indicates a singular subject, therefore, the singular verb 'has' will be used. Hence, 'has completed' is the most appropriate answer.
Exam: SSC CGL 16/09/2025 (Shift 2)

Q.29 I suggest that he <u>tries</u> harder to succeed.
A. (a) tried harder to succeed
B. (b) try harder to succeed
C. (c) tries hard to succeed
D. (d) should tried harder to succeed
Ans: (b)
Exp: Sol.29.(b) try harder to succeed After verbs like suggest, recommend, insist, demand, etc., we use the subjunctive mood, where the verb takes its base form (without -s). Hence, "try harder to succeed" is the most appropriate answer.
Exam: SSC CGL 16/09/2025 (Shift 3)

Q.30 He is married <u>with</u> a lawyer.
A. (a) married at
B. (b) married to
C. (c) married by
D. (d) married from
Ans: (b)
Exp: Sol.30.(b) married to When referring to a person, the correct preposition used with married is "to." Hence, "married to" is the most appropriate answer.
Exam: SSC CGL 16/09/2025 (Shift 3)

Q.31 He is keen <u>to learn of</u> swimming.
A. (a) to learn swimming
B. (b) on learning swimming
C. (c) in learning to swim
D. (d) on learning to swim
Ans: (d)
Exp: Sol.31.(d) on learning to swim 'On' is a fixed preposition used after the adjective 'keen' to indicate interest or enthusiasm about something. Hence, "on learning to swim" is the most appropriate answer.
Exam: SSC CGL 17/09/2025 (Shift 1)

Q.32 The new policy aims <u>at reducing</u> carbon emissions.
A. (a) in reducing carbon emissions
B. (b) for reducing carbon emissions
C. (c) to reduce carbon emissions
D. (d) with reducing carbon emissions
Ans: (c)
Exp: Sol.32.(c) to reduce carbon emissions The verb 'aim' is generally followed by an infinitive (to + V1). Hence, 'to reduce carbon emissions' is the most appropriate answer.
Exam: SSC CGL 17/09/2025 (Shift 2)

Q.33 The instructions clarify <u>that what</u> the user must do to complete the registration.
A. (a) that what must the user do
B. (b) what the user must do
C. (c) what must the user do
D. (d) that the user must do what
Ans: (b)
Exp: Sol.33.(b) what the user must do Here, two relative pronouns, 'that' and 'what' have been used to form a single noun clause, which is grammatically incorrect. So, we need to remove 'that' from this sentence. Hence, 'what the user must do' is the most appropriate answer.
Exam: SSC CGL 17/09/2025 (Shift 2)

Q.34 She <u>made a decision</u> after thinking for a long time.
A. (a) did a decision
B. (b) took a decision
C. (c) had a decision
D. (d) brought a decision
Ans: (b)
Exp: Sol.34.(b) took a decision The phrase "took a decision" is used to express that someone decided something after consideration. Hence, "took a decision" is the most appropriate answer.
Exam: SSC CGL 17/09/2025 (Shift 3)

Q.35 My colleague was particularly fond <u>at listening to</u> classical music during his commute.
A. (a) fond of listening to
B. (b) fond for listening to
C. (c) fond with listening for
D. (d) fond to listen for
Ans: (a)
Exp: Sol.35.(a) fond of listening to 'Fond of' is the correct phrase, which means having an affection or liking for something. 'Listen to' is used when hearing any kind of sound. Hence, 'fond of listening to' is the most appropriate answer.
Exam: SSC CGL 18/09/2025 (Shift 1)

Q.36 Her constant complaints <u>resulted to</u> her losing friends.
A. (a) resulted for
B. (b) resulted from
C. (c) resulted into
D. (d) resulted in
Ans: (d)
Exp: Sol.36.(d) resulted in 'Result in' means to cause a particular situation to happen. The given sentence states that her constant complaints resulted in her losing friends. Hence, 'resulted in' is the most appropriate answer.
Exam: SSC CGL 18/09/2025 (Shift 1)

Q.37 I <u>am hearing</u> a strange noise from upstairs.
A. (a) hear a strange noise
B. (b) have heard a strange noise
C. (c) heard a strange noise
D. (d) am hearing strange noise
Ans: (a)
Exp: Sol.37.(a) hear a strange noise The verb "hear" is a non-continuous (stative) verb, meaning it describes a state or sense, not an ongoing action. Such verbs are not used in the continuous (-ing) form when talking about perception or senses. Hence, "hear a strange noise" is the most appropriate answer.
Exam: SSC CGL 18/09/2025 (Shift 2)

Q.38 The government suspected that the scientist <u>had been knowing</u> the solution to the complex problem for months.
A. (a) known the solution
B. (b) knowingly solved
C. (c) knowing the solution
D. (d) been known the solution
Ans: (a)
Exp: Sol.38.(a) known the solution The verb 'know' is a stative verb and stative verbs are generally not used in the continuous tense. 'Had + V3' is the correct grammatical structure for this clause which is in the past perfect tense. Hence, 'known (V3) the solution' is the most appropriate answer.
Exam: SSC CGL 18/09/2025 (Shift 3)

Q.39 The student studied diligently <u>so he could pass</u> the difficult examination.
A. (a) so he passes
B. (b) so that he might pass
C. (c) so that he will pass
D. (d) so he might passing
Ans: (b)
Exp: Sol.39.(b) so that he might pass 'So that' is used to indicate the purpose or intention behind an action. 'Might' is used to indicate a possibility in the past. As per the given sentence, it was the intention of the student to pass the difficult examination. Hence, 'so that he might' is the most appropriate answer.
Exam: SSC CGL 18/09/2025 (Shift 3)

Q.40 He has been living in this city <u>since five years</u>.
A. (a) since five years
B. (b) for five years
C. (c) by five years
D. (d) from five year
Ans: (b)
Exp: Sol.40.(b) for five years 'For' is used to indicate a fixed period of time (countable), such as two years, three months, four days, or eight hours. It shows how long an action has been continuing. On the other hand, 'since' is used for a specific point in time like since 2020, since Monday, or since morning. In the given sentence, "five years" refers to a fixed duration, so "for" is the correct choice. Hence, "for five years" is the most appropriate answer.
Exam: SSC CGL 19/09/2025 (Shift 1)

Q.41 The committee <u>debated about</u> the new policy for hours without a resolution.
A. (a) debated on
B. (b) debated over
C. (c) debated
D. (d) debated regarding
Ans: (c)
Exp: Sol.41.(c) debated The verb 'debate' is transitive and usually does not require a preposition when followed directly by its object. Using 'about', 'on', 'over', or 'regarding' after 'debate' is grammatically incorrect. Hence, 'debated the new policy' is the most appropriate answer.
Exam: SSC CGL 19/09/2025 (Shift 2)

Q.42 She has been waiting for you <u>since two hours</u>.
A. (a) from two hours
B. (b) for two hours
C. (c) since the two hours
D. (d) from the last two hours
Ans: (b)
Exp: Sol.42.(b) for two hours 'For' is used for a fixed duration. 'Since' is used to denote a point of time in the past. Here, 'two hours' is a fixed duration. Hence, 'for two hours' is the most appropriate answer.
Exam: SSC CGL 19/09/2025 (Shift 2)

Q.43 Her performance was <u>superior of</u> all her competitors.
A. (a) superior to
B. (b) superior over
C. (c) superior as compared to
D. (d) superior from
Ans: (a)
Exp: Sol.43.(a) superior to Adjectives like 'superior', 'inferior', 'junior', 'senior', 'prior', and 'preferable' are followed by the preposition 'to', when making comparisons. Hence, 'superior to' is the most appropriate answer.
Exam: SSC CGL 19/09/2025 (Shift 2)

Q.44 She <u>reverted back</u> to her old habits despite her promises.
A. (a) reverted again
B. (b) reverted
C. (c) returned back
D. (d) reverted once more
Ans: (b)
Exp: Sol.44.(b) reverted The word "reverted" itself means to go back to a previous state or habit, so using "back" is redundant (unnecessary repetition). Hence, "reverted" is the most appropriate answer.
Exam: SSC CGL 19/09/2025 (Shift 3)

Q.45 They <u>present their findings on</u> the conference when the power suddenly went out.
A. (a) present their findings at the conference
B. (b) presented their findings at the conference
C. (c) have been presenting their findings at the conference
D. (d) were presenting their findings at the conference
Ans: (d)
Exp: Sol.45.(d) were presenting their findings at the conference The verb 'went out' indicates the action was happening in the past, not the present. Here, the power went out which interrupted the presentation. This means the action of presenting was in progress. Therefore, past continuous tense (plural subject + were + Ving) will be used. Hence, 'were presenting their findings at the conference' is the most appropriate answer.
Exam: SSC CGL 20/09/2025 (Shift 1)

Q.46 He sat <u>by his</u> in the corner.
A. (a) by him
B. (b) by himself
C. (c) by his own
D. (d) by myself
Ans: (b)
Exp: Sol.46.(b) by himself The phrase 'by + oneself' means alone or without company. 'Himself' is the correct reflexive pronoun for 'he'. Hence, 'by himself' is the most appropriate answer.
Exam: SSC CGL 20/09/2025 (Shift 1)

Q.47 He was accused <u>for stealing</u> the confidential files.
A. (a) of stealing
B. (b) with stealing
C. (c) about stealing
D. (d) on stealing
Ans: (a)
Exp: Sol.47.(a) of stealing 'Of' is a fixed preposition used after the verb 'accuse' to indicate the reason or action someone is blamed for. Hence, "of stealing" is the most appropriate answer.
Exam: SSC CGL 20/09/2025 (Shift 2)

Q.48 The old man walked <u>bare head</u> in the sun.
A. (a) bearshead
B. (b) bare headed
C. (c) bareheadly
D. (d) with naked head
Ans: (b)
Exp: Sol.48.(b) bare headed "Bare headed" is the proper adjective form meaning "without a covering on the head." Hence, "bare headed" is the most appropriate answer.
Exam: SSC CGL 20/09/2025 (Shift 3)

Q.49 The politician was criticised <u>on making false promises</u> during the campaign.
A. (a) on making false promises
B. (b) for making false promises
C. (c) of making false promises
D. (d) with making false promises
Ans: (b)
Exp: Sol.49.(b) for making false promises The verb "criticised" is followed by the preposition for when indicating the reason for criticism. Hence, "for making false promises" is the most appropriate answer.
Exam: SSC CGL 20/09/2025 (Shift 3)

Q.50 He is capable <u>for handling of</u> the complex project.
A. (a) of handling
B. (b) to handle
C. (c) in handling
D. (d) by handling
Ans: (a)
Exp: Sol.50.(a) of handling The adjective 'capable' is always followed by the preposition 'of', which then takes a gerund (V-ing form). Hence, 'capable of handling' is the most appropriate answer.
Exam: SSC CGL 21/09/2025 (Shift 1)

Q.51 I asked the children <u>where have they been</u>.
A. (a) where they have been
B. (b) where had they been
C. (c) where they had been
D. (d) where have they been
Ans: (c)
Exp: Sol.51.(c) where they had been When a Wh. word (what, how, why, where, when, etc) is used to start a relative clause in a sentence, the helping verb and the main verb both are used after the subject in the clause. Moreover,, the given sentence is in the past tense, therefore past perfect tense (had+V3) will be used. Hence, 'where they had been' is the most appropriate answer.
Exam: SSC CGL 21/09/2025 (Shift 2)

Q.52 The manager demanded that the report <u>is submitted</u> by Friday.
A. (a) has submitted
B. (b) will be submitted
C. (c) be submitted
D. (d) to be submitted
Ans: (c)
Exp: Sol.52.(c) be submitted In the given sentence, the verb "demand" requires the use of the subjunctive mood, which takes the base form of the verb after it. Hence, "be submitted" is the most appropriate answer.
Exam: SSC CGL 21/09/2025 (Shift 2)

Q.53 The police warned <u>against the dangers</u> of sailing alone.
A. (a) that dangers are sailing alone
B. (b) of the dangers of sailing alone
C. (c) it's dangerous of sailing alone
D. (d) of the dangers against sailing alone
Ans: (b)
Exp: Sol.53.(b) of the dangers of sailing alone 'Warn against' means to caution someone about the dangers of something. It is superfluous to use the words like 'risk / danger / problems' with "warn against". 'Warn of' is the correct usage here. 'Warn of' means to caution someone about something. Hence, "of the dangers of sailing alone" is the most appropriate answer.
Exam: SSC CGL 21/09/2025 (Shift 3)

Q.54 The minister was accused <u>for taking</u> bribes from a foreign company.
A. (a) accused with
B. (b) accused on
C. (c) accused of
D. (d) accused from
Ans: (c)
Exp: Sol.54.(c) accused of 'Of' is a fixed preposition used after the verb 'accused' to indicate the allegation or wrongdoing. Hence, 'accused of' is the most appropriate answer.
Exam: SSC CGL 22/09/2025 (Shift 1)

Q.55 The news <u>have shocked</u> everyone in the office.
A. (a) has shocked everyone in the office
B. (b) have been shocking everyone in the office
C. (c) is shocking everyone in the office
D. (d) shocked everyone in the office
Ans: (a)
Exp: Sol.55.(a) has shocked everyone in the office According to the "Subject-Verb Agreement Rule", a singular subject always takes a singular verb and a plural subject always takes a plural verb. In the given sentence, the subject is "The news", which is singular. Hence, "has shocked everyone in the office" is the most appropriate answer.
Exam: SSC CGL 22/09/2025 (Shift 1)

Q.56 The athlete was <u>too exhausted that he could not finish</u> the race.
A. (a) so exhausted that he could finish the race
B. (b) too exhausted to finish
C. (c) very exhausted to finish the race
D. (d) so much exhausted for finishing the race
Ans: (b)
Exp: Sol.56.(b) too exhausted to finish 'Too + adjective + to + V1' is the correct grammatical structure. Hence, 'too exhausted to finish' is the most appropriate answer.
Exam: SSC CGL 22/09/2025 (Shift 2)

Q.57 He travels to school <u>in bike</u> every morning.
A. (a) by the bike
B. (b) on bike
C. (c) by bike
D. (d) on the bike
Ans: (c)
Exp: Sol.57.(c) by bike The preposition "by" is used to indicate the means of transport without an article (e.g., by car, by bus, by bike). Hence, "by bike" is the most appropriate answer.
Exam: SSC CGL 22/09/2025 (Shift 3)

Q.58 He is responsible <u>to complete</u> the task on time.
A. (a) of completing the task on time
B. (b) for completing the task on time
C. (c) in completing the task on time
D. (d) to completing the task on time
Ans: (b)
Exp: Sol.58.(b) for completing the task on time 'For' is a fixed preposition used after the adjective "responsible" to indicate the duty or task. Hence, "for completing the task on time" is the most appropriate answer.
Exam: SSC CGL 22/09/2025 (Shift 3)

Q.59 Each of the candidates <u>were asked submit</u> his document before noon.
A. (a) was asked
B. (b) were being asked
C. (c) has asked
D. (d) are asked
Ans: (a)
Exp: Sol.59.(a) was asked The given sentence is an example of the passive voice of the simple past tense. 'Each of the candidates' is a singular subject that will take 'was' as a singular verb, not 'were'. Hence, 'was asked' is the most appropriate answer.
Exam: SSC CGL 23/09/2025 (Shift 1)

Q.60 She <u>visits their grandparents</u> in the countryside last month to help them with the harvest.
A. (a) does not visit their grandparents
B. (b) visit her grandparents in the countryside
C. (c) visited her grandparents in the countryside
D. (d) used to visit her grandparents in the countryside
Ans: (c)
Exp: Sol.60.(c) visited her grandparents in the countryside The adverb 'last month' indicates a past event, therefore the past form of the verb should be used instead of the present form 'visits'. 'Her' is the correct possessive for the pronoun 'she'. Therefore, 'visits their grandparents' must be replaced with 'visited her grandparents'. Hence, 'visited her grandparents in the countryside' is the most appropriate answer.
Exam: SSC CGL 23/09/2025 (Shift 1)

Q.61 She <u>advised to her friend</u> to take precautions during the trip.
A. (a) advised her friend take precautions
B. (b) advised to her friend taking precautions
C. (c) advised her friend to take precautions
D. (d) advised her friend taking precaution
Ans: (c)
Exp: Sol.61.(c) advised her friend to take precautions In the given sentence, The verb "advise" is a transitive verb that is not followed by "to" before the object. Hence, "advised her friend to take precautions" is the most appropriate answer.
Exam: SSC CGL 23/09/2025 (Shift 2)

Q.62 That bridge is built <u>from</u> steel.
A. (a) is constructed with steel
B. (b) is built of steel
C. (c) has made by steel
D. (d) is produced from steel
Ans: (b)
Exp: Sol.62.(b) is built of steel We use "built of" when the material used in construction remains visibly the same in the final structure (like wood, stone, or steel). Hence, "is built of steel" is the most appropriate answer.
Exam: SSC CGL 23/09/2025 (Shift 3)

Q.63 He prevented me <u>to enter</u> the room.
A. (a) for entering the room
B. (b) from entering the room
C. (c) to entering the room
D. (d) of entering the room
Ans: (b)
Exp: Sol.63.(b) from entering the room 'From' is a fixed preposition used after the verb 'prevent' to show restriction or stopping someone from doing something. Hence, "from entering the room" is the most appropriate answer.
Exam: SSC CGL 23/09/2025 (Shift 3)

Q.64 By the time we <u>finish</u> dinner, the guests had already left.
A. (a) finished
B. (b) have finished
C. (c) were finishing
D. (d) had finished
Ans: (a)
Exp: Sol.64.(a) finished The given sentence is in the past tense, therefore, 'finish' must be replaced with the past form 'finished'. Hence, 'finished' is the most appropriate answer.
Exam: SSC CGL 24/09/2025 (Shift 1)

Q.65 He <u>has completed</u> his work yesterday.
A. (a) completed his work
B. (b) has been completing his work
C. (c) had completed his work
D. (d) completes his work
Ans: (a)
Exp: Sol.65.(a) completed his work The adverb "yesterday" refers to a specific time in the past, so the verb should be in the simple past tense. Hence, "completed his work" is the most appropriate answer.
Exam: SSC CGL 24/09/2025 (Shift 2)

Q.66 He plays football every evening, <u>isn't he?</u>
A. (a) doesn't he?
B. (b) isn't he?
C. (c) hasn't he?
D. (d) didn't he?
Ans: (a)
Exp: Sol.66.(a) doesn't he? According to the "Question Tag rule", if the statement is positive, the question tag will be negative and vice versa. However, the sentence and the question tag must be in the same tense. Similarly, the given sentence is positive, so the question tag will be negative (doesn't). Hence, 'doesn't he' is the most appropriate answer.
Exam: SSC CGL 24/09/2025 (Shift 2)

Q.67 He behaves as if he <u>was</u> the owner of the company.
A. (a) like he was
B. (b) as if he is
C. (c) as though he was
D. (d) as if he were
Ans: (d)
Exp: Sol.67.(d) as if he were 'As if / as though' is used to provide an unrealistic explanation for something that is unusual or abnormal. As per the given sentence, the person behaves differently or unusually, and 'being the owner of the company' is an unrealistic explanation (not the actual). In this case, we use 'were', not 'was'. Hence, 'as if he were' is the most appropriate answer.
Exam: SSC CGL 24/09/2025 (Shift 3)

Q.68 If I <u>was</u> a bird, I would fly to distant lands.
A. (a) is
B. (b) were
C. (c) am
D. (d) been
Ans: (b)
Exp: Sol.68.(b) were "If I were ... would + V1" is used to introduce a hypothetical or unreal situation expressing a wish or imagination. Therefore, 'was' must be replaced with 'were'. Hence, 'were' is the most appropriate answer.
Exam: SSC CGL 25/09/2025 (Shift 1)

Q.69 He <u>has been lived</u> in london for five years.
A. (a) has been living
B. (b) has being lived
C. (c) have lived
D. (d) have been lived
Ans: (a)
Exp: Sol.69.(a) has been living The given sentence is an example of present perfect continuous tense and 'Singular subject + has been + Ving is the correct grammatical structure for it. Hence, 'has been living' is the most appropriate answer.
Exam: SSC CGL 25/09/2025 (Shift 1)

Q.70 She <u>consulted the matter with</u> her mentor before submitting the report.
A. (a) discussed the matter with
B. (b) talked over the matter with
C. (c) told the matter to
D. (d) said to her mentor about the matter
Ans: (a)
Exp: Sol.70.(a) discussed the matter with In the given sentence, the verb "consult" should be followed by a person, so "consulted the matter with is incorrect. Since "consult" directly takes a person as its object. Hence, "discussed the matter with" is the most appropriate answer.
Exam: SSC CGL 25/09/2025 (Shift 2)

Q.71 She succeeded because of her <u>hard works</u> and dedication.
A. (a) because of her hard work and dedication
B. (b) due to her hardworking and dedication
C. (c) owing to her hard works and dedication
D. (d) as she was hardworking and dedication
Ans: (a)
Exp: Sol.71.(a) because of her hard work and dedication The word "work" is generally an uncountable noun in this context, referring to effort or labor in general. Therefore, "hard work" is the correct and idiomatic phrasing, not "hard works". Hence, "because of her hard work and dedication" is the most appropriate answer.
Exam: SSC CGL 25/09/2025 (Shift 2)

Q.72 The analyst insisted that the latest forecasting model was <u>superior than the one</u> used last year.
A. (a) more superior than the one
B. (b) superior to the one
C. (c) superior then the one
D. (d) superior over the one
Ans: (b)
Exp: Sol.72.(b) superior to the one There are some words that indicate comparison but do not take 'than'. Rather, 'to' is used with them. For example:- superior to, inferior to, prior to, senior to, junior to, elder to, prefer to, etc. Hence, 'superior to the one' is the most appropriate answer.
Exam: SSC CGL 25/09/2025 (Shift 3)

Q.73 The researcher would have written and <u>publish</u> several reports in his early thirties if he had not fallen sick.
A. (a) published several report
B. (b) publish several reports
C. (c) publishing several reports
D. (d) published several reports
Ans: (d)
Exp: Sol.73.(d) published several reports In the given sentence, the helping verb 'would have' is used for both 'written' and 'publish'. However, the third form of the verb is used after 'would have'. Therefore, 'publish' must be replaced with 'published (V3)'. Hence, 'published several reports' is the most appropriate answer.
Exam: SSC CGL 25/09/2025 (Shift 3)

Q.74 He was <u>so hungry to eat</u> the entire meal.
A. (a) that he could eat the entire meal
B. (b) and he ate the entire meal
C. (c) that he eats the entire meal
D. (d) that he might eat the entire meal
Ans: (a)
Exp: Sol.74.(a) that he could eat the entire meal The construction "so... that..." is used to show a result. Here, "so hungry" indicates that he was able to eat the entire meal. Hence, "that he could eat the entire meal" is the most appropriate answer.
Exam: SSC CGL 26/09/2025 (Shift 1)

Q.75 He is <u>superior than</u> his colleague in experience.
A. (a) superior to his colleague
B. (b) superior than his colleague
C. (c) more superior than his colleague
D. (d) superior from his colleague
Ans: (a)
Exp: Sol.75.(a) superior to his colleague There are some words that imply comparison but do not take 'than'. Rather, 'to' is used with them. For example:- superior to, inferior to, prior to, senior to, junior to, elder to, etc. Hence, 'superior to his colleague' is the most appropriate answer.
Exam: SSC CGL 26/09/2025 (Shift 1)

Q.76 An anonymous person claims that the suspect <u>will escaped</u> through the back alley, unnoticed by the police.
A. (a) will be escape through
B. (b) will escape through
C. (c) will have to escaped through
D. (d) shall escaped through
Ans: (b)
Exp: Sol.76.(b) will escape through 'Will' is a modal verb and we generally use the first form(V1) of the verb with modals. Hence, 'will escape(V1) through' is the most appropriate answer.
Exam: SSC CGL 26/09/2025 (Shift 2)

Q.77 He completed the task <u>in short time</u>.
A. (a) completes the task shortly
B. (b) completed the task in short time
C. (c) completed the task in a short time
D. (d) completed shortly the task
Ans: (c)
Exp: Sol.77.(c) completed the task in a short time In the given sentence, the phrase "in short time" is grammatically incorrect, because it needs the article "a" to indicate a brief duration. Hence, "completed the task in a short time" is the most appropriate answer.
Exam: SSC CGL 26/09/2025 (Shift 3)

Q.78 He runs <u>more faster than</u> his brother.
A. (a) faster than
B. (b) more fast than
C. (c) fastest than
D. (d) more faster than
Ans: (a)
Exp: Sol.78.(a) faster than The word "faster" is already the comparative form of "fast." Using "more faster" is redundant because "more" is not needed with comparative adjectives. Hence, "faster than" is the most appropriate answer.
Exam: SSC CGL 26/09/2025 (Shift 3)

Q.79 If she <u>knew</u> you were coming, she would have baked a cake.
A. (a) knows you were coming
B. (b) had known you were coming
C. (c) was knowing you were coming
D. (d) has known you were coming
Ans: (b)
Exp: Sol.79.(b) had known you were coming The given sentence is an example of a third conditional sentence and the correct grammatical structure for it is "If + past perfect(had + V3)........ Would have + V3". Hence, "had known you were coming" is the most appropriate answer.
Exam: SSC CGL 14/10/2025 (Shift 1)

Q.80 He is capable <u>for handling of</u> the complex project.
A. (a) of handling
B. (b) to handle
C. (c) in handling
D. (d) by handling
Ans: (a)
Exp: Sol.80.(a) of handling The adjective 'capable' is always followed by the preposition 'of', which then takes a gerund (V-ing form). Hence, 'capable of handling' is the most appropriate answer.
Exam: SSC CGL 14/10/2025 (Shift 1)

Q.81 The interviewer asked the candidate <u>whom will the new role report to</u> if they are selected for the position.
A. (a) the candidate whom the new role shall reporting to
B. (b) the candidate whom will report to the new role
C. (c) the candidate whom the new role would report to
D. (d) whom the new role will report to
Ans: (d)
Exp: Sol.81.(d) whom the new role will report to When a Wh. word (who, whom, how, when, why, etc.) is used in the middle of a sentence, the helping verb and the main verb are used after the subject. Therefore, 'will' must be used after the subject 'the new role'. Hence, 'the candidate whom the new role will report to' is the most appropriate answer.
Exam: SSC CGL 14/10/2025 (Shift 2)

Q.82 Our team leader demands to know <u>how has the critical error gone</u> unnoticed for so long despite multiple review stages.
A. (a) demands to know how is the critical error
B. (b) demands to know how the critical error has
C. (c) demands to know how critical the error is
D. (d) demands to know how the critical error have
Ans: (b)
Exp: Sol.82.(b) demands to know how the critical error has When a Wh. word (who, whom, how, when, why, etc.) is used in the middle of a sentence, the helping verb and the main verb are used after the subject. Therefore, 'has' must be used after the subject 'the critical error'. Hence, 'demands to know how the critical error has' is the most appropriate answer.
Exam: SSC CGL 14/10/2025 (Shift 2)

Q.83 She <u>advised to her friend</u> to take precautions during the trip.
A. (a) advised her friend take precautions

C. (c) advised her friend to take precautions

Ans: (c)

Q.84 He decided <u>to marry with</u> her despite his parents' objections.
A. (a) marry her
B. (b) marrying with her
C. (c) to marry to her
D. (d) to marry her
Ans: (d)
Exp: Sol.84.(d) to marry her When 'marry' is used as a transitive verb(with a direct object), it does not require a preposition like 'with' or 'to'. Therefore, 'with' must be removed. Hence, 'to marry her' is the most appropriate answer.
Exam: SSC CGL 14/10/2025 (Shift 3)

Q.85 The team performed exceptionally well, <u>since</u> they had prepared diligently for months.
A. (a) Although

Ans: (c)

Q.86 The committee invited several experts to throw light <u>in</u> the environmental impact of the proposed construction project.

D. (d) outside
Ans: (a)
Exp: Sol.86.(a) on The correct phrase is 'throw light on', which means to explain or clarify something. Hence, 'on' is the most appropriate answer.
Exam: Matriculation Level 31/07/2025 (Shift - 1)

Q.87 The final results were announced, <u>but</u> the students rushed to check their scores.
A. (a) And
B. (b) So
C. (c) However
D. (d) Although
Ans: (b)
Exp: Sol.87.(b) but 'But' is used to express contrast in a sentence whereas 'so' is used to show the cause-effect relationship. In the given sentence, 'the announcement of final results' is the cause and the effect is students rushing to check their score. Hence, 'so' is the most appropriate answer.
Exam: Matriculation Level 31/07/2025 (Shift - 1)

Q.88 The company plans to <u>make over with</u> the new branding strategy next quarter.
A. (a) make out
B. (b) make off
C. (c) make do
D. (d) make a start
Ans: (d)
Exp: Sol.88.(d) make a start The phrase 'make a start' means to begin something. The given sentence states that the company plans to begin the new branding strategy. 'Make over' means to transform or to transfer ownership, which doesn't fit the context of starting a strategy. Hence, 'make a start' is the most appropriate answer. (a) 'make out' means to understand or discern. (b) 'make off' means to leave quickly. (c) 'make do' means to manage with whatever is available.
Exam: Matriculation Level 31/07/2025 (Shift - 1)

Q.89 The team's performance was <u>more strong</u> in the second half of the game.
A. (a) stronger
B. (b) most strong
C. (c) more strongly
D. (d) stronglier
Ans: (a)
Exp: Sol.89.(a) stronger 'Stronger' is the correct comparative degree of 'strong'. Hence, 'stronger' is the most appropriate answer.
Exam: Matriculation Level 01/08/2025 (Shift - 1)

Q.90 It took him a long time to <u>get over</u> his shyness and speak in public.
A. (a) get through
B. (b) get by
C. (c) get into
D. (d) get out
Ans: (a)
Exp: Sol.90.(a) get through The phrasal verb 'get through' in this context means to overcome or successfully deal with a difficult period or situation. The given sentence states that it took him a long time to overcome his shyness and speak in public. Hence, 'get through' is the most appropriate answer. (b) 'get by' means to manage with difficulty. (c) 'get into' means to enter or become involved in. (d) 'get out' means to leave.

Q.91 The <u>affect</u> of the new policy will <u>effect</u> positive changes in the community.

B. (b) affect, affect

D. (d) affect, effect
Ans: (a)
Exp: Sol.91.(a) effect, affect In the sentence, the first blank requires a noun, and the noun 'effect' means a result or consequence. The second blank requires a verb, and the verb 'affect' means to influence or have an impact on. Therefore, the correct replacement of the highlighted words is 'effect, affect'.
Exam: Matriculation Level 01/08/2025 (Shift - 1)

Q.92 The proposal was innovative; <u>and</u>, it faced significant opposition from conservative members.
A. (a) Moreover
B. (b) Therefore
C. (c) but
D. (d) Because
Ans: (c)
Exp: Sol.92.(c) But In the given sentence, the two clauses ("The proposal was innovative" and "it faced significant opposition") present contrasting ideas. 'But' is a contrasting conjunction. Hence, 'but' is the most appropriate answer.
Exam: Matriculation Level 01/08/2025 (Shift - 2)

Q.93 It was <u>such</u> only opportunity they had to present their case.
A. (a) a
B. (b) an
C. (c) the
D. (d) too
Ans: (c)
Exp: Sol.93.(c) the The phrase "only opportunity" refers to a specific, unique opportunity. When referring to something unique or specific that is clearly understood, the definite article 'the' is required. Therefore, 'such' must be replaced with 'the'. Hence, 'the' is the most appropriate answer.
Exam: Matriculation Level 01/08/2025 (Shift - 2)

Q.94 He could not <u>enjoy</u> the loud noise from the construction site any longer.
A. (a) allow
B. (b) refrain
C. (c) endure
D. (d) avoid
Ans: (c)

Exam: Matriculation Level 01/08/2025 (Shift - 2)

Q.95 The company decided to <u>carry over</u> with its expansion plans despite the economic downturn.
A. (a) carry on

C. (c) carry off
D. (d) carry out
Ans: (a)

Exam: Matriculation Level 01/08/2025 (Shift - 2)

Q.96 She mentioned that she <u>visits</u> her grandparents last summer.
A. (a) visits
B. (b) visited
C. (c) will visit
D. (d) would visit
Ans: (b)

Exam: Matriculation Level 01/08/2025 (Shift - 2)

Q.97 Volunteers have prepared to <u>work</u> information about the effects of climate change.
A. (a) spread
B. (b) act
C. (c) confuse
D. (d) deal
Ans: (a)

Q.98 Of all the candidates, Sarah is arguably the <u>more qualified</u> for the demanding position.
A. (a) most qualified

D. (d) very qualified
Ans: (a)

Q.99 The students tried to <u>get by</u> the strict rules of the library.
A. (a) Get across

Ans: (b)

Q.100 Students are not allowed to <u>access</u> the digital notes from their phones and the parents are happy to witness such an open <u>excess</u> to study materials.
A. (a) excess, access
B. (b) excess, excess
C. (c) access, access
D. (d) accession, ascension
Ans: (c)
Exp: Sol.100.(c) access, access We generally use the first form of the verb after the preposition 'to'. 'Access' is a verb, which means to be able to get or use something. Further, 'open' is an adjective which requires a noun. 'Access' as a noun means the ability to obtain something. Hence, 'access, access' is the most appropriate answer.

Q.101 The chef <u>prepare</u> gourmet meals for the restaurant's discerning clientele.
A. (a) prepares

Q.102 <u>Realistic</u>, we should plan for a few more days to complete the project, because rushing through it now might lead to mistakes.
A. (a) Real
B. (b) Really
C. (c) Realistically

Ans: (c)

Q.103 She <u>silent</u> walked out of the room so she wouldn't disturb anyone.

Q.104 The children gathered <u>in front</u> the stage, waiting excitedly for the performance to begin.
A. (a) due to
B. (b) in front of
C. (c) ahead of

Ans: (b)

Exam: Higher Secondary 25/07/2025 (Shift - 2)

Q.105 The director confirmed that one of the critical issues <u>were not addressed</u> in the previous meeting.
A. (a) was not addressed

C. (c) are not addressed
D. (d) No substitution required
Ans: (a)
Exp: Sol.105.(a) was not addressed "One of + plural noun + singular verb" is the correct grammatical structure. Therefore, 'were' must be replaced with the singular verb 'was'. Hence, 'was not addressed' is the most appropriate answer.

Q.106 The consequences of the sudden policy changes on local farmers are expected to be <u>even much significantly</u> than previously predicted.
A. (a) as much significantly as previously predicted
B. (b) even more significantly than previously predicted
C. (c) even more significant than previously predicted
D. (d) No substitution required
Ans: (c)
Exp: Sol.106.(c) even more significant than previously predicted Comparative degree is used with 'than'. Therefore, 'much' must be replaced with 'more'. The given sentence needs an adjective 'significant' to describe the noun 'consequence', not the adverb 'consequently'. Hence, 'even more significant than previously predicted' is the most appropriate answer.
Exam: Higher Secondary 28/07/2025 (Shift - 2)

Q.107 The captain, as well as the players, <u>are praying</u> for the team's success.
A. (a) is praying
B. (b) have been praying
C. (c) were praying
D. (d) No substitution required
Ans: (a)
Exp: Sol.107.(a) is praying When a singular subject (The captain') is followed by a phrase like 'as well as', 'along with', 'in addition to', etc., the verb must agree with the first subject (the captain). Therefore, the singular verb 'is' will be used. Hence, 'is praying' is the most appropriate answer.
Exam: Higher Secondary 29/07/2025 (Shift - 2)

Q.108 Either the musicians or the choir director <u>have forgotten</u> their sheet music.
A. (a) has forgotten
B. (b) had forgotten
C. (c) were forgetting
D. (d) No substitution required
Ans: (a)
Exp: Sol.108.(a) has forgotten "Neither....nor/ Either....or" is a conjunction pair that is used only for two subjects, and the verb is supplied according to the subject closest to the verb. This is called the rule of proximity. In the given sentence, the subject closest to the verb is 'the choir director', which is singular. Therefore, 'have' must be replaced with 'has'. Hence, 'has forgotten' is the most appropriate answer.
Exam: Higher Secondary 30/07/2025 (Shift - 2)

Q.109 The chief engineer, accompanied by his assistants, <u>are inspecting</u> the new machinery.
A. (a) is inspecting
B. (b) have been inspecting
C. (c) were inspecting
D. (d) No substitution required
Ans: (a)
Exp: Sol.109.(a) is inspecting When a singular subject ('The chief engineer') is followed by a phrase like 'accompanied by', 'along with', 'as well as', etc., the verb must agree with the first subject. Therefore, the singular verb 'is' will be used. Hence, 'is inspecting' is the most appropriate answer.
Exam: Higher Secondary 02/08/2025 (Shift - 2)

Q.110 If the engineers had designed the bridge better, the recent collapse <u>might prevent</u>.
A. (a) had prevented
B. (b) might have prevented
C. (c) might have been prevented
D. (d) might be prevented
Ans: (c)
Exp: Sol.110.(c) might have been prevented The given sentence is an example of a third conditional sentence and the if-clause is in the past perfect tense ('If + subject + had + V3). The main clause is in the passive voice and 'might have + been + V3' is the correct grammatical structure for it. Hence, 'might have been prevented' is the most appropriate answer.
Exam: Higher Secondary 02/08/2025 (Shift - 2)

Q.111 She stayed home <u>because of</u> she wasn't feeling well.
A. (a) because
B. (b) instead of
C. (c) due to
D. (d) why
Ans: (a)
Exp: Sol.111.(a) because 'Because of' is followed by a noun phrase but in the given sentence, we have a clause afterwards. Therefore, 'because' will be used as a conjunction to join the two clauses. Hence, 'because' is the most appropriate answer.
Exam: Higher Secondary 29/08/2025 (Shift - 2)

Q.112 We <u>complete</u> all the arrangements before the guests arrived for the ceremony.
A. (a) completes
B. (b) completed
C. (c) will complete
D. (d) had completed
Ans: (d)
Exp: Sol.112.(d) had completed If two actions took place in the past then the 1st action must be in the Past perfect tense(Had + V3) and the 2nd action must be in the Simple Past tense (V2). In the given sentence, 'completing all the arrangements' is the first action. Hence, 'had completed(V3)' is the most appropriate answer.
Exam: Graduate Level 24/07/2025 (Shift - 3)

Q.113 He drives <u>as worse as</u> a newbie.
A. (a) as badly as
B. (b) as bad as
C. (c) so bad as
D. (d) as worst as
Ans: (a)
Exp: Sol.113.(a) as badly as When comparing two things using 'as...as', an adjective or adverb should be in its positive degree. Since 'drives' is a verb, an adverb is required to describe how he drives. 'Badly' is a positive degree adverb. Hence, 'as badly as' is the most appropriate answer.
Exam: Graduate Level 25/07/2025 (Shift - 3)

Q.114 The new software performs <u>as efficient as</u> the older version.
A. (a) as efficiently as
B. (b) as more efficient as
C. (c) so efficient as
D. (d) as efficient than
Ans: (a)
Exp: Sol.114.(a) as efficiently as When comparing two things using 'as...as', an adjective or adverb should be in its positive degree. Since 'performs' is a verb, an adverb is required to describe how it performs. 'Efficiently' is a positive degree adverb. Hence, 'as efficiently as' is the most appropriate answer.
Exam: Graduate Level 26/07/2025 (Shift - 3)

Q.115 The patient <u>gained</u> consciousness by the time the ambulance arrived.
A. (a) has gained
B. (b) had gained
C. (c) was gaining
D. (d) is gained
Ans: (b)
Exp: Sol.115.(b) had gained 'By the time' is used to indicate the completion of one action before another. 'By the time + simple past tense,.... past perfect tense is the correct grammatical structure. Therefore, 'gained(V₂)' must be replaced with 'had gained (V3)'. Hence, 'had gained' is the most appropriate answer.
Exam: Graduate Level 28/07/2025 (Shift - 3)

Q.116 She would rather we <u>submit</u> the report by Friday, not Monday.
A. (a) submitted
B. (b) had submitted
C. (c) submits
D. (d) submitting
Ans: (a)
Exp: Sol.116.(a) submitted The phrase "would rather + subject + verb" is used to express a preference for someone else's action. When referring to a preference for the present or future, simple past tense (V2) is used after the subject. Hence, 'submitted(V₂)' is the most appropriate answer.
Exam: Graduate Level 29/07/2025 (Shift - 3)

Q.117 Tell me which is the <u>most easiest</u> of the three questions.
A. (a) more easy
B. (b) easier
C. (c) most easy
D. (d) easiest
Ans: (d)
Exp: Sol.117.(d) easiest 'Easiest' is the correct superlative degree of 'easy'. Hence, 'easiest' is the most appropriate answer.
Exam: Graduate Level 31/07/2025 (Shift - 3)

Q.118 <u>Hardly he agrees</u> with his colleagues in meetings.
A. (a) has he agreed
B. (b) is he agree
C. (c) does he agree
D. (d) is he agreeing
Ans: (c)
Exp: Sol.118.(c) does he agree When sentences begin with negative adverbs like 'Hardly', 'Rarely', 'Seldom', etc., inversion of the subject and auxiliary verb is required. For simple present tense, the auxiliary verb 'do' ог 'does' is used. Since the subject is 'he' (singular), 'does' is required. Hence, 'does he agree' is the most appropriate answer.
Exam: Graduate Level 02/08/2025 (Shift - 3)

Q.119 She <u>read</u> a book for two hours before her brother arrived.
A. (a) has read
B. (b) was reading
C. (c) had been reading
D. (d) reads
Ans: (c)
Exp: Sol.119.(c) had been reading Past perfect continuous tense(had been + V) is used to describe an action that has been happening for some time in the past before being interrupted by another action. Hence, 'had been reading (V3)' is the most appropriate answer.
Exam: Graduate Level 29/08/2025 (Shift - 1)

Q.120 <u>By the time we will reach</u>, the concert will have started.
A. (a) we reached
B. (b) No improvement
C. (c) we reach
D. (d) we have reached
Ans: (c)
Exp: Sol.120.(c) we reach When we talk about an action that will be completed before a specific time in the future, simple present tense is used to indicate that specific time. 'Plural subject + V1' is the correct structure of simple present tense. Hence, 'we reach(V1)' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.121 The old lady was unable to climb stairs because her legs <u>is aching constantly</u> since morning.
A. (a) is been aching constantly
B. (b) have been aching constantly
C. (c) Had been aches constantly
D. (d) No substitution required
Ans: (b)
Exp: Sol.121.(b) have been aching constantly 'Since' is used in present perfect continuous tense to denote an action that started in the past and is still going on. "Plural subject + have been + v_ing' is the correct structure of present perfect continuous tense. Hence, "have been aching constantly" is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.122 The team has been preparing for the match <u>since two months</u> without a break.
A. (a) for two months
B. (b) till two months
C. (c) up to two month
D. (d) until two months
Ans: (a)
Exp: Sol.122.(a) for two months 'For' is used for a definite period of time. For example:- five years, six months, ten days, etc. 'Since' is used to denote a time in the past when something started. Hence, 'for two months' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.123 The doctor gave the patient some medications after he <u>felt</u> some pain on his left knee.
A. (a) did feel
B. (b) has felt
C. (c) had felt
D. (d) was felt
Ans: (c)
Exp: Sol.123.(c) had felt If two actions took place in the past then the 1st action must be in the Past perfect tense(Had + V3) and the 2nd action must be in the Simple Past tense (V2). In the given sentence, 'feeling some pain on the left knee' is the first action. Hence, 'had felt(V3)' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.124 The plane landed <u>in</u> the airport.
A. (a) to the airport
B. (b) into the airport
C. (c) at the airport
D. (d) towards airport
Ans: (c)
Exp: Sol.124.(c) at the airport 'At' is used to denote a specific place. 'In' is used to indicate the location or presence of an object inside something. 'Airport' is a specific place where planes land. Hence, 'at the airport' is the most appropriate answer.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.125 If I <u>was</u> you, I would accept the offer.

B. (b) have been you
C. (c) were you
D. (d) would be you
Ans: (c)
Exp: Sol.125.(c) were you The phrase 'If i were' is generally used in the subjunctive mood to talk about possibilities, wishes, or conditions that are contrary to reality. 'If I were... (would + V1) / (would have + V3)' is the correct grammatical structure. Hence, 'were you' is the most appropriate answer.

Q.126 I am not used <u>with</u> this kind of work.

Ans: (a)

Q.127 The teacher <u>explained him the topic</u>.

D. (d) explained to him the topic
Ans: (c)

Q.128 He <u>said me a lie</u>.

D. (d) said lie
Ans: (a)

Q.129 Each of the candidates <u>have submitted</u> their documents for verification.

D. (d) is submitted their documents
Ans: (c)

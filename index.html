Q.6 'A specialist in the study of insects'.
A. Zoologist
B. Ornithologist
C. Entomologist
D. Botanist
Ans: C
Exp: Sol.6.(c) Entomologist a specialist in the study of insects. Zoologist a scientist who studies animals. Ornithologist a scientist who studies birds. Botanist - a scientist who studies plants.
Exam: SSC CGL 13/09/2025 (Shift 3)

Q.7 'A person who talks too much about trivial matters!
A. Loquacious
B. Taciturn
C. Reticent
D. Pithy
Ans: A
Exp: Sol.7.(a) Loquacious a person talks excessively, often about unimportant things. Taciturn means reserved or silent by nature. Reticent refers to someone unwilling to speak or express their thoughts freely. Pithy means concise and meaningful in speech or writing.
Exam: SSC CGL 14/09/2025 (Shift 1)

Q.8 'A person who believes that pleasure is the chief good in life.
A. Stoic
B. Cynic
C. Hedonist
D. Epicure
Ans: C
Exp: Sol.8.(c) Hedonist a person who believes that the pursuit of pleasure is the most important goal in life. Stoic someone who endures pain or hardship without showing feelings. Cynic a person who believes people are motivated purely by self-interest. Epicure a person with refined taste in food and drink.
Exam: SSC CGL 14/09/2025 (Shift 2)

Q.9 A general pardon for offences, especially political ones, against a state'.
A. Absolution
B. Amnesty
C. Reprieve
D. Exoneration
Ans: B
Exp: Sol.9.(b) Amnesty - an official pardon for people who have been convicted of political offenses. Absolution a formal release from guilt, obligation, or punishment. Reprieve a cancellation or postponement of a punishment. Exoneration the action of officially absolving someone from blame; vindication.
Exam: SSC CGL 14/09/2025 (Shift 3)

Q.10 'Fear of being touched.'
A. Atychiphobia
B. Haphephobia
C. Gamophobia
D. Thanatophobia
Ans: B
Exp: Sol.10.(b) Haphephobia an extreme or irrational fear of being touched. Atychiphobia - fear of failure. Gamophobia fear of marriage or commitment. Thanatophobia - fear of death or dying.
Exam: SSC CGL 15/09/2025 (Shift 1)

Q.11 'Friendly and welcoming to strangers or foreigners'.
A. Misoneistic
B. Xenodochial
C. Misanthropic
D. Xylotomous
Ans: B
Exp: Sol.11.(b) Xenodochial - friendly and kind to strangers or foreigners. Misoneistic having a hatred or fear of change or innovation. Misanthropic disliking or distrusting humankind in general. Xylotomous capable of cutting or boring into wood (used for certain insects).
Exam: SSC CGL 15/09/2025 (Shift 1)

Q.12 "A person who believes that only the self exists and that everything outside one's own mind is merely an illusion."
A. Nihilist
B. Solipsist
C. Existentialist
D. Idealist
Ans: B
Exp: Sol.12.(b) Solipsist A person who believes that only the self exists and that everything outside one's own mind is merely an illusion. Nihilist denies all religious and moral principles, believing life is meaningless. Existentialist emphasizes individual freedom and responsibility in creating meaning. Idealist believes reality is mentally constructed or spiritual in essence.
Exam: SSC CGL 15/09/2025 (Shift 2)

Q.13 "A person who deliberately stirs up discord or rebellion within an organization, often to achieve personal or political ends."
A. Iconoclast
B. Incendiary
C. Insubordinate
D. Insurrectionist
Ans: B
Exp: Sol.13.(b) Incendiary A person who deliberately stirs up discord or rebellion within an organization, often to achieve personal or political ends. Iconoclast someone who challenges or attacks established beliefs or traditions. Insubordinate - someone who refuses to obey authority, but not necessarily one who provokes rebellion. Insurrectionist - one who takes part in an organized uprising against authority, but focuses on action, not provocation.
Exam: SSC CGL 15/09/2025 (Shift 2)

Q.14 'A collection of literary extracts, especially from one author'.
A. Lexicographer
B. Bibliophile
C. Anthology
D. Ennui
Ans: C
Exp: Sol.14.(c) Anthology a collection of literary extracts, especially from one author. Lexicographer a person who compiles a dictionary. Bibliophile a person who loves reading and collecting books. Ennui feelings of being bored and not satisfied because nothing interesting is happening.
Exam: SSC CGL 15/09/2025 (Shift 3)

Q.15 'A speech made without any preparation.'
A. Extempore
B. Dialogue
C. Monologue
D. Soliloquy
Ans: A
Exp: Sol.15.(a) Extempore a speech made without any preparation. Dialogue a conversation between two or more people. Monologue a long speech by one person, often in a play or performance. Soliloquy a speech in which a character speaks their thoughts aloud when alone on stage.
Exam: SSC CGL 16/09/2025 (Shift 1)

Q.16 A person who studies ancient writings and inscriptions.'
A. Archaeologist
B. Epigraphist
C. Paleographer
D. Philologist
Ans: C
Exp: Sol.16.(c) Paleographer a person who studies ancient writings and inscriptions. Archaeologist a person who studies human history and prehistory through the excavation of sites and the analysis of artefacts and other physical remains. Epigraphist a person who studies inscriptions, which are writings engraved on hard surfaces like stone or metal Philologist a person who studies language in historical sources, such as literature and written records.
Exam: SSC CGL 16/09/2025 (Shift 1)

Q.17 Able to be understood by only a few people who have special knowledge or interest.
A. Opaque
B. Inefficient
C. Illegible
D. Esoteric
Ans: D
Exp: Sol.17.(d) Esoteric- able to be understood by only a few people who have special knowledge or interest. Opaque unable to be understood. Inefficient- not achieving maximum productivity. Illegible- not clear enough to be read.
Exam: SSC CGL 16/09/2025 (Shift 1)

Q.18 A place where two rivers meet.
A. Estuary
B. Confluence
C. Delta
D. Tributary
Ans: B
Exp: Sol.18.(b) Confluence a place where two rivers meet. Estuary the tidal mouth of a large river, where the tide meets the stream. Delta a triangular tract of sediment deposited at the mouth of a river, typically where it diverges into several outlets. Tributary a river or stream flowing into a larger river or lake.
Exam: SSC CGL 16/09/2025 (Shift 2)

Q.19 'One who is all-powerful.'
A. Omnipresent
B. Omniscient
C. Omnipotent
D. Magnanimous
Ans: C
Exp: Sol.19.(c) Omnipotent - having unlimited power; all-powerful. Omnipresent present everywhere at the same time. Omniscient knowing everything; all-knowing. Magnanimous very generous or forgiving, especially toward a rival or someone less powerful.
Exam: SSC CGL 16/09/2025 (Shift 3)

Q.20 'A statement that seems self contradictory but may be true.'
A. Epigram
B. Paradox
C. Aphorism
D. Dogma
Ans: B
Exp: Sol.20.(b) Paradox a statement that seems self-contradictory but may be true. Epigram a short, clever, and witty saying. Aphorism a concise statement expressing a general truth or principle. Dogma a set of principles or beliefs laid down by an authority as unquestionable truth.
Exam: SSC CGL 16/09/2025 (Shift 3)

Q.21 'A person who avoids human society and prefers to live alone.'
A. Recluse
B. Renegade
C. Prodigy
D. Mystic
Ans: A
Exp: Sol.21.(a) Recluse a person who avoids human society and prefers to live alone. Renegade a person who deserts or betrays an organization, country, or set of principles. Prodigy a person, especially a young one, with exceptional talents or abilities. Mystic a person who seeks spiritual truth or union with the divine through meditation or contemplation.
Exam: SSC CGL 17/09/2025 (Shift 1)

Q.22 'One who engages in a foolishly idealistic pursuit of unreachable goals.
A. Visionary
B. Quixotic
C. Sagacious
D. Maverick
Ans: B
Exp: Sol.22.(b) Quixotic extremely idealistic, unrealistic, and impractical in pursuit of ideals. Visionary one who thinks about or plans the future with imagination or wisdom. Sagacious having or showing keen mental discernment and good judgment; wise. Maverick an independent-minded person who refuses to follow accepted norms or rules.
Exam: SSC CGL 17/09/2025 (Shift 1)

Q.23 A person who believes that war and violence are unjustifiable'.
A. Chauvinist
B. Maverick
C. Belligerent
D. Pacifist
Ans: D
Exp: Sol.23.(d) Pacifist a person who believes that war and violence are unjustifiable. Chauvinist a person displaying aggressive or exaggerated patriotism. Maverick an unorthodox or independent-minded person. Belligerent - hostile and aggressive.
Exam: SSC CGL 17/09/2025 (Shift 2)

Q.24 One who finds it difficult to believe anything without proof.
A. Credulous
B. Agnostic
C. Skeptic
D. Cynic
Ans: C
Exp: Sol.24.(c) Skeptic One who finds it difficult to believe anything without proof. Credulous having or showing too great a readiness to believe things. Agnostic a person who believes that nothing is known or can be known of the existence or nature of God or of anything beyond material phenomena. Cynic a person who believes that people are motivated purely by self-interest rather than acting for honourable or unselfish reasons.
Exam: SSC CGL 17/09/2025 (Shift 2)

Q.25 A person who loves and seeks wisdom or knowledge.
A. Philanthropist
B. Philosopher
C. Philologist
D. Philatelist
Ans: B
Exp: Sol.25.(b) Philosopher a person who loves and seeks wisdom or knowledge. Philanthropist a person who loves mankind and helps others, especially by giving money to good causes Philologist a person who studies languages and their development Philatelist - a person who collects stamps
Exam: SSC CGL 17/09/2025 (Shift 3)

Q.26 A person who gives opinions on something beyond their knowledge.
A. Amateur
B. Dilettante
C. Novice
D. Ignoramus
Ans: B
Exp: Sol.26.(b) Dilettante a person who gives opinions on something beyond their knowledge. Amateur a person who engages in an activity for pleasure, not professionally. Novice a beginner; someone new to a field or activity. Ignoramus a totally ignorant or uneducated person.
Exam: SSC CGL 17/09/2025 (Shift 3)

Q.27 A story, poem, or picture that can be interpreted to reveal a hidden meaning, typically a moral or political one.
A. Fable
B. Parable
C. Allegory
D. Anecdote
Ans: C
Exp: Sol.27.(c) Allegory a story, poem, or picture that can be interpreted to reveal a hidden meaning, typically a moral or political one. Fable a short story, typically with animals as characters, conveying a moral. Parable a simple story used to illustrate a moral or spiritual lesson, as told by Jesus in the Gospels. Anecdote a short and amusing or interesting story about a real incident or person.
Exam: SSC CGL 18/09/2025 (Shift 1)

Q.28 A general pardon for offences, especially political ones, granted by an authority.
A. Amnesty
B. Absolution
C. Reprieve
D. Exoneration
Ans: A
Exp: Sol.28.(a) Amnesty an official pardon for people who have been convicted of political offences. Absolution a formal release from guilt, obligation, or punishment. Reprieve a cancellation or postponement of a punishment. Exoneration the action of officially absolving someone from blame.
Exam: SSC CGL 18/09/2025 (Shift 1)

Q.29 A person who travels to sacred places for religious reasons'.
A. Ascetic
B. Hermit
C. Pilgrim
D. Evangelist
Ans: C
Exp: Sol.29.(c) Pilgrim a person who travels to sacred places for religious reasons. Ascetic a person who practices severe self-discipline and abstains from worldly pleasures for spiritual reasons. Hermit a person who lives alone in seclusion, usually for religious reflection. Evangelist a person who seeks to convert others to the Christian faith, especially by public preaching.
Exam: SSC CGL 18/09/2025 (Shift 2)

Q.30 'To clear someone of blame or suspicion'.
A. Accuse
B. Indict
C. Exonerate
D. Incriminate
Ans: C
Exp: Sol.30.(c) Exonerate to free someone from blame or declare them not guilty. Accuse to charge someone with a crime or wrongdoing. Indict to formally accuse someone of a serious crime. Incriminate to make someone appear guilty of a crime or wrongdoing.
Exam: SSC CGL 18/09/2025 (Shift 2)

Q.31 A person who acts as a go-between or intermediary between two parties.
A. Arbitrator
B. Mediator
C. Emissary
D. Interlocutor
Ans: B
Exp: Sol.31.(b) Mediator a person who acts as a go-between or intermediary between two parties. Arbitrator an independent person or body officially appointed to settle a dispute. Emissary a person sent on a special mission, usually as a diplomatic representative. Interlocutor a person who takes part in a dialogue or conversation.
Exam: SSC CGL 18/09/2025 (Shift 3)

Q.32 A person who believes that all people are motivated by self-interest.
A. Philanthropist
B. Altruist
C. Stoic
D. Cynic
Ans: D
Exp: Sol.32.(d) Cynic a person who believes that people are motivated purely by self-interest rather than acting for honourable or unselfish reasons. Philanthropist a person who seeks to promote the welfare of others, especially by the generous donation of money to good causes. Altruist a person unselfishly concerned for or devoted to the welfare of others. Stoic a person who can endure pain or hardship without showing their feelings or complaining.
Exam: SSC CGL 18/09/2025 (Shift 3)

Q.33 'A person who believes that pleasure is the chief good in life'.
A. Epicurean
B. Stoic
C. Altruist
D. Nihilist
Ans: A
Exp: Sol.33.(a) Epicurean a person who believes that pleasure is the chief good in life. Stoic one who remains calm and indifferent to pleasure or pain. Altruist one who is selflessly concerned for the welfare of others. Nihilist one who believes that life is meaningless and rejects all moral or religious principles.
Exam: SSC CGL 19/09/2025 (Shift 1)

Q.34 'A government or state ruled directly by the military'.
A. Bureaucracy
B. Autocracy
C. Stratocracy
D. Plutocracy
Ans: C
Exp: Sol.34.(c) Stratocracy a government or state ruled directly by the military Bureaucracy a government run by officials or administrators. Autocracy rule by one person with absolute power. Plutocracy a government controlled by the wealthy.
Exam: SSC CGL 19/09/2025 (Shift 1)

Q.35 A place where coins, medals, or tokens are made.
A. Mint
B. Foundry
C. Treasury
D. Refinery
Ans: A
Exp: Sol.35.(a) Mint a place where coins, medals, or tokens are made. Foundry - a factory for casting metal. Treasury the place or department where money is kept and managed. Refinery an industrial plant for purifying a crude substance, such as petroleum or sugar.
Exam: SSC CGL 19/09/2025 (Shift 2)

Q.36 A place for the care and treatment of people who are recovering from illness
A. Dormitory
B. Cemetery
C. Refuge
D. Sanatorium
Ans: D
Exp: Sol.36.(d) Sanatorium- a place for the care and treatment of people who are recovering from illness. Dormitory- a large bedroom for a number of people in a school or institution. Cemetery- a large burial ground, especially one not in a churchyard. Refuge- a place or situation providing safety or shelter.
Exam: SSC CGL 19/09/2025 (Shift 2)

Q.37 A form of government characterized by rampant corruption, where leaders exploit national resources for personal gain'.
A. Plutocracy
B. Oligarchy
C. Kleptocracy
D. Autocracy
Ans: C
Exp: Sol.37.(c) Kleptocracy a form of government characterized by rampant corruption, where leaders exploit national resources for personal gain Meritocracy a system in which people are chosen or promoted based on their abilities and achievements. Theocracy government ruled by religious leaders or based on religious laws. Autarchy a system of self-sufficiency or economic independence; also used for absolute rule.
Exam: SSC CGL 19/09/2025 (Shift 3)

Q.38 'A drug or agent that relieves pain without causing loss of consciousness'.
A. Narcotic
B. Sedative
C. Analgesic
D. Anesthetic
Ans: C
Exp: Sol.38.(c) Analgesic a drug or agent that relieves pain without causing loss of consciousness. Narcotic a drug that dulls the senses and can cause sleep or dependence. Sedative a substance that calms or induces sleep by reducing excitement or irritability. Anesthetic a substance that causes loss of sensation, often used to induce unconsciousness during surgery.
Exam: SSC CGL 19/09/2025 (Shift 3)

Q.39 The official act of a country or state allowing a person who is not a citizen to live there permanently.
A. Asylum
B. Expatriation
C. Naturalization
D. Deportation
Ans: C
Exp: Sol.39.(c) Naturalization the official act of a country or state allowing a person who is not a citizen to live there permanently. Asylum the protection granted by a state to someone who has left their home country as a political refugee. Expatriation the act of abandoning one's native country. Deportation the action of expelling a foreigner from a country.
Exam: SSC CGL 20/09/2025 (Shift 1)

Q.40 The deliberate use of misleading information to influence public opinion.
A. Transparency
B. Candour
C. Disinformation
D. Veracity
Ans: C
Exp: Sol.40.(c) Disinformation - the deliberate use of misleading information to influence public opinion. Transparency the condition of being transparent. Candour the quality of being open and honest in expression. Veracity conformity to truth or facts.
Exam: SSC CGL 20/09/2025 (Shift 1)

Q.41 A person who draws or makes maps.
A. Cartographer
B. Choreographer
C. Topographer
D. Geographer
Ans: A
Exp: Sol.41.(a) Cartographer a person who draws or makes maps. Choreographer a person who designs and arranges dance movements. Topographer a person who studies or maps the physical features of a particular area of land. Geographer a person who studies the earth's surface, environments, and how humans interact with them.
Exam: SSC CGL 20/09/2025 (Shift 2)

Q.42 The professor delivered a fascinating lecture on the study of birds.
A. Entomology
B. Ornithology
C. Zoology
D. Ecology
Ans: B
Exp: Sol.42.(b) Ornithology - the study of birds Entomology - the study of insects Zoology - the study of animals Ecology the study of the relationship between living organisms and their environment
Exam: SSC CGL 20/09/2025 (Shift 2)

Q.43 'Excessively idealistic; unrealistic and impractical.'
A. Quixotic
B. Temerity
C. Pedantic
D. Pusillanimous
Ans: A
Exp: Sol.43.(a) Quixotic excessively idealistic; unrealistic and impractical. Temerity reckless boldness or rashness. Pedantic overly concerned with minor details or rules. Pusillanimous lacking courage; cowardly.
Exam: SSC CGL 20/09/2025 (Shift 3)

Q.44 'A person morally unprincipled; a wicked or evil person.
A. Reprobate
B. Sycophant
C. Mendacious
D. Insouciant
Ans: A
Exp: Sol.44.(a) Reprobate a person morally unprincipled; a wicked or evil person. Sycophant a person who acts obsequiously to gain advantage; a flatterer. Mendacious - lying or dishonest. Insouciant carefree or unconcerned.
Exam: SSC CGL 20/09/2025 (Shift 3)

Q.45 The detective was searching for a person who is blamed for the wrongdoings, mistakes, or faults of others, especially for reasons of expediency.
A. Culprit
B. Accomplice
C. Scapegoat
D. Perpetrator
Ans: C
Exp: Sol.45.(c) Scapegoat a person who is blamed for the wrongdoings, mistakes, or faults of others, especially for reasons of expediency. Culprit a person who is responsible for a crime or other misdeed. Accomplice - a person who helps another commit a crime. Perpetrator a person who carries out a harmful, illegal, or immoral act.
Exam: SSC CGL 21/09/2025 (Shift 1)

Q.46 A factual written account of important or historical events in the order they happened.
A. Diary
B. Chronicle
C. Testament
D. Obituary
Ans: B
Exp: Sol.46.(b) Chronicle a factual written account of important or historical events in the order they happened. Diary a book in which one keeps a daily record of events and experiences. Testament a written declaration of beliefs, principles, or sometimes spiritual or moral in nature. Obituary a published notice of a person's death, usually with a brief summary of their life and achievements.
Exam: SSC CGL 21/09/2025 (Shift 1)

Q.47 'The study of handwriting to analyse personality.
A. Graphology
B. Typography
C. Calligraphy
D. Orthography
Ans: A
Exp: Sol.47.(a) Graphology the study of handwriting to analyse personality. Typography the art or process of arranging printed text and typefaces. Calligraphy the art of beautiful or decorative handwriting. Orthography the conventional spelling system of a language.
Exam: SSC CGL 21/09/2025 (Shift 2)

Q.48 A speech made without any preparation.'
A. Oration
B. Extempore
C. Soliloquy
D. Monologue
Ans: B
Exp: Sol.48.(b) Extempore a speech made without any preparation. Oration a formal and often ceremonial speech. Soliloquy a speech made by a character to themselves in a play, revealing inner thoughts. Monologue a long speech by one person in a play, movie, or conversation.
Exam: SSC CGL 21/09/2025 (Shift 2)

Q.49 A person who does not eat meat for moral, religious, or health reasons.
A. Vegetarian
B. Vegan
C. Fruitarian
D. Pescetarian
Ans: A
Exp: Sol.49.(a) Vegetarian A person who does not eat meat for moral, religious, or health reasons. Vegan a person who does not eat or use animal products. Fruitarian - a person who eats only fruit. Pescetarian a person who does not eat meat but does eat fish.
Exam: SSC CGL 21/09/2025 (Shift 3)

Q.50 A person who pretends to have virtues, morals, or principles that they do not actually possess.
A. Hypocrite
B. Philosopher
C. Altruist
D. Realist
Ans: A
Exp: Sol.50.(a) Hypocrite- A person who pretends to have virtues, morals, or principles that they do not actually possess. Philosopher- a person engaged or learned in philosophy, especially as an academic discipline. Altruist- a person who is genuinely concerned with the welfare of others and acts to help them without expecting personal gain. Realist- a person who accepts a situation as it is and is prepared to deal with it accordingly.
Exam: SSC CGL 21/09/2025 (Shift 3)

Q.51 'Fear of open or crowded places'.
A. Agoraphobia
B. Thanatophobia
C. Acrophobia
D. Xenophobia
Ans: A
Exp: Sol.51.(a) Agoraphobia fear of open or crowded places. Thanatophobia - fear of death or dying. Acrophobia fear of heights. Xenophobia fear or dislike of foreigners or strangers.
Exam: SSC CGL 22/09/2025 (Shift 1)

Q.52 A place where weapons and ammunition are stored'.
A. Arsenal
B. Dockyard
C. Repository
D. Hangar
Ans: A
Exp: Sol.52.(a) Arsenal a place where weapons and ammunition are made, stored, or repaired. Dockyard a place where ships are built, repaired, or maintained. Repository a place where things are stored safely. Hangar a large building where aircraft are kept.
Exam: SSC CGL 22/09/2025 (Shift 1)

Q.53 The ancient scroll contained a daily record of events or observations.
A. epic
B. souvenir
C. diary
D. gazette
Ans: C
Exp: Sol.53.(c) diary A daily personal record of experiences, thoughts, and observations, usually written privately. Epic a long poem, typically one derived from ancient oral tradition, narrating the deeds and adventures of heroic or legendary figures or the history of a nation. Souvenir a thing that is kept as a reminder of a person, place, or event. Gazette a newspaper or official journal.
Exam: SSC CGL 22/09/2025 (Shift 2)

Q.54 A person who denies the existence of God.
A. Agnostic
B. Theist
C. Atheist
D. Heretic
Ans: C
Exp: Sol.54.(c) Atheist a person who denies the existence of God. Agnostic a person who believes that nothing is known or can be known of the existence or nature of God or of anything beyond material phenomena. Theist a person who believes in the existence of a god or gods, specifically of a creator who intervenes in the universe. Deist a person who believes in the existence of a supreme being, specifically of a creator who does not intervene in the universe.
Exam: SSC CGL 22/09/2025 (Shift 2)

Q.55 'A story with a moral lesson'.
A. Fable
B. Novel
C. Drama
D. Poem
Ans: A
Exp: Sol.55.(a) Fable a story with a moral lesson Novel a long written story about imaginary characters and events. Drama a play written for performance on stage, involving conflict and emotion. Poem a piece of writing that expresses ideas and emotions through rhythm and style.
Exam: SSC CGL 22/09/2025 (Shift 3)

Q.56 'The art of beautiful handwriting'.
A. Geography
B. Typography
C. Biography
D. Calligraphy
Ans: D
Exp: Sol.56.(d) Calligraphy the art of beautiful and stylized handwriting or lettering. Typography the style, arrangement, and appearance of printed text. Biography a written account of someone's life. Geography the study of the Earth's surface, physical features, and human environment interaction.
Exam: SSC CGL 22/09/2025 (Shift 3)

Q.57 The humorous or mildly sarcastic use of words to imply the opposite of what they normally mean
A. Sarcasm
B. Irony
C. Satire
D. Paradox
Ans: B
Exp: Sol.57.(b) Irony the humorous or mildly sarcastic use of words to imply the opposite of what they normally mean. Sarcasm the use of irony to mock or convey contempt. Satire the use of humour, irony, exaggeration, or ridicule to expose and criticise people's stupidity or vices, particularly in the context of contemporary politics and other topical issues. Paradox a seemingly absurd or contradictory statement or proposition which when investigated may prove to be well founded or true.
Exam: SSC CGL 23/09/2025 (Shift 1)

Q.58 A person who believes that all events are ultimately determined by causes external to the will
A. Nihilist
B. Fatalist
C. Idealist
D. Hedonist
Ans: B
Exp: Sol.58.(b) Fatalist a person who believes that all events are predetermined and therefore inevitable. Nihilist a person who believes that life is meaningless and rejects all religious and moral principles. Idealist a person who is guided by ideals and principles rather than by practical considerations. Hedonist a person who believes that the pursuit of pleasure is the most important thing in life.
Exam: SSC CGL 23/09/2025 (Shift 1)

Q.59 'A person who deliberately sets fire to property'.
A. Pyromaniac
B. Arsonist
C. Vandal
D. Saboteur
Ans: B
Exp: Sol.59.(b) Arsonist a person who deliberately sets fire to property. Pyromaniac a person who has an uncontrollable desire or mental disorder that makes them set fires for excitement. Vandal a person who deliberately damages public or private property. Saboteur a person who destroys or damages something deliberately, especially for political or military advantage.
Exam: SSC CGL 23/09/2025 (Shift 2)

Q.60 'A speech delivered without any prior preparation'.
A. Extempore
B. Monologue
C. Dialogue
D. Soliloquy
Ans: A
Exp: Sol.60.(a) Extempore a speech delivered without any prior preparation. Monologue a long speech by one person, usually in a play or film. Dialogue a conversation between two or more people. Soliloquy a speech by a character in a play expressing their inner thoughts aloud, often when alone on stage.
Exam: SSC CGL 23/09/2025 (Shift 2)

Q.61 A person who believes that all events are predetermined and inevitable'.
A. Fatalist
B. Optimist
C. Pedant
D. Realist
Ans: A
Exp: Sol.61.(a) Fatalist a person who believes that all events are predetermined and inevitable. Optimist a person who tends to see the positive side of things and expects good outcomes. Pedant a person who overemphasizes rules or minor details, often in learning or teaching. Realist a person who accepts things as they are and deals with facts rather than ideas or emotions.
Exam: SSC CGL 23/09/2025 (Shift 3)

Q.62 'A government ruled by a king or queen'
A. Democracy
B. Oligarchy
C. Monarchy
D. Autocracy
Ans: C
Exp: Sol.62.(c) Monarchy a government ruled by a king or queen. Democracy a system of government where power rests with the people, usually through elected representatives. Oligarchy a government ruled by a small group of people. Autocracy a system of government ruled by a single person with absolute power.
Exam: SSC CGL 23/09/2025 (Shift 3)

Q.63 A secret plot or conspiracy, especially one intended to overthrow a government or leader.
A. Coup
B. Mutiny
C. Cabal
D. Machination
Ans: C
Exp: Sol.63.(c) Cabal - a secret plot or conspiracy, especially one intended to overthrow a government or leader. Coup a sudden, violent, and illegal seizure of power from a government. Mutiny an open rebellion against lawful authority, especially by soldiers or sailors against their officers. Machination a crafty or secret scheme, usually intended to achieve an evil purpose.
Exam: SSC CGL 24/09/2025 (Shift 1)

Q.64 A person who is excessively concerned with minor details and rules.
A. Pedant
B. Altruist
C. Philistine
D. Dilettante
Ans: A
Exp: Sol.64.(a) Pedant a person who is excessively concerned with minor details and rules. Altruist a person unselfishly concerned for or devoted to the welfare of others. Philistine a person who is hostile or indifferent to culture and the arts, or who has no understanding of them. Dilettante a person who cultivates an area of interest, such as the arts, without real commitment or knowledge.
Exam: SSC CGL 24/09/2025 (Shift 1)

Q.65 A person who pretends to have virtues, moral or religious beliefs he does not possess'
A. Hypocrite
B. Charlatan
C. Fraud
D. Indolent
Ans: A
Exp: Sol.65.(a) Hypocrite a person who pretends to have virtues, moral or religious beliefs he does not possess. Charlatan a person who falsely claims to have special knowledge or skills. Fraud a person who deceives others for personal gain. Indolent - a person who is habitually lazy.
Exam: SSC CGL 24/09/2025 (Shift 2)

Q.66 'A person who cannot be satisfied'
A. Contented
B. Insatiable
C. Avaricious
D. Sanguine
Ans: B
Exp: Sol.66.(b) Insatiable - Impossible to satisfy; having an unquenchable desire. Contented Pleased or satisfied with what one has; not wanting more. Avaricious - Extremely greedy, especially for wealth. Sanguine Optimistic or positive, especially in a difficult situation.
Exam: SSC CGL 24/09/2025 (Shift 2)

Q.67 A person who finds joy in the pain or suffering of others.
A. Pessimist
B. Sadist
C. Masochist
D. Narcissist
Ans: B
Exp: Sol.67.(b) Sadist a person who finds joy in the pain or suffering of others. Pessimist a person who tends to see the worst aspect of things. Masochist - a person who derives sexual gratification from their own pain or humiliation. Narcissist a person who has an excessive interest in or admiration of themselves.
Exam: SSC CGL 24/09/2025 (Shift 3)

Q.68 A statement that appears self-contradictory but contains a deeper truth.
A. Conundrum
B. Paradox
C. Riddle
D. Puzzle
Ans: B
Exp: Sol.68.(b) Paradox a seemingly absurd or self-contradictory statement or proposition that when investigated or explained may prove to be well founded or true. Conundrum a confusing and difficult problem or question. Riddle a question or statement intentionally phrased so as to require ingenuity in ascertaining its answer or meaning. Puzzle a game, toy, or problem designed to test ingenuity or knowledge.
Exam: SSC CGL 24/09/2025 (Shift 3)

Q.69 A person who chooses to live a simple life, often for religious or spiritual reasons, abstaining from worldly pleasures.
A. Hedonist
B. Sybarite
C. Ascetic
D. Libertine
Ans: C
Exp: Sol.69.(c) Ascetic a person who chooses to live a simple life, often for religious or spiritual reasons, abstaining from worldly pleasures. Hedonist a person who believes that the pursuit of pleasure is the most important thing in life. Sybarite a person who is self-indulgent in their fondness for sensuous luxury. Libertine a person, especially a man, who behaves without moral principles or a sense of responsibility, especially in sexual matters.
Exam: SSC CGL 25/09/2025 (Shift 1)

Q.70 An organism that is genetically identical to another organism.
A. Blueprint
B. Prototype
C. Schema
D. Clone
Ans: D
Exp: Sol.70.(d) Clone an organism that is genetically identical to another organism. Blueprint - a design plan or other technical drawing. Prototype a first or preliminary version of a device or vehicle from which other forms are developed. Schema a representation of a plan or theory in the form of an outline or model.
Exam: SSC CGL 25/09/2025 (Shift 1)

Q.71 'An animal that feeds on dead animals'
A. Predator
B. Scavenger
C. Omnivore
D. Herbivore
Ans: B
Exp: Sol.71.(b) Scavenger an animal that feeds on dead animals. Predator an animal that hunts and kills other animals for food. Omnivore an animal or person that eats both plants and animals. Herbivore an animal that feeds only on plants.
Exam: SSC CGL 25/09/2025 (Shift 2)

Q.72 'An expression of excessive pride or self-importance.
A. Arrogance
B. Hubris
C. Vanity
D. All are correct
Ans: D
Exp: Sol.72.(d) All are correct Arrogance an attitude of superiority and overbearing pride. Hubris excessive pride or self-confidence, often leading to downfall. Vanity excessive pride in one's appearance or achievements.
Exam: SSC CGL 25/09/2025 (Shift 2)

Q.73 A form of government in which power is held by the nobility.
A. Monarchy
B. Gerontocracy
C. Aristocracy
D. Authoritarianism
Ans: C
Exp: Sol.73.(c) Aristocracy a form of government in which power is held by the nobility. Monarchy a form of government with a monarch at the head. Gerontocracy a state, society, or group governed by old people. Authoritarianism a way of governing that values order and control over personal freedom.
Exam: SSC CGL 25/09/2025 (Shift 3)

Q.74 A person appointed to advise an organization on a particular subject.
A. Delegate
B. Consultant
C. Intrusive
D. Mentor
Ans: B
Exp: Sol.74.(b) Consultant a person appointed to advise an organization on a particular subject. Delegate a person sent or authorized to represent others, in particular an elected representative sent to a conference. Intrusive a person who is unwantedly present or involved. Mentor an experienced and trusted adviser.
Exam: SSC CGL 25/09/2025 (Shift 3)

Q.75 "A group of crows."
A. Murder
B. Flock
C. Swarm
D. Cluster
Ans: A
Exp: Sol.75.(a) Murder a group of crows. Pride - a group of lions. Swarm a large group of insects or small creatures moving together. Cluster a close group of things or people gathered together.
Exam: SSC CGL 26/09/2025 (Shift 1)

Q.76 "A person who travels on foot."
A. Pedestrian
B. Voyager
C. Walker
D. Hiker
Ans: A
Exp: Sol.76.(a) Pedestrian a person who travels on foot. Voyager a person who goes on a long journey, especially by sea or in space. Walker - a general term for someone who walks; not necessarily formal or precise. Hiker a person who walks long distances, usually in nature or on trails for recreation.
Exam: SSC CGL 26/09/2025 (Shift 1)

Q.77 A person who lives a solitary life and tends to avoid other people.
A. Hedonist
B. Recluse
C. Stoic
D. Epicurean
Ans: B
Exp: Sol.77.(b) Recluse - a person who lives a solitary life and tends to avoid other people. Hedonist a person who believes that the pursuit of pleasure is the most important thing in life; a pleasure-seeker. Stoic a person who can endure pain or hardship without showing their feelings or complaining. Epicurean a person devoted to sensual enjoyment, especially that derived from fine food and drink.
Exam: SSC CGL 26/09/2025 (Shift 2)

Q.78 A drug that causes temporary loss of memory.
A. Amnesiac
B. Narcotic
C. Hypnotic
D. Purgative
Ans: A
Exp: Sol.78.(a) Amnesiac a drug that causes temporary loss of memory. Narcotic a drug that relieves pain and induces drowsiness, stupor, or insensibility. Hypnotic - a drug that induces sleep. Purgative a substance that makes you empty your bowels.
Exam: SSC CGL 26/09/2025 (Shift 2)

Q.79 'The study of ancient inscriptions.
A. Numismatics
B. Epigraphy
C. Cartography
D. Archaeology
Ans: B
Exp: Sol.79.(b) Epigraphy the study of ancient inscriptions. Numismatics the study or collection of coins, currency, and medals. Cartography the study and practice of making maps. Archaeology - the study of human history and prehistory through excavation of sites and analysis of artifacts.
Exam: SSC CGL 26/09/2025 (Shift 3)

Q.80 'Fear of darkness.'
A. Nyctophobia
B. Photophobia
C. Chronophobia
D. Hydrophobia
Ans: A
Exp: Sol.80.(a) Nyctophobia- fear of darkness. Photophobia sensitivity or aversion to light. Chronophobia fear of time or the passing of time. Hydrophobia - fear of water.
Exam: SSC CGL 26/09/2025 (Shift 3)

Q.81 A sudden, violent outburst of emotion or activity.
A. Frenzy
B. Apoplexy
C. Tempest
D. Maelstrom
Ans: B
Exp: Sol.81.(b) Apoplexy a sudden, violent outburst of emotion or activity. Frenzy wild excitement or uncontrolled activity. Tempest - a violent storm. Maelstrom a powerful whirlpool or turbulent situation.
Exam: SSC CGL 14/10/2025 (Shift 1)

Q.82 Vocabulary that is used between people who belong to the same social group and who know each other well.
A. Idiom
B. Colloquialism
C. Slang
D. Euphemism
Ans: C
Exp: Sol.82.(c) Slang Vocabulary that is used between people who belong to the same social group and who know each other well. Idiom a group of words established by usage as having a meaning not deducible from those of the individual words. Colloquialism a word or phrase that is not formal or literary, typically one used in ordinary or familiar conversation. Euphemism a mild or indirect word or expression substituted for one considered to be too harsh or blunt when referring to something unpleasant or embarrassing.
Exam: SSC CGL 14/10/2025 (Shift 2)

Q.83 A person who talks too much about trivial matters.
A. Loquacious
B. Taciturn
C. Reticent
D. Pithy
Ans: A
Exp: Sol.83.(a) Loquacious a person talks excessively, often about unimportant things. Taciturn means reserved or silent by nature. Reticent refers to someone unwilling to speak or express their thoughts freely. Pithy means concise and meaningful in speech or writing.
Exam: SSC CGL 14/10/2025 (Shift 3)

Q.84 Choose the correct one-word substitution for: "A doctor who treats diseases of the eyes."
A. Physician
B. Optician
C. Ophthalmologist
D. Gynecologist
Ans: C
Exp: Sol.84.(c) Ophthalmologist a doctor who treats diseases of the eyes. Physician a doctor specializing in general medical treatment. Optician a person who makes and fits glasses or lenses. Gynecologist a doctor who deals with the female reproductive system.
Exam: Matriculation Level 24/07/2025 (Shift - 1)

Q.85 Choose the correct one-word substitution for: "A short, interesting story about a real person."
A. Fable
B. Anecdote
C. Biography
D. Chronicle
Ans: B
Exp: Sol.85.(b) Anecdote a short, interesting story about a real person. Fable a fictional story, typically with animals as characters. Biography a written account of someone's life. Chronicle a factual written record of events in order.
Exam: Matriculation Level 24/07/2025 (Shift - 1)

Q.86 Choose the correct one-word substitution for: "An animal that lives on land and in water."
A. Reptile
B. Amphibian
C. Aquatic
D. Mammal
Ans: B
Exp: Sol.86.(b) Amphibian an animal that lives on land and in water. Reptile a cold-blooded vertebrate that has scales, like snakes and lizards. Aquatic an animal that lives in water. Mammal a warm-blooded animal that gives birth to young ones.
Exam: Matriculation Level 25/07/2025 (Shift - 1)

Q.87 Choose the correct one-word substitution for: "The art and technique of arranging type to make written language legible, readable and appealing when displayed."
A. Lithography
B. Biography
C. Geography
D. Typography
Ans: D
Exp: Sol.87.(d) Typography the art and technique of arranging type to make written language legible, readable and appealing when displayed. Lithography the process of printing from a flat surface treated so as to repel the ink except where it is required for printing. Biography a written account of someone's life. Geography the study of the physical features of the Earth.
Exam: Matriculation Level 25/07/2025 (Shift - 1)

Q.88 Choose the correct one-word substitution for: "A book written by a person about his or her own life
A. Bibliography
B. Autobiography
C. Journal
D. Chronicle
Ans: B
Exp: Sol.88.(b) Autobiography a book written by a person about his or her own life. Bibliography a list of books or written works referenced by an author. Journal a personal record of thoughts, experiences, and reflections written regularly. Chronicle a factual written account of important historical events in the order of their occurrence.
Exam: Matriculation Level 26/07/2025 (Shift - 1)

Q.89 Choose the correct one-word substitution for: "an official order that has the force of law."
A. Decree
B. Suggestion
C. Request
D. Petition
Ans: A
Exp: Sol.89.(a) Decree an official order that has the force of law. Suggestion an idea or plan put forward for consideration. Request an act of asking politely or formally for something. Petition a formal written request, typically one signed by many people, appealing to authority in respect of a particular cause.
Exam: Matriculation Level 26/07/2025 (Shift - 1)

Q.90 Choose the correct one-word substitution for: "an infant that has been abandoned by its parents and is discovered and cared for by others."
A. Waif
B. Foundling
C. Infant
D. Dependent
Ans: B
Exp: Sol.90.(b) Foundling an infant that has been abandoned by its parents and is discovered and cared for by others. Waif a homeless and neglected child. Infant a very young child or baby. Dependent someone relying on another for support.
Exam: Matriculation Level 28/07/2025 (Shift - 1)

Q.91 Choose the correct one-word substitution for: "A low continuous humming sound."
A. Murmur
B. Thunder
C. Melody
D. Bang
Ans: A
Exp: Sol.91.(a) Murmur a low continuous humming sound. Thunder a loud rumbling noise after lightning. Melody a pleasant sequence of musical notes. Bang- a sudden loud noise.
Exam: Matriculation Level 28/07/2025 (Shift - 1)

Q.92 Choose the correct one-word substitution for: "extreme or irrational fear of water."
A. Pyrophobia
B. Hydrophobia
C. Chronophobia
D. Glossophobia
Ans: B
Exp: Sol.92.(b) Hydrophobia extreme ог irrational fear of water Pyrophobia - fear of fire. Chronophobia - fear of time. Glossophobia fear of speaking in public.
Exam: Matriculation Level 29/07/2025 (Shift - 1)

Q.93 Choose the correct one-word substitution for: "The killing of one's father."
A. Patricide
B. Infanticide
C. Homicide
D. Regicide
Ans: A
Exp: Sol.93.(a) Patricide the killing of one's father. Infanticide - killing of an infant. Homicide - the killing of a human being. Regicide - killing of a king.
Exam: Matriculation Level 29/07/2025 (Shift - 1)

Q.94 Choose the correct one-word substitution for: "A person who is excessively in love with himself."
A. Introvert
B. Narcissist
C. Pessimist
D. Egoist
Ans: B
Exp: Sol.94.(b) Narcissist a person who is excessively in love with himself. Introvert - a shy and reserved person. Pessimist a person who expects the worst to happen. Egoist - a person who is excessively self - centered.
Exam: Matriculation Level 30/07/2025 (Shift - 1)

Q.95 Choose the correct one-word substitution for: "A person who pretends to know more than they actually do."
A. Scholar
B. Charlatan
C. Mentor
D. Analyst
Ans: B
Exp: Sol.95.(b) Charlatan a person who pretends to know more than they actually do. Scholar a learned or educated person. Mentor an experienced and trusted advisor. Analyst a person who studies or examines something in detail.
Exam: Matriculation Level 30/07/2025 (Shift - 1)

Q.96 Choose the correct one-word substitution for: "Scientific study of the causes and effects of diseases."
A. Pathology
B. Ecology
C. Anatomy
D. Oncology
Ans: A
Exp: Sol.96.(a) Pathology scientific study of the causes and effects of diseases. Ecology study of organisms and environment. Anatomy study of structure of organisms. Oncology study and treatment of cancer.
Exam: Matriculation Level 31/07/2025 (Shift - 1)

Q.97 Choose the correct one-word substitution for: "A person who believes that everything happens for the best."
A. Pessimist
B. Opportunist
C. Optimist
D. Rebel
Ans: C
Exp: Sol.97.(c) Optimist a person who believes that everything happens for the best. Pessimist a person who tends to see the worst aspect of things or believe that the worst will happen. Opportunist one who takes advantage of any situation for personal gain. Rebel a person who resists authority or control.
Exam: Matriculation Level 31/07/2025 (Shift-1)

Q.98 Choose the correct one-word substitution for: "The scientific study of language and its structure."
A. Ecology
B. Sociology
C. Linguistics
D. Astrology
Ans: C
Exp: Sol.98.(c) Linguistics the scientific study of language and its structure. Ecology study of relations between organisms and environment. Sociology - the study of the development, structure, and functioning of human society. Astrology the study of the movements and positions of the sun, moon, planets, and stars in the belief that they affect the character and lives of people.
Exam: Matriculation Level 01/08/2025 (Shift-1)

Q.99 Choose the correct one-word substitution for: "The scientific study of fish."
A. Ecology
B. Archaeology
C. Ichthyology
D. Ornithology
Ans: C
Exp: Sol.99.(c) Ichthyology the scientific study of fish. Ecology the study of the relationship between living organisms and their environment. Archaeology the study of ancient societies using material remains. Ornithology - the scientific study of birds.
Exam: Matriculation Level 01/08/2025 (Shift-1)

Q.100 Choose the correct one-word substitution for: "A long speech by one person during a conversation."
A. Monologue
B. Dialogue
C. Recital
D. Statement
Ans: A
Exp: Sol.100.(a) Monologue a long speech by one person during a conversation. Dialogue conversation between two or more people. Recital - performance of music or poetry. Statement a clear expression of something in speech or writing.
Exam: Matriculation Level 01/08/2025 (Shift-2)

Q.101 Choose the correct one-word substitution for: "Having an obstinately uncooperative attitude, especially towards authority or discipline."
A. Obdurate
B. Notorious
C. Recalcitrant
D. Impeccable
Ans: C
Exp: Sol.101.(c) Recalcitrant - having an obstinately uncooperative attitude, especially towards authority or discipline. Obdurate stubbornly refusing to change one's opinion or course of action. Notorious famous or well known, typically for some bad quality or deed. Impeccable in accordance with the highest standards; faultless.
Exam: Matriculation Level 01/08/2025 (Shift-2)

Q.102 Choose the correct one-word substitution for: "certain to happen and unable to be avoided or prevented"
A. Inevitable
B. Invisible
C. Impenetrable
D. Immaterial
Ans: A
Exp: Sol.102.(a) Inevitable - certain to happen and unable to be avoided or prevented. Invisible unable to be seen. Impenetrable impossible to pass through. Immaterial - not important or relevant.
Exam: Matriculation Level 01/08/2025 (Shift-3)

Q.103 Choose the correct one-word substitution for: "A person who speaks very little or is reserved."
A. Talkative
B. Reticent
C. Cheerful
D. Active
Ans: B
Exp: Sol.103.(b) Reticent a person who speaks very little or is reserved. Talkative someone who talks a lot or likes to talk continuously. Cheerful a happy, optimistic, and pleasant person in mood or manner. Active someone who is energetic and always busy doing things.
Exam: Matriculation Level 01/08/2025 (Shift - 3)

Q.104 Choose the correct one-word substitution for: "A figure of speech in which exaggeration is used for emphasis."
A. Hyperbole
B. Dialogue
C. Parody
D. Refrain
Ans: A
Exp: Sol.104.(a) Hyperbole a figure of speech in which exaggeration is used for emphasis. Dialogue conversation between two or more people. Parody humorous imitation of a piece of writing or music. Refrain a repeated line in a poem or song.
Exam: Matriculation Level 02/08/2025 (Shift - 1)

Q.105 Choose the correct one-word substitution for: "A pithy saying or remark expressing an idea in a clever and amusing way."
A. Proverb
B. Epigram
C. Quotation
D. Fable
Ans: B
Exp: Sol.105.(b) Epigram a pithy saying or remark expressing an idea in a clever and amusing way. Proverb a short saying expressing a general truth. Quotation a group of words taken from a text or speech. Fable a short story, typically with animals, conveying a moral.
Exam: Matriculation Level 02/08/2025 (Shift -1)

Q.106 Choose the correct one-word substitute for the following phrase: "A very small patch of colour or light."
A. Chunk
B. Fleck
C. Slice
D. Block
Ans: B
Exp: Sol.106.(b) Fleck a very small patch of colour or light. Chunk a thick, solid piece of something. Slice a thin, flat piece cut from something. Block - a large solid piece.
Exam: Matriculation Level 02/08/2025 (Shift-1)

Q.107 Choose the correct one-word substitute for: "An extremely strong and offensive smell."
A. Vapour
B. Scent
C. Reek
D. Aroma
Ans: C
Exp: Sol.107.(c) Reek an extremely strong and offensive smell. Vapour - a substance diffused or suspended in the air, especially one normally liquid or solid. Scent a distinctive smell, especially one that is pleasant. Aroma a distinctive, typically pleasant smell.
Exam: Matriculation Level 02/08/2025 (Shift - 1)

Q.108 Choose the best one-word substitute for: "A person who writes poems."
A. Poet
B. Critic
C. Publisher
D. Dramatist
Ans: A
Exp: Sol.108.(a) Poet a person who writes poems. Critic a person who evaluates and judges literary or artistic works. Publisher a person or company that prepares and distributes books, magazines, or other written works for sale. Dramatist a person who writes plays for the theatre.
Exam: Matriculation Level 29/08/2025 (Shift - 3)

Q.109 Choose the correct one-word substitution for: "A person having great natural ability or talent, especially at a young age."
A. Prodigy
B. Trainee
C. Scholar
D. Beginner
Ans: A
Exp: Sol.109.(a) Prodigy a person having great natural ability or talent, especially at a young age. Trainee a person who is being trained for a particular job or skill. Scholar a learned person or someone who studies a subject deeply. Beginner a person who has just started to learn or do something.
Exam: Matriculation Level 29/08/2025 (Shift - 3)

Q.110 Choose the correct one-word substitution for: "A custom, belief, or method that is old-fashioned and outdated."
A. Tradition
B. Innovation
C. Archaic
D. Ritual
Ans: C
Exp: Sol.110.(c) Archaic a custom, belief, or method that is old-fashioned and outdated. Tradition a custom or belief passed down through generations. Innovation the introduction of something new, such as a new idea, method, or invention. Ritual a religious or solemn ceremony performed according to a set pattern.
Exam: Matriculation Level 29/08/2025 (Shift - 3)

Q.111 Choose the correct one-word substitution for: "A person who believes in fate and accepts events as unavoidable."
A. Fatalist
B. Realist
C. Zealot
D. Activist
Ans: A
Exp: Sol.111.(a) Fatalist a person who believes in fate and accepts events as unavoidable. Realist a person who accepts a situation as it is and is prepared to deal with it accordingly. Zealot a person who is fanatical and uncompromising in pursuit of their religious, political, or other ideals. Activist a person who campaigns to bring about political or social change.
Exam: Matriculation Level 29/08/2025 (Shift - 3)

Q.112 Choose the correct one-word substitution for: "A person who avoids eating any animal product including meat, milk, and eggs."
A. Vegetarian
B. Vegan
C. Teetotaller
D. Herbivore
Ans: B
Exp: Sol.112.(b) Vegan a person who avoids eating any animal product including meat, milk, and eggs. Vegetarian someone who does not eat meat but may consume dairy/eggs. Teetotaller someone who abstains completely from alcohol. Herbivore an animal that feeds on plants.
Exam: Matriculation Level 29/08/2025 (Shift - 3)

Q.113 Choose the correct one-word substitution for: "A person who talks while sleeping."
A. Hypersomnia
B. Somniloquist
C. Sleeper
D. Psychologist
Ans: B
Exp: Sol.113.(b) Somniloquist a person who talks while sleeping. Hypersomnia a condition in which a person sleeps excessively or has an uncontrollable need to sleep. Sleeper person who is sleeping or someone who sleeps. Psychologist specialist who studies the human mind and behavior.
Exam: Matriculation Level 29/08/2025 (Shift - 3)

Q.114 Choose the correct one-word substitution for: "the belief in a supernatural power that organizes and animates the material universe."
A. Deism
B. Animism
C. Atheism
D. Rationalism
Ans: B
Exp: Sol.114.(b) Animism the belief in a supernatural power that organizes and animates the material universe. Deism - belief in the existence of a supreme being, specifically of a creator who does not intervene in the universe. Atheism disbelief in the existence of God or gods. Rationalism the practice or principle of basing opinions and actions on reason and knowledge rather than on religious belief or emotional response.
Exam: Higher Secondary 24/07/2025 (Shift - 2)

Q.115 Choose the correct one-word substitution for: "A group of people who have a common characteristic or occupation."
A. Posse
B. Convoy
C. Caravan
D. Regiment
Ans: A
Exp: Sol.115.(a) Posse a group of people who have a common characteristic or occupation. Convoy a group of vehicles or ships traveling together for protection. Caravan a group of travelers journeying together, especially across a desert. Regiment a permanent unit of an army typically commanded by a colonel.
Exam: Higher Secondary 25/07/2025 (Shift - 2)

Q.116 Choose the correct one-word substitution for: "The fear of doctors or medical treatment."
A. Astraphobia
B. latrophobia
C. Zoophobia
D. Phonophobia
Ans: B
Exp: Sol.116.(b) latrophobia the fear of doctors or medical treatment. Astraphobia the fear of thunder and lightning. Zoophobia - the fear of animals. Phonophobia - the fear of loud sounds.
Exam: Higher Secondary 26/07/2025 (Shift - 2)

Q.117 Choose the correct one word substitution for: "Language that is informal and typically used in casual conversation."
A. Slang
B. Patois
C. Vernacular
D. Phrase
Ans: A
Exp: Sol.117.(a) Slang language that is informal and typically used in casual conversation. Patois the dialect of a particular region, especially one with low status in relation to the standard language of the country. Vernacular the language spoken by ordinary people in a particular region or country. Phrase a small group of words standing together as a conceptual unit.
Exam: Higher Secondary 28/07/2025 (Shift - 2)

Q.118 Choose the correct one-word substitution for: "A person who believes that pleasure is the most important goal in life."
A. Pessimist
B. Hedonist
C. Activist
D. Nominee
Ans: B
Exp: Sol.118.(b) Hedonist a person who believes that pleasure is the most important goal in life. Pessimist a person who tends to see the worst aspect of things or believe that the worst will happen. Activist a person who campaigns for social or political change. Nominee a person proposed or formally entered for a position.
Exam: Higher Secondary 29/07/2025 (Shift - 2)

Q.119 What is the term for the fear of heights that causes anxiety when a person is at an elevated place?
A. Claustrophobia
B. Acrophobia
C. Nyctophobia
D. Xenophobia
Ans: B
Exp: Sol.119.(b) Acrophobia the fear of heights that causes anxiety when a person is at an elevated place. Claustrophobia fear of enclosed spaces. Nyctophobia - fear of darkness. Xenophobia fear or dislike of strangers or foreigners.
Exam: Higher Secondary 30/07/2025 (Shift - 2)

Q.120 Choose the correct one-word substitution for: "The scientific study of soils in relation to plant growth."
A. Pedology
B. Bryology
C. Botany
D. Anatomy
Ans: A
Exp: Sol.120.(a) Pedology the scientific study of soils in relation to growth. Bryology the scientific study of bryophytes. Botany the scientific study of the physiology, structure, genetics, ecology, distribution, classification, and economic importance of plants. Anatomy the study of the internal and external structure of organisms and their parts.
Exam: Higher Secondary 31/07/2025 (Shift - 2)

Q.121 Choose the best one-word substitute for: "a person who loves books"
A. Bibliophile
B. Pedant
C. Misogynist
D. Nihilist
Ans: A
Exp: Sol.121.(a) Bibliophile - a lover of books. Pedant a person overly concerned with minor details or rules. Misogynist - a person who hates women. Nihilist one who believes life is meaningless.
Exam: Higher Secondary 31/07/2025 (Shift - 2)

Q.122 Choose the correct one-word substitution for: "A person who believes that nothing is known or can be known of the existence or nature of God."
A. Atheist
B. Agnostic
C. Theist
D. Mystic
Ans: B
Exp: Sol.122. (b) Agnostic a person who believes that nothing is known or can be known of the existence or nature of God. Atheist a person who does not believe in the existence of God. Theist a person who believes in the existence of God. Mystic a person who seeks spiritual truth beyond the intellect.
Exam: Higher Secondary 02/08/2025 (Shift - 2)

Q.123 Choose the correct one-word substitution for: "A person who lives in extreme self-denial, rejecting physical comforts for spiritual discipline."
A. Ascetic
B. Iconoclast
C. Luminary
D. Vitalist
Ans: A
Exp: Sol.123.(a) Ascetic a person who lives in extreme self-denial, rejecting physical comforts for spiritual discipline. Iconoclast a person who attacks traditional beliefs or institutions. Luminary a person who inspires or influences others. Vitalist one who believes life is governed by a special vital principle.
Exam: Higher Secondary 02/08/2025 (Shift - 2)

Q.124 What is the fear of open or crowded public places known as?
A. Agoraphobia
B. Monophobia
C. Anthropophobia
D. Pyrophobia
Ans: A
Exp: Sol.124.(a) Agoraphobia the fear of open or crowded public places Monophobia - fear of being alone. Anthropophobia fear of people or society. Pyrophobia - fear of fire.
Exam: Higher Secondary 29/08/2025 (Shift - 2)

Q.125 Which term refers to: "A figure of speech in which a word or a phrase from figurative speech is used in a new context."
A. Metalepsis
B. Anachrony
C. Epiphany
D. Allusion
Ans: A
Exp: Sol.125.(a) Metalepsis a figure of speech in which a word or a phrase from figurative speech is used in a new context. Anachrony a discrepancy between the chronological order of events and the order in which they are presented in the plot. Epiphany a moment of sudden and great revelation or realization. Allusion an expression designed to call something to mind without mentioning it explicitly; an indirect ог passing reference.
Exam: Graduate Level 24/07/2025 (Shift - 3)

Q.126 Which term refers to: "A state in which a person experiences a continuous and intrusive stream of anxious thoughts that they cannot control"?
A. Rumination
B. Cataplexy
C. Echolalia
D. Derealization
Ans: A
Exp: Sol.126.(a) Rumination - a state in which a person experiences a continuous and intrusive stream of anxious thoughts that they can not control. Cataplexy sudden, brief muscular weakness while you're awake that's triggered by strong emotions, like laughter. Echolalia the repetition of words or phrases spoken by someone else. Derealization a mental state where you feel detached from your surroundings.
Exam: Graduate Level 24/07/2025 (Shift - 3)

Q.127 What term refers to: "The philosophical view that reality is mentally constructed and that external objects cannot be known independently of human perception"?
A. Constructivism
B. Dualism
C. Rationalism
D. Positivism
Ans: A
Exp: Sol.127.(a) Constructivism the philosophical view that reality is mentally constructed and that external objects cannot be known independently of human perception. Dualism the belief that mind and body are fundamentally distinct substances. Rationalism the view that knowledge is primarily gained through reason. Positivism the belief that knowledge should be based on observable scientific facts.
Exam: Graduate Level 25/07/2025 (Shift - 3)

Q.128 What is the term for: "A device where the audience is aware of information unknown to the characters, causing contrast between perception and reality."?
A. Satire
B. Dramatic Irony
C. Hyperbole
D. Cosmic Irony
Ans: B
Exp: Sol.128.(b) Dramatic Irony a device where the audience is aware of information unknown to the characters, causing contrast between perception and reality. Satire the use of humour, irony, exaggeration, or ridicule to expose and criticize people's stupidity or vices. Hyperbole exaggerated statements or claims not meant to be taken literally. Cosmic Irony a literary device where events are manipulated by a powerful force (such as destiny, fate, or the gods) to mock or frustrate human efforts and expectations.
Exam: Graduate Level 25/07/2025 (Shift - 3)

Q.129 What term refers to: "The science of phenomena as distinct from that of the nature of being."?
A. Phenomenology
B. Empiricism
C. Determinism
D. Positivism
Ans: A
Exp: Sol.129.(a) Phenomenology the science of phenomena as distinct from that of the nature of being. Empiricism the belief that knowledge comes through sensory experience. Determinism the belief that all events are causally predetermined. Positivism the view that genuine knowledge is derived from scientific observation.
Exam: Graduate Level 26/07/2025 (Shift - 3)

Q.130 What is the term for: "An imitation of the style of a particular writer, artist, or genre with deliberate exaggeration for comic effect"?
A. Parody
B. Metonymy
C. Parable
D. Symbolism
Ans: A
Exp: Sol.130.(a) Parody an imitation of the style of a particular writer, artist, or genre with deliberate exaggeration for comic effect. Metonymy the substitution of the name of an attribute or adjunct for that of the thing meant. Parable a simple story used to illustrate a moral or spiritual lesson. Symbolism the use of symbols to represent ideas or qualities.
Exam: Graduate Level 26/07/2025 (Shift - 3)

Q.131 What is the one-word term for: "The condition in which some cells in an organism have different chromosome numbers or genetic makeup from others"?
A. Mosaicism
B. Polyploidy
C. Disjunction
D. Translocation
Ans: A
Exp: Sol.131.(a) Mosaicism the condition in which some cells in an organism have different chromosome numbers or genetic makeup from others. Polyploidy multiple complete sets of chromosomes. Disjunction the separation of chromosomes during cell division. Translocation the transfer of a chromosome segment to a non-homologous chromosome.
Exam: Graduate Level 28/07/2025 (Shift - 3)

Q.132 What is the one-word substitute for: "A moral fable, especially one with animals as characters."
A. Apologue
B. Chronicle
C. Vignette
D. Anecdote
Ans: A
Exp: Sol.132.(a) Apologue a moral fable, especially one with animals as characters. Chronicle a factual written account of historical events. Vignette a brief descriptive scene or sketch. Anecdote - a short, amusing or interesting story about a real incident.
Exam: Graduate Level 28/07/2025 (Shift - 3)

Q.133 Which of the following refers to "A massive, luminous explosion marking the violent death of a large star"?
A. Supernova
B. Pulsar
C. Galaxy
D. Red Dwarf
Ans: A
Exp: Sol.133. (a) Supernova a massive, luminous explosion marking the violent death of a large star. Pulsar a rapidly rotating neutron star emitting beams of radiation. Galaxy a huge system of stars, dust, and gas bound by gravity. Red Dwarf a small, cool star with a very long lifespan.
Exam: Graduate Level 29/07/2025 (Shift - 3)

Q.134 What is the one-word term for: "A figure of speech that juxtaposes concepts with opposite meanings within a word or in a phrase that is a self-contradiction."
A. Apostrophe
B. Oxymoron
C. Soliloquy
D. Anachronism
Ans: B
Exp: Sol.134.(b) Oxymoron a figure of speech that juxtaposes concepts with opposite meanings within a word or in a phrase that is a self-contradiction. Apostrophe addressing an absent or imaginary person or thing. Soliloquy a character speaking thoughts aloud when alone on stage. Anachronism something placed in an incorrect historical time.
Exam: Graduate Level 29/07/2025 (Shift - 3)

|Q.135 Select the one-word substitute for "a person who derives pleasure from causing pain to others."
A. Altruist
B. Sadist
C. Stoic
D. Optimist
Ans: B
Exp: Sol.135.(b) Sadist - a person who derives pleasure from causing pain to others. Altruist a person who is selflessly concerned for the well-being of others. Stoic a person who endures hardship without showing emotion. Optimist a person who tends to see the positive side of things.
Exam: Graduate Level 31/07/2025 (Shift - 3)

Q.136 What is the one-word substitute for: "A person who has an uncontrollable impulse to wander away from home or travel aimlessly."
A. Peripatetic
B. Solivagant
C. Fugueur
D. Cosmopolite
Ans: C
Exp: Sol.136.(c) Fugueur a person who has an uncontrollable impulse to wander away from home or travel aimlessly. Peripatetic traveling from place to place, especially for work. Solivagant one who wanders alone. Cosmopolite a person who feels at home in any part of the world.
Exam: Graduate Level 31/07/2025 (Shift - 3)

Q.137 Which term refers to "The tendency of individuals to act in ways they normally wouldn't when their identity is concealed, such as wearing masks or uniforms"?
A. Persona
B. Disinhibition
C. Role-playing
D. Individualism
Ans: B
Exp: Sol.137. (b) Disinhibition the tendency of individuals to act in ways they normally wouldn't when their identity is concealed, such as wearing masks or uniforms. Persona a social mask or the public image someone presents to the world, often different from their private self. Role-playing acting out a specific character or behavior. Individualism - the habit or principle of being independent and self-reliant.
Exam: Graduate Level 02/08/2025 (Shift - 3)

Q.138 What is the one-word substitute for. "A technique in which small dots of color are applied to create an image when viewed from a distance."
A. Pointillism
B. Cubism
C. Surrealism
D. Calligraphy
Ans: A
Exp: Sol.138. (a) Pointillism a technique in which small dots of color are applied to create an image when viewed from a distance. Cubism an art style using geometric shapes and fragmented forms. Surrealism an art movement focused on dreamlike, illogical scenes. Calligraphy decorative handwriting or lettering.
Exam: Graduate Level 02/08/2025 (Shift - 3)

Q.139 Choose the correct one-word substitution for the sentence below. "An official order that prohibits or restricts commerce or exchange with a particular country."
A. Interdict
B. Stipend
C. Clemency
D. Syncretism
Ans: A
Exp: Sol.139.(a) Interdict Interdict a formal prohibition or restraint, especially one imposed by authority.
Exam: Graduate Level 29/08/2025 (Shift - 1)

Q.140 Choose the correct one word substitution for: "A person who is indifferent to pleasure or pain".
A. Epicure
B. Stoic
C. Pessimist
D. Masochist
Ans: B
Exp: Sol.140.(b) Stoic- a person who is indifferent to pleasure or pain. Epicure- a person who takes particular pleasure in fine food and drink. Pessimist- a person who tends to see the worst aspect of things. Masochist- a person who derives sexual gratification from their own pain or humiliation.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.141 Choose the correct one word substitution for: "An ideal society marked by justice, equality, and happiness."
A. Oligarchy
B. Technocracy
C. Dystopia
D. Utopia
Ans: D
Exp: Sol.141.(d) Utopia- an ideal society marked by justice, equality, and happiness. Oligarchy a small group of people having control of a country or organization. Technocracy- the government or control of society or industry by an elite of technical experts. Dystopia- an imagined state or society in which there is great suffering or injustice, typically one that is totalitarian or post-apocalyptic.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.142 Which of the following words means "prohibited by law or treaty from being imported or exported"?
A. Restricted
B. Illegal
C. Banned
D. Contraband
Ans: D
Exp: Sol.142.(d) Contraband- prohibited by law or treaty from being imported or exported. Restricted- limited, especially by official rules or laws. Illegal- not authorised by law. Banned- forbidden by law.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.143 Choose the correct one-word substitution for: "A humorous poem of five lines"
A. Elegy
B. Limerick
C. Haiku
D. Sonnet
Ans: B
Exp: Sol.143.(b) Limerick- a humorous poem of five lines. Elegy a poem of lamentation for the dead. Haiku- a three-line poem of seventeen syllables where the first line has five syllables, the second has seven, and the third has five. Sonnet- a poem, often a love poem, of 14 rhyming lines.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.144 Choose the correct one-word substitution for: "A person who hates other people or mankind"
A. Misanthrope
B. Optimist
C. Egoist
D. Misogynist
Ans: A
Exp: Sol.144.(a) Misanthrope a person who hates other people or mankind. Optimist- one who always sees the bright side of any situation. Egoist- a self-centred or selfish person. Misogynist- a person who hates women.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.145 Choose the correct one word substitution for: "The practice of deliberately expressing less than what is meant."
A. Euphemism
B. Irony
C. Hyperbole
D. Litotes
Ans: D
Exp: Sol.145.(d) Litotes- the practice of deliberately expressing less than what is meant. Euphemism- a word or phrase used to avoid saying an unpleasant or offensive word. Irony- an expression whose intended meaning is opposite of its literal meaning. Hyperbole- a way of writing or speaking which something is exaggerated to make it seem bigger or more important than it really is.
Exam: SSC Stenographer 06/08/2025 (Shift 1)

Q.146 Select the one-word term for: "A brief note or explanation added alongside a diagram or passage to provide clarity or context."
A. Annotation
B. Footnote
C. Glossary
D. Caption
Ans: A
Exp: Sol.146.(a) Annotation a brief note or explanation added alongside a diagram or passage to provide clarity or context. Footnote an additional piece of information printed at the bottom of a page. Glossary an alphabetical list of words relating to a specific subject, text, or dialect, with explanations. Caption a caption is a short piece of text that provides context or explanation for an image, video, or other visual content.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.147 Choose the correct one-word substitution for: A place where aircraft are kept
A. Dockyard
B. Depot
C. Hangar
D. Barracks
Ans: C
Exp: Sol.147.(c) Hangar a place where aircraft are kept. Dockyard an area with docks and equipment for repairing and maintaining ships. Depot a place where buses, trains, or other vehicles are housed and maintained and from which they are dispatched for service. Barracks a large building or group of buildings used to house soldiers.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.148 Select the one-word term for: "Someone who is consistently excluded or ignored by a community due to lack of trust or popularity."
A. Dissenter
B. Noble
C. Pariah
D. Loyalist
Ans: C
Exp: Sol.148.(c) Pariah someone who is consistently excluded or ignored by a community due to lack of trust or popularity Dissenter someone who disagrees with commonly held opinions or beliefs. Noble someone who has high moral qualities like honesty, kindness, and courage; also a person of high rank. Loyalist someone who strongly supports a ruler, government, or cause and remains faithful even in difficult times.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.149 Choose the correct one-word substitution for: "Property inherited from one's father"
A. Matrimony
B. Patrimony
C. Autocracy
D. Testimony
Ans: B
Exp: Sol.149.(b) Patrimony property inherited from one's father. Matrimony the state of being married; marriage. Autocracy a system of government where one person has unlimited power. Testimony a formal statement given as evidence, especially in court; also means proof of something.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.150 Choose the correct one-word substitution for: "A facility equipped with instruments for studying stars, planets, and other celestial bodies"
A. Laboratory
B. Observatory
C. Greenhouse
D. Archive
Ans: B
Exp: Sol.150.(b) Observatory a facility equipped with instruments for studying stars, planets, and other celestial bodies. Laboratory a facility equipped for scientific experiments, research, and testing, usually in chemistry, biology, or physics. Greenhouse a glass or transparent structure used for growing plants under controlled conditions. Archive a collection of historical records, documents, or materials preserved for reference and research.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.151 What is the place for ammunition and weapons called ?
A. Gallery
B. Library
C. Arsenal
D. Laboratory
Ans: C
Exp: Sol.151.(c) Arsenal a place for ammunition and weapons. Gallery a room or building for displaying art or exhibitions. Library a place where books, magazines, and other reading materials are kept for reading or borrowing. Laboratory a place equipped for scientific experiments, research, or testing.
Exam: SSC Stenographer 06/08/2025 (Shift 2)

Q.152 What is the one word for "A person who is talkative"?
A. Introvert
B. Garrulous
C. Reticent
D. Taciturn
Ans: B
Exp: Sol.152.(b) Garrulous- a person who is talkative. Introvert- a person who turns his thoughts inwards. Reticent- not revealing one's thoughts or feelings readily. Taciturn- reserved in speech.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.153 Choose the one which can be substituted for the given sentence. A medicine that induces sleep
A. Sedative
B. Narcotic
C. Analgesic
D. Hypnotic
Ans: D
Exp: Sol.153.(d) Hypnotic- a medicine that induces sleep. Sedative- a drug that has a calming effect. Narcotic- a drug that relieves pain and may cause drowsiness. Analgesic- a drug that produces diminished sensation to pain without loss of consciousness.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.154 Choose the one which can be substituted for the given sentence. One who studies the evolution of mankind
A. Archaeologist
B. Sociologist
C. Anthropologist
D. Philologist
Ans: C
Exp: Sol.154.(c) Anthropologist- one who studies the evolution of mankind. Archaeologist- a scientist who studies human history by digging up human remains and artifacts. Sociologist- one who studies the development, structure, and functioning of human society. Philologist- one who studies the history of languages, especially by looking closely at literature.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.155 Choose the one which can be substituted for the given sentence. A place where wild animals are kept
A. Abattoir
B. Aquarium
C. Zoo
D. Aviary
Ans: C
Exp: Sol.155.(c) Zoo a place where wild animals are kept. Abattoir a place where animals are slaughtered. Aquarium a place where aquatic animals are kept. Aviary a place where birds are kept.
Exam: SSC Stenographer 06/08/2025 (Shift 3)

Q.156 Choose the one which can be substituted for the given sentence. A person's peculiar habit or mannerism
A. Idiosyncrasy
B. Illusion
C. Hypocrisy
D. Eccentricity
Ans: A
Exp: Sol.156.(a) Idiosyncrasy a person's peculiar habit or mannerism. Illusion a false perception or deceptive appearance. Hypocrisy the practice of claiming beliefs or virtues one does not truly possess. Eccentricity unconventional or odd behavior.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.157 Which of the following refers to the branch of science concerned with the study of sound, its production, transmission, and effects ?
A. Acoustics
B. Geology
C. Thermodynamics
D. Optics
Ans: A
Exp: Sol.157.(a) Acoustics the branch of science concerned with the study of sound, including its production, transmission, and effects. Geology the study of the Earth, its structure, rocks, minerals, and the processes that shape it. Thermodynamics - the branch of physics that deals with heat, work, temperature, and energy. Optics the branch of physics that deals with the behavior and properties of light, including its reflection, refraction, and dispersion.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.158 Choose the correct one-word substitution for: "A speech delivered without preparation"
A. Soliloquy
B. Rebuttal
C. Monologue
D. Impromptu
Ans: D
Exp: Sol.158.(d) Impromptu a speech delivered without preparation. Soliloquy a speech in which a character speaks their thoughts aloud, usually when alone, often used in drama. Rebuttal a reply intended to disprove or counter an argument. Monologue a long speech by one person during a conversation, play, or performance.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.159 Choose the correct one-word substitution for: "the act of placing a dead person in a grave."
A. Interment
B. Funeral
C. Rebellion
D. Coronation
Ans: A
Exp: Sol.159.(a) Interment - the act of placing a dead person in a grave. Funeral a ceremony held to honor and bury or cremate a dead person. Rebellion - an organized act of resistance or defiance against authority or government. Coronation - the ceremony of crowning a king, queen, or monarch.
Exam: SSC Stenographer 07/08/2025 (Shift 1)

Q.160 Choose the one-word substitution for the following sentence. Someone who has been forced to flee his or her country because of persecution, war or violence.
A. Shelter
B. Asylum
C. Refugee
D. Sanctuary

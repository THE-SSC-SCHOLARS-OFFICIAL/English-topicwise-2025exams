Exp: Capricious - given to sudden and unaccountable changes of mood or behavior. Fickle - changing frequently, especially as regards one's loyalties or affections. Stable - not likely to give way or overturn; firmly fixed. Consistent - acting or done in the same way over time, especially so as to be fair or accurate. Resolute - admirably purposeful, determined, and unwavering.
Exam: SSC CGL 12/09/2025 (Shift 3)

Q.4 QUIESCENT
A. Active
B. Dormant
C. Lively
D. Energetic
Ans: B
Exp: Quiescent - in a state or period of inactivity or dormancy. Dormant - (of an animal) having normal physical functions suspended or slowed down for a period. Active - engaging or ready to engage in physically energetic pursuits. Lively - full of life and energy. Energetic - showing or involving great activity or vitality.
Exam: SSC CGL 13/09/2025 (Shift 1)

Q.5 AUSPICIOUS
A. Unfavourable
B. Promising
C. Ominous
D. Unlucky
Ans: B
Exp: Auspicious - conducive to success. Promising - showing signs of future success. Unfavourable - (of circumstances) not advantageous or helpful. Ominous - giving the worrying impression that something bad is going to happen. Unlucky - having or bringing bad luck.
Exam: SSC CGL 13/09/2025 (Shift 3)

Q.6 SAGACIOUS
A. Foolish
B. Wise
C. Immature
D. Careless
Ans: B
Exp: Sagacious - having or showing keen mental discernment and good judgment. Wise - having or showing experience, knowledge, and good judgment. Foolish - lacking good sense or judgment. Immature - not fully developed in thought or behavior. Careless - not giving enough attention or thought to what one is doing.
Exam: SSC CGL 14/09/2025 (Shift 1)

Q.7 IGNOMINIOUS
A. Honorable
B. Disgraceful
C. Laudable
D. Illustrious
Ans: B
Exp: Ignominous - deserving or causing public disgrace or shame. Disgraceful - bringing disgrace or shame. Honorable - bringing or meriting honor. Laudable - (of an action, idea, or aim) deserving praise and commendation. Illustrious - well known, respected, and admired for past achievements.
Exam: SSC CGL 14/09/2025 (Shift 2)

Q.8 PENURY
A. Wealth
B. Affluence
C. Indigence
D. Prosperity
Ans: C
Exp: Penury - the state of being very poor. Indigence - a state of extreme poverty. Wealth - an abundance of valuable possessions or money. Affluence - the state of having a great deal of money. Prosperity - the state of being successful, typically by earning a lot of money.
Exam: SSC CGL 14/09/2025 (Shift 3)

Q.9 METICULOUS
A. Careless
B. Hasty
C. Thorough
D. Negligent
Ans: C
Exp: Meticulous - showing great attention to detail. Thorough - complete with attention to every detail. Careless - not giving sufficient attention or thought to avoiding harm or errors. Hasty - done with excessive speed or urgency. Negligent - failing to take proper care in doing something.
Exam: SSC CGL 15/09/2025 (Shift 1)

Q.10 INTRANSIGENT
A. Compliant
B. Adamant
C. Submissive
D. Yielding
Ans: B
Exp: Intransigent - unwilling to change one's opinions or agree about something. Adamant - firm, determined, and not willing to change one's mind. Compliant - willing to agree or obey. Submissive - ready to accept authority or control of others without resistance. Yielding - giving way under pressure; not firm or strong in opinion.
Exam: SSC CGL 15/09/2025 (Shift 2)

Q.11 ADVERSITY
A. Hardship
B. Prosperity
C. Comfort
D. Luxury
Ans: A
Exp: Adversity - a difficult or unpleasant situation. Hardship - severe suffering or difficulty. Prosperity - the state of being successful and wealthy. Comfort - a state of physical or mental ease. Luxury - a state of great comfort or extravagance.
Exam: SSC CGL 16/09/2025 (Shift 1)

Q.12 LOQUACIOUS
A. Quiet
B. Verbose
C. Introverted
D. Mute
Ans: B
Exp: Loquacious - tending to talk a great deal. Verbose - using or expressed in more words than are needed. Quiet - making little or no noise. Introverted - a person predominantly concerned with their own thoughts and feelings rather than with external things. Mute - refraining from speech or temporarily speechless.
Exam: SSC CGL 16/09/2025 (Shift 2)

Q.13 INSOUCIANT
A. Anxious
B. Concerned
C. Nonchalant
D. Careworn
Ans: C
Exp: Insouciant - showing a casual lack of concern. Nonchalant - calm, relaxed, and unconcerned. Anxious - feeling worried, uneasy, or nervous. Concerned - showing worry or interest about something. Careworn - tired and worried because of problems or anxiety.
Exam: SSC CGL 16/09/2025 (Shift 3)

Q.14 VIGILANT
A. Careless
B. Alert
C. Lazy
D. Negligent
Ans: B
Exp: Vigilant - watchful and careful to notice danger or trouble. Alert - quick to notice and respond to potential danger or problems. Careless - not giving enough attention or thought to avoiding harm or mistakes. Lazy - unwilling to work or use energy. Negligent - failing to take proper care in doing something.
Exam: SSC CGL 17/09/2025 (Shift 1)

Q.15 IMPECUNIOUS
A. Wealthy
B. Affluent
C. Destitute
D. Prosperous
Ans: C
Exp: Impecunious - having little or no money. Destitute - extremely poor and lacking the means to provide for oneself. Wealthy - having a great deal of money, resources, or possessions. Affluent - having an abundance of wealth or property. Prosperous - successful and financially well-off.
Exam: SSC CGL 17/09/2025 (Shift 1)

Q.16 SCRUPULOUS
A. Conscientious
B. Careless
C. Dishonest
D. Sloppy
Ans: A
Exp: Scrupulous - (of a person or process) diligent, thorough, and extremely careful. Conscientious - wishing to do one's work or duty well and thoroughly. Careless - not paying enough attention to avoid harm or error. Dishonest - fraudulent or deceptive. Sloppy - careless and untidy.
Exam: SSC CGL 17/09/2025 (Shift 2)

Q.17 IMPECCABLE
A. Flawless
B. Careless
C. Doubtful
D. Ordinary
Ans: A
Exp: Impeccable - perfect or faultless. Flawless - without any imperfections or defects. Careless - not giving enough attention or thought to what one is doing. Doubtful - feeling uncertain or unsure. Ordinary - common or usual; not special or distinctive.
Exam: SSC CGL 17/09/2025 (Shift 3)

Q.18 PERSPICACIOUS
A. Dull
B. Alert
C. Forgetful
D. Passive
Ans: B
Exp: Perspicacious - having a keen understanding or quick insight. Alert - quick to notice and understand things. Dull - lacking brightness, intelligence, or sharpness. Forgetful - unable to remember things easily. Passive - accepting or allowing things to happen without active response.
Exam: SSC CGL 17/09/2025 (Shift 3)

Q.19 ASSIDUOUS
A. Lazy
B. Diligent
C. Careless
D. Indifferent
Ans: B
Exp: Assiduous - showing great care and perseverance. Diligent - having or showing care and conscientiousness in one's work or duties. Lazy - unwilling to work or use energy. Careless - not giving sufficient attention to avoiding harm or error. Indifferent - having no particular interest or sympathy.
Exam: SSC CGL 18/09/2025 (Shift 1)

Q.20 TACITURN
A. Garrulous
B. Reserved
C. Communicative
D. Outspoken
Ans: B
Exp: Taciturn - habitually silent or not talkative. Reserved - quiet and restrained in speech or behavior. Garrulous - excessively talkative, especially on trivial matters. Communicative - willing to talk or share information freely. Outspoken - expressing opinions freely and openly.
Exam: SSC CGL 18/09/2025 (Shift 2)

Q.21 IGNOMINY
A. Esteem
B. Disgrace
C. Renown
D. Adulation
Ans: B
Exp: Ignominy - a situation or event that causes great humiliation or disgrace. Disgrace - loss of reputation or respect due to a shameful act. Esteem - respect or admiration. Renown - the state of being widely known or famous. Adulation - excessive admiration or praise.
Exam: SSC CGL 18/09/2025 (Shift 2)

Q.22 TRACTABLE
A. Unruly
B. Amenable
C. Obstinate
D. Intransigent
Ans: B
Exp: Tractable - (of a person or animal) easy to control or influence. Amenable - (of a person) open and responsive to suggestions. Unruly - disorderly and disruptive and not amenable to control. Obstinate - stubbornly refusing to change one's opinion or chosen course of action. Intransigent - unwilling or refusing to change one's views or to agree about something.
Exam: SSC CGL 18/09/2025 (Shift 3)

Q.23 METICULOUS
A. Careless
B. Hasty
C. Thorough
D. Indifferent
Ans: C
Exp: Meticulous - showing great attention to detail. Thorough - done with great care and completeness. Careless - not giving enough attention or thought to what one is doing. Hasty - done too quickly or without enough thought. Indifferent - having no particular interest or concern.
Exam: SSC CGL 19/09/2025 (Shift 1)

Q.24 EXCORIATE
A. Praise
B. Criticize
C. Reward
D. Honor
Ans: B
Exp: Excoriate - to criticize someone or something very severely. Criticize - to express disapproval or find fault with something. Praise - to express approval or admiration. Reward - to give something in recognition of effort or achievement.
Exam: SSC CGL 19/09/2025 (Shift 1)

Q.25 EQUIVOCAL
A. Clear
B. Certain
C. Ambiguous
D. Explicit
Ans: C
Exp: Equivocal - open to more than one interpretation. Ambiguous - open to more than one interpretation; having a double meaning. Clear - easy to perceive, understand, or interpret. Certain - known for sure. Explicit - stated clearly and in detail, leaving no room for confusion or doubt.
Exam: SSC CGL 19/09/2025 (Shift 2)

Q.26 IMPECUNIOUS
A. Affluent
B. Destitute
C. Prosperous
D. Wealthy
Ans: B
Exp: Impecunious - having little or no money. Destitute - extremely poor and lacking the means to provide for oneself. Affluent - having a great deal of money. Prosperous - successful and financially well-off. Wealthy - having a large amount of money or valuable possessions.
Exam: SSC CGL 19/09/2025 (Shift 3)

Q.27 CAREFREE
A. Anxious
B. Insouciant
C. Responsible
D. Hesitant
Ans: B
Exp: Carefree - free from worry or responsibility. Insouciant - showing a casual lack of concern. Anxious - feeling worried, uneasy, or nervous. Responsible - having an obligation to do something or being accountable for something. Hesitant - unsure or slow in acting or speaking.
Exam: SSC CGL 19/09/2025 (Shift 3)

Q.28 EQUIVOCATION
A. Honesty
B. Ambiguity
C. Directness
D. Certainty
Ans: B
Exp: Equivocation - the use of ambiguous language to conceal the truth or to avoid committing oneself. Ambiguity - the quality of being open to more than one interpretation. Honesty - the quality of being truthful and sincere. Directness - the quality or state of being direct. Certainty - firm conviction that something is the case.
Exam: SSC CGL 20/09/2025 (Shift 1)

Q.29 INVETERATE
A. Occasional
B. Habitual
C. Temporary
D. Sporadic
Ans: B
Exp: Inveterate - a habit or practice that is long-established and unlikely to change. Habitual - done regularly or repeatedly. Occasional - happening irregularly or infrequently. Temporary - lasting for only a limited period. Sporadic - occurring at irregular intervals.
Exam: SSC CGL 20/09/2025 (Shift 2)

Q.30 OBEISANCE
A. Defiance
B. Reverence
C. Rebellion
D. Neglect
Ans: B
Exp: Obeisance - a gesture or act showing respect, submission, or honor toward someone. Reverence - deep respect or admiration for someone or something. Defiance - open resistance or bold disobedience. Rebellion - an act of violent or open resistance against authority. Neglect - failure to care for something properly.
Exam: SSC CGL 20/09/2025 (Shift 3)

Q.31 ANTEDILUVIAN
A. Modern
B. Ancient
C. Contemporary
D. Futuristic
Ans: B
Exp: Antediluvian - extremely old-fashioned or belonging to ancient times. Ancient - very old or from a long time ago. Modern - relating to the present or recent times. Contemporary - belonging to the same period or current era. Futuristic - concerned with the future or advanced technology.
Exam: SSC CGL 20/09/2025 (Shift 3)

Q.32 FASTIDIOUS
A. Careless
B. Meticulous
C. Hasty
D. Sloppy
Ans: B
Exp: Fastidious - very attentive to and concerned about accuracy and detail. Meticulous - showing great attention to detail. Careless - not giving sufficient attention to avoiding harm or error. Hasty - done or acting with excessive speed or urgency. Sloppy - careless and untidy.
Exam: SSC CGL 21/09/2025 (Shift 1)

Q.33 UBIQUITOUS
A. Rare
B. Scarce
C. Pervasive
D. Limited
Ans: C
Exp: Ubiquitous - existing or being everywhere at the same time. Pervasive - spreading widely throughout an area or a group. Rare - something that occurs infrequently or is uncommon. Scarce - insufficient in quantity. Limited - restricted in amount, number, or extent.
Exam: SSC CGL 21/09/2025 (Shift 2)

Q.34 COMMEND
A. Criticise
B. Praise
C. Blame
D. Reprimand
Ans: B
Exp: Commend - praise formally or officially. Praise - express warm approval or admiration of. Criticise - indicate the faults of (someone or something) in a disapproving way. Blame - feel or declare that (someone or something) is responsible for a fault or wrong. Reprimand - a formal expression of disapproval.
Exam: SSC CGL 21/09/2025 (Shift 3)

Q.35 FERVENT
A. Apathetic
B. Passionate
C. Cold
D. Indifferent
Ans: B
Exp: Fervent - showing or having intense passion, enthusiasm, or warmth of feeling. Passionate - having or showing strong emotions or beliefs. Apathetic - showing or feeling no interest or enthusiasm. Cold - lacking affection or warmth. Indifferent - having no particular interest or concern.
Exam: SSC CGL 22/09/2025 (Shift 1)

Q.36 Robust
A. Sensitive
B. Fragile
C. Durable
D. Sturdy
Ans: D
Exp: Robust - strong, healthy, and vigorous. Sturdy - strongly built and able to withstand pressure or hardship. Sensitive - easily upset by things people say or do. Fragile - easily broken or damaged. Durable - able to last for a long time without damage.
Exam: SSC CGL 22/09/2025 (Shift 2)

Q.37 EXCORIATE
A. Praise
B. Criticize
C. Reward
D. Honor
Ans: B
Exp: Excoriate - to severely criticize or denounce someone or something. Criticize - to indicate the faults of someone or something. Praise - to express approval or admiration. Reward - to give something in recognition of service or achievement. Honor - to regard with respect or show reverence.
Exam: SSC CGL 22/09/2025 (Shift 3)

Q.38 RAPTURE
A. Misery
B. Ecstasy
C. Sorrow
D. Indifference
Ans: B
Exp: Rapture - a feeling of intense pleasure or joy. Ecstasy - an overwhelming feeling of great happiness or joyful excitement. Misery - a state or feeling of great distress or discomfort of mind or body. Sorrow - a feeling of deep distress caused by loss, disappointment, or other misfortune. Indifference - lack of interest, concern, or sympathy.
Exam: SSC CGL 23/09/2025 (Shift 1)

Q.39 MALIGN
A. Praise
B. Criticize
C. Compliment
D. Appreciate
Ans: B
Exp: Malign - to speak harmful or critical words about someone. Criticize - to indicate the faults of someone or something. Praise - to express warm approval or admiration. Compliment - to politely praise or express admiration. Appreciate - to recognize the value or significance of something.
Exam: SSC CGL 23/09/2025 (Shift 2)

Q.40 INSURMOUNTABLE
A. Overcomeable
B. Unconquerable
C. Manageable
D. Trivial
Ans: B
Exp: Insurmountable - too great to be overcome. Unconquerable - impossible to defeat or overcome. Overcomeable - capable of being overcome. Manageable - easy to handle or control. Trivial - of little value or importance.
Exam: SSC CGL 23/09/2025 (Shift 3)

Q.41 TRUCULENT
A. Aggressive
B. Pellucid
C. Obsequious
D. Peaceful
Ans: A
Exp: Truculent - eager or quick to argue, fight, or be aggressively defiant. Aggressive - ready or likely to attack or confront. Pellucid - clear, transparent, or easily understood. Obsequious - overly submissive or eager to please. Peaceful - free from disturbance.
Exam: SSC CGL 24/09/2025 (Shift 2)

Q.42 GALA
A. Ordinary
B. Function
C. Drab
D. Merriment
Ans: D
Exp: Gala - a social occasion with special entertainments or performances. Merriment - gaiety and fun. Ordinary - with no special or distinctive features. Function - an activity or purpose natural to or intended for a person or thing. Drab - lacking brightness or interest.
Exam: SSC CGL 24/09/2025 (Shift 3)

Q.43 SERENE
A. Turbulent
B. Tranquil
C. Chaotic
D. Disturbed
Ans: B
Exp: Serene - calm, peaceful, and untroubled. Tranquil - free from disturbance. Turbulent - characterized by conflict, disorder, or confusion. Chaotic - in a state of complete confusion and disorder. Disturbed - having had its normal arrangement or condition altered.
Exam: SSC CGL 25/09/2025 (Shift 1)

Q.44 ACQUISITIVE
A. Greedy
B. Generous
C. Selfless
D. Benevolent
Ans: A
Exp: Acquisitive - strongly desirous of acquiring and possessing. Greedy - eager to get more than what is needed. Generous - willing to give or share freely. Selfless - concerned more with the needs of others than with oneself. Benevolent - well-meaning and kindly.
Exam: SSC CGL 25/09/2025 (Shift 2)

Q.45 Jubilant
A. Tedium
B. Indolence
C. Bewilderment
D. Thrilled
Ans: D
Exp: Jubilant - showing great joy or triumph. Thrilled - feeling extremely happy and excited. Tedium - the state of being dull or boring. Indolence - laziness or avoidance of activity. Bewilderment - a state of feeling lost.
Exam: SSC CGL 25/09/2025 (Shift 3)

Q.46 REPINE
A. Complain
B. Restore
C. Celebrate
D. Forgive
Ans: A
Exp: Repine - to feel or express discontent; to complain or fret about something. Complain - to express dissatisfaction or annoyance about something. Restore - to bring back or return something to its original condition. Celebrate - to acknowledge a happy or important event with festivities. Forgive - to stop feeling angry or resentful toward someone for an offense.
Exam: SSC CGL 26/09/2025 (Shift 1)

Q.47 CAPRICIOUS
A. Predictable
B. Fickle
C. Stable
D. Reliable
Ans: B
Exp: Capricious - given to sudden and unaccountable changes of mood or behavior; unpredictable. Fickle - changing frequently, especially in regards to one's loyalties, interests, or affection; inconsistent. Predictable - able to be predicted. Stable - not likely to change; firmly established. Reliable - consistently good in quality or performance; dependable.
Exam: SSC CGL 26/09/2025 (Shift 3)

Q.48 MALIGN
A. Praise
B. Criticize
C. Compliment
D. Appreciate
Ans: B
Exp: Malign - to speak harmful or critical words about someone. Criticize - to indicate the faults of someone or something. Praise - to express warm approval or admiration. Compliment - to politely praise or express admiration. Appreciate - to recognize the value or significance of something.
Exam: SSC CGL 14/10/2025 (Shift 1)

Q.49 Active
A. Indolent
B. Sedulous
C. Industrious
D. Slothful
Ans: C
Exp: Active - engaging or ready to engage in physically energetic pursuits. Industrious - regularly working very hard. Indolent - wanting to avoid activity or exertion. Sedulous - someone who works hard and doesn't give up easily. Slothful - indolent.
Exam: SSC CGL 14/10/2025 (Shift 2)

Q.50 LOQUACIOUS
A. Quiet
B. Verbose
C. Introverted
D. Mute
Ans: B
Exp: Loquacious - tending to talk a great deal. Verbose - using or expressed in more words than are needed. Quiet - making little or no noise. Introverted - a person predominantly concerned with their own thoughts and feelings rather than with external things. Mute - refraining from speech or temporarily speechless.
Exam: SSC CGL 14/10/2025 (Shift 3)

Q.51 Identify the synonym of "Amiable":
A. Cordial
B. Rude
C. Harsh
D. Severe
Ans: A
Exp: Amiable - a person who is friendly and good-natured. Cordial - friendly and pleasant in behaviour. Rude - impolite or disrespectful in manner. Harsh - very rough or severe in tone or behaviour. Severe - extremely strict or serious in attitude.
Exam: SSC Selection Post Matriculation Level 24/07/2025 (Shift - 1)

Q.52 Identify the synonym of "Pinnacle":
A. Depth
B. Base
C. Summit
D. Decline
Ans: C
Exp: Pinnacle - the topmost or highest point. Summit - the highest point or peak. Base - the bottom part. Depth - the deepest point. Decline - downward movement.
Exam: SSC Selection Post Matriculation Level 24/07/2025 (Shift - 1)

Q.53 Identify the synonym of "Melancholic":
A. Gloomy
B. Cheerful
C. Animated
D. Vibrant
Ans: A
Exp: Melancholic - expressing feelings of sadness. Gloomy - dark in a way that makes you feel sad. Cheerful - feeling or showing happiness. Animated - full of interest and energy. Vibrant - lively and energetic.
Exam: SSC Selection Post Matriculation Level 25/07/2025 (Shift - 1)

Q.54 Identify the synonym of "Fraudulence":
A. Sincerity
B. Guile
C. Veracity
D. Frankness
Ans: B
Exp: Fraudulence - act of being intentionally deceitful or dishonest. Guile - clever but dishonest behaviour or trickery. Sincerity - the quality of showing or saying what you really think or feel. Veracity - the quality of being true or correct. Frankness - free expression of one's true feelings and opinions.
Exam: SSC Selection Post Matriculation Level 25/07/2025 (Shift - 1)

Q.55 Identify the synonym of "Peril":
A. Assurance
B. Relief
C. Danger
D. Guarantee
Ans: C
Exp: Peril - something that is very dangerous. Danger - a situation that can cause harm. Relief - removal of distress. Assurance - a promise that something will certainly happen. Guarantee - promise of certainty.
Exam: SSC Selection Post Matriculation Level 26/07/2025 (Shift - 1)

Q.56 Identify the synonym of "Utopian":
A. Visionary
B. Pragmatic
C. Sensible
D. Realistic
Ans: A
Exp: Utopian - related to an ideal, perfect society. Visionary - having idealistic dreams of a perfect world. Pragmatic - dealing with problems in a practical way. Sensible - able to make good judgements based on reason and experience. Realistic - showing things as they really are.
Exam: SSC Selection Post Matriculation Level 26/07/2025 (Shift - 1)

Q.57 Identify the synonym of "Capricious":
A. Dependable
B. Steady
C. Fixed
D. Erratic
Ans: D
Exp: Capricious - someone who changes mood or decisions suddenly and unpredictably. Erratic - behaving in an unpredictable or irregular way. Steady - happening in a smooth, gradual, and regular way. Fixed - not able to be changed. Dependable - Someone who can always be trusted.
Exam: SSC Selection Post Matriculation Level 28/07/2025 (Shift - 1)

Q.58 Identify the synonym of "Mundane":
A. Dull
B. Radiant
C. Lively
D. Sparkling
Ans: A
Exp: Mundane - very ordinary and therefore not interesting. Dull - lacking excitement or interest. Radiant - showing great happiness. Lively - having or showing a lot of energy and enthusiasm. Sparkling - shining with many small points of light.
Exam: SSC Selection Post Matriculation Level 28/07/2025 (Shift - 1)

Q.59 Identify the synonym of "Vigorous":
A. Lethargic
B. Robust
C. Weak
D. Feeble
Ans: B
Exp: Vigorous - full of energy, strength and forceful activity. Robust - showing great physical or mental strength. Lethargic - feeling dull and inactive. Weak - lacking power or ability. Feeble - very weak or fragile.
Exam: SSC Selection Post Matriculation Level 29/07/2025 (Shift - 1)

Q.60 Identify the synonym of "Disreputable":
A. Ill-famed
B. Respectable
C. Distinguished
D. Honorable
Ans: A
Exp: Disreputable - not respected because of bad behaviour. Ill-famed - known for a bad reputation. Respectable - considered proper or socially acceptable. Distinguished - highly respected and admired for achievements. Honorable - morally upright and principled.
Exam: SSC Selection Post Matriculation Level 29/07/2025 (Shift - 1)

Q.61 Identify the synonym of "Cheerful":
A. Mirthful
B. bubbly
C. Miserable
D. Depressed
Ans: B
Exp: Cheerful - happy, positive and full of liveliness. bubbly - someone who is full of joy, laughter and good spirits. Mirthful - full of laughter and amusement. Miserable - very unhappy or depressed. Depressed - feeling extremely sad and low.
Exam: SSC Selection Post Matriculation Level 30/07/2025 (Shift - 1)

Q.62 Identify the synonym of "Deceitful":
A. Candid
B. Forthright
C. Fraudulent
D. Genuine
Ans: C
Exp: Deceitful - one who hides the truth, lies, or tricks others. Fraudulent - someone who cheats or deceives. Candid - openly straightforward and direct without reserve or secretiveness. Forthright - direct and straightforward in speech. Genuine - it is real and exactly what it appears to be.
Exam: SSC Selection Post Matriculation Level 30/07/2025 (Shift - 1)

Q.63 Identify the synonym of "Conspicuous":
A. Concealed
B. Hidden
C. Noticeable
D. Invisible
Ans: C
Exp: Conspicuous - something that attracts attention because it is easily visible. Noticeable - something that can be easily seen or observed. Hidden - being out of sight or not readily apparent. Concealed - covered or disguised so it cannot be seen. Invisible - not visible to the eyes.
Exam: SSC Selection Post Matriculation Level 31/07/2025 (Shift - 1)

Q.64 Identify the synonym of "Obstinate":
A. Pliable
B. Obedient
C. Stubborn
D. Subdued
Ans: C
Exp: Obstinate - someone who does not change opinion easily. Stubborn - one who refuses to change views, firm and unyielding in attitude. Obedient - willing to follow orders. Pliable - easily influenced or flexible in nature. Subdued - quiet because you are feeling sad or worried.
Exam: SSC Selection Post Matriculation Level 31/07/2025 (Shift - 1)

Q.65 Identify the synonym of "Impending":
A. Forthcoming
B. Remote
C. Deferred
D. Unlikely
Ans: A
Exp: Impending - an event that is likely to happen very soon, often something unpleasant. Forthcoming - something that is about to happen soon. Remote - something far away in time or possibility. Deferred - postponed or delayed to a later time. Unlikely - an event that is not expected to happen.
Exam: SSC Selection Post Matriculation Level 01/08/2025 (Shift - 1)

Q.66 Identify the synonym of "Serene":
A. Noisy
B. Agitated
C. Disturbed
D. Calm
Ans: D
Exp: Serene - completely peaceful and untroubled. Calm - quiet and free from disturbance. Agitated - a feeling of irritability, mental distress or severe restlessness. Disturbed - troubled or upset mentally. Noisy - full of loud sounds.
Exam: SSC Selection Post Matriculation Level 01/08/2025 (Shift - 1)

Q.67 Identify the synonym of "Transparency":
A. Ambiguity
B. Openness
C. Confusion
D. Murkiness

D. Courteous
Ans: A
Exp: Insolent - boldly rude or disrespectful in speech or behavior. Disrespectful - showing a lack of respect or rudeness. Gentle - kind, mild, and tender in behavior or action. Polite - showing good manners and consideration for others. Courteous - polite, respectful, and considerate in manner.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.132 Which word is closest in meaning to 'Castigate'?
A. Vague
B. Dull
C. Dark
D. Condemn
Ans: D
Exp: Castigate - to criticize or punish severely. Condemn - to express strong disapproval of. Vague - not clearly expressed or defined; unclear. Dull - lacking interest, brightness, or sharpness; boring. Dark - having little or no light; not light in color; gloomy.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.133 Select the synonym of Amiable.
A. Friendly
B. Rude
C. Hostile
D. Cold
Ans: A
Exp: Amiable - having a friendly and good-natured personality. Friendly - kind, pleasant, and supportive toward others. Rude - impolite or offensive in behavior or speech. Hostile - unfriendly, antagonistic, or opposed. Cold - lacking warmth or friendliness; distant in manner.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.134 Select the synonym of Esoteric.
A. Common
B. Mysterious
C. Popular
D. Clear
Ans: B
Exp: Esoteric - intended for or likely to be understood by only a small number of people with specialized knowledge. Mysterious - difficult to understand, explain, or identify. Common - not special or unusual. Popular - liked, admired, or enjoyed by many people. Clear - easy to perceive, understand, or interpret.
Exam: SSC Stenographer 08/08/2025 (Shift 2)

Q.135 Select the synonym of Ubiquitous.
A. Isolated
B. Omnipresent
C. Rare
D. Occasional
Ans: B
Exp: Ubiquitous - present everywhere, very common, or widespread. Omnipresent - present everywhere at the same time. Isolated - existing alone or separated from others. Rare - something uncommon, unusual, or exceptional. Occasional - happening from time to time, not frequent or regular.
Exam: SSC Stenographer 08/08/2025 (Shift 3)

Q.136 Which word is closest in meaning to 'Allay'?
A. Pacify
B. Clash
C. Noise
D. Dispute
Ans: A
Exp: Allay - to reduce fear, doubt, or worry. Pacify - to make peace or calm, to ease agitation. Clash - a violent conflict or confrontation. Noise - unwanted or unpleasant sound. Dispute - a disagreement or argument.
Exam: SSC Stenographer 08/08/2025 (Shift 3)

Q.137 Select the synonym of Feeble.
A. Robust
B. Strong
C. Sturdy
D. Weak
Ans: D
Exp: Feeble - very weak or lacking strength. Weak - lacking physical strength or power. Robust - strong, healthy, and full of energy. Strong - having great physical power, force, or influence. Sturdy - firmly built, strong, and durable.
Exam: SSC Stenographer 08/08/2025 (Shift 3)

Q.138 Select the synonym of Chronic.
A. Temporary
B. Persistent
C. Fresh
D. Occasional
Ans: B
Exp: Chronic - continuing for a long time (often used for diseases or problems). Persistent - continuing to exist for a long time. Temporary - lasting for only a limited period, not permanent. Fresh - recently made, new, or not stale. Occasional - happening from time to time, irregularly.
Exam: SSC Stenographer 08/08/2025 (Shift 3)`, "Antonyms": `Q.1 BENEVOLENT
A. Kind
B. Generous
C. Malevolent
D. Compassionate
Ans: C
Exp: Malevolent - having or showing a wish to do evil to others. Benevolent - well meaning and kindly. Kind having or showing a friendly, generous, and considerate nature. Generous showing a readiness to give more of something, especially money, than is necessary or expected. Compassionate feeling or showing sympathy and concern for others.
Exam: SSC CGL 12/09/2025 (Shift 1)

Q.2 Potentate
A. Ruler
B. Sovereign
C. Frail
D. Monarch
Ans: C
Exp: Frail (of a person) weak and delicate. Potentate a person with great power. Puissant one who wields great power or sway. Sovereign a supreme ruler, especially a monarch. Monarch a sovereign head of state, especially a king, queen, or emperor.
Exam: SSC CGL 12/09/2025 (Shift 2)

Q.3 Placate
A. Appease
B. Exasperate
C. Pacify
D. Conciliate
Ans: B
Exp: Exasperate - to irritate intensely. Placate to make (someone) less angry or hostile. Appease to pacify or placate (someone) by acceding to their demands. Pacify to quell the anger, agitation, or excitement of. Conciliate to stop (someone) from being angry or discontented.
Exam: SSC CGL 12/09/2025 (Shift 3)

Q.4 Redolent
A. Fragrant
B. Odorless
C. Evocative
D. Pungent
Ans: B
Exp: Odorless - having no smell. Redolent strongly smelling of something. Fragrant having a pleasant or sweet smell. Evocative bringing strong images, memories, or feelings to mind. Pungent having a sharply strong taste or smell.
Exam: SSC CGL 12/09/2025 (Shift 3)

Q.5 Fugacious
A. Vanishing
B. Permanent
C. Temporary
D. Transitory
Ans: B
Exp: Permanent - lasting or intended to last or remain unchanged indefinitely. Fugacious - tending to disappear. Vanishing- disappear suddenly and completely. Temporary- lasting for only a limited period of time. Transitory - not permanent or lasting.
Exam: SSC CGL 13/09/2025 (Shift 1)

Q.6 MISANTHROPE
A. Philanthropist
B. Narcissist
C. Cynic
D. People-hater
Ans: A
Exp: Philanthropist a person who seeks to promote the welfare of others, especially by the generous donation of money to good causes. Misanthrope a person who dislikes humankind and avoids human society. Narcissist a person who has an excessive interest in or admiration of themselves. Cynic a person who believes that people are motivated purely by self-interest rather than acting for honourable or unselfish reasons. People-hater a person who dislikes humankind and avoids human society.
Exam: SSC CGL 13/09/2025 (Shift 2)

Q.7 Pernicious
A. Deleterious
B. Benign
C. Lachrymose
D. Malignant
Ans: B
Exp: Benign - gentle and kind. Pernicious - having a harmful effect. Deleterious - causing harm or damage. Lachrymose - given to weeping. Malignant - malevolent.
Exam: SSC CGL 13/09/2025 (Shift 2)

Q.8 Duplicity
A. Sincerity
B. Guile
C. Cunning
D. Artifice
Ans: A
Exp: Sincerity the quality of being honest or genuine. Duplicity - deceitfulness. Guile sly or cunning intelligence. Cunning having or showing skill in achieving one's ends by deceit or evasion. Artifice a clever or artful skill.
Exam: SSC CGL 13/09/2025 (Shift 3)

Q.9 Mellifluous
A. Smooth
B. Harsh
C. Sweet
D. Flowing
Ans: B
Exp: Harsh unpleasantly rough or jarring to the senses. Mellifluous (of a voice or words) sweet or musical. Smooth (of a sound) produced without friction; soft and even. Sweet (of a sound or smell) pleasing or fragrant. Flowing moving smoothly and continuously.
Exam: SSC CGL 13/09/2025 (Shift 3)

Q.10 Recalcitrant
A. Obstinate
B. Compliant
C. Defiant
D. Unruly
Ans: B
Exp: Compliant willing to agree with others or obey rules. Recalcitrant having an obstinately uncooperative attitude toward authority or discipline. Obstinate stubbornly refusing to change one's opinion or action. Defiant openly resisting or disobeying authority. Unruly - difficult to control or discipline.
Exam: SSC CGL 14/09/2025 (Shift 1)

Q.11 QUERULOUS
A. Complaining
B. Contentious
C. Patient
D. Petulant
Ans: C
Exp: Patient able to accept or tolerate delays, problems, or suffering without becoming annoyed or anxious. Querulous complaining in a petulant or whining manner. Complaining expressing dissatisfaction or annoyance about something. Contentious causing or likely to cause an argument. Petulant (of a person or their manner) childishly sulky or bad-tempered.
Exam: SSC CGL 14/09/2025 (Shift 2)

Q.12 INCHOATE
A. Nascent
B. Developed
C. Rudimentary
D. Embryonic
Ans: B
Exp: Developed having progressed to an advanced or elaborate stage. Inchoate just begun and therefore not fully formed or developed. Nascent (especially of a process or organization) just coming into existence and beginning to display signs of future potential. Rudimentary relating to an immature, undeveloped, or basic form. Embryonic (of a system, idea, or organism) in an early stage of development.
Exam: SSC CGL 14/09/2025 (Shift 2)

Q.13 PROFLIGATE
A. Extravagant
B. Thrifty
C. Wasteful
D. Lavish
Ans: B
Exp: Thrifty using money and other resources carefully and not wastefully. Profligate recklessly wasteful of resources. Extravagant lacking restraint in spending money or using resources. Wasteful (of a person, action, or thing) using or expending something carelessly, extravagantly, or to no purpose. Lavish sumptuously rich, elaborate, or luxurious.
Exam: SSC CGL 14/09/2025 (Shift 3)

Q.14 Obdurate
A. Stubborn
B. Unyielding
C. Compassionate
D. Inflexible
Ans: C
Exp: Compassionate means showing sympathy, kindness, and willingness to understand others. Obdurate means stubbornly refusing to change one's opinion or course of action. Stubborn refusing to change one's attitude or position. Unyielding - not giving way to pressure. Inflexible unwilling to change or compromise.
Exam: SSC CGL 15/09/2025 (Shift 1)

Q.15 Pernicious
A. Innocuous
B. Virulent
C. Deleterious
D. Malignant
Ans: A
Exp: Innocuous not harmful or offensive. Pernicious extremely harmful or destructive, especially in a gradual or subtle way. Virulent extremely severe or harmful in its effects. Deleterious - causing harm or damage. Malignant dangerous or harmful, often spreading harm quickly.
Exam: SSC CGL 15/09/2025 (Shift 2)

Q.16 Lugubrious
A. Cheerful
B. Mournful
C. Gloomy
D. Depressed
Ans: A
Exp: Cheerful happy and showing positive emotion. Lugubrious looking or sounding sad, dismal, or mournful. Mournful - feeling or expressing sorrow. Gloomy dark or sad in mood or appearance. Depressed - unhappy or in low spirits.
Exam: SSC CGL 15/09/2025 (Shift 2)

Q.17 ADULATION
A. Praise
B. Flattery
C. Censure
D. Worship
Ans: C
Exp: Censure express severe disapproval of (someone or something), especially in a formal statement. Adulation excessive admiration or praise. Praise express warm approval or admiration of. Flattery excessive and insincere praise, given especially to further one's own interests. Worship the feeling or expression of reverence and adoration for a deity.
Exam: SSC CGL 15/09/2025 (Shift 3)

Q.18 AUSPICIOUS
A. Promising
B. Providential
C. Rosy
D. Dreary
Ans: D
Exp: Dreary dull, depressing, and lifeless. Auspicious showing signs of future success or good fortune. Promising showing potential for success. Providential occurring at a favourable time. Rosy - hopeful and optimistic.
Exam: SSC CGL 15/09/2025 (Shift 3)

Q.19 Tranquil
A. Calm
B. Peaceful
C. Agitated
D. Quiet
Ans: C
Exp: Agitated troubled, disturbed, or nervous. Tranquil calm, peaceful, and free from disturbance. Calm free from excitement or disturbance. Peaceful quiet and free from conflict. Quiet silent or calm.
Exam: SSC CGL 16/09/2025 (Shift 1)

Q.20 Obsequious
A. Submissive
B. Independent
C. Servile
D. Flattering
Ans: B
Exp: Independent free from control or influence. Obsequious extremely obedient or eager to please someone. Submissive - willing to obey others. Servile showing excessive willingness to serve others. Flattering - giving excessive praise.
Exam: SSC CGL 16/09/2025 (Shift 1)

Q.21 TRANSIENT
A. Permanent
B. Ephemeral
C. Fleeting
D. Temporary
Ans: A
Exp: Permanent - lasting or intended to last or remain unchanged indefinitely. Transient - lasting only for a short time. Ephemeral - lasting for a very short time. Fleeting-lasting for a very short time. Temporary lasting for only a limited period of time.
Exam: SSC CGL 16/09/2025 (Shift 2)

Q.22 ACERBIC
A. Caustic
B. Mild
C. Cutting
D. Sarcastic
Ans: B
Exp: Mild - not severe, serious, or harsh. Acerbic (especially of a comment or style of speaking) sharp and forthright. Caustic sarcastic in a scathing and bitter way. Cutting (of a remark or a person's manner) hurtful in a direct but subtle way. Sarcastic using irony in order to mock or convey contempt.
Exam: SSC CGL 16/09/2025 (Shift 2)

Q.23 ABSTEMIOUS
A. Moderate
B. Self-disciplined
C. Gluttonous
D. Temperate
Ans: C
Exp: Gluttonous excessively greedy, especially about eating or drinking. Abstemious not indulging much in food or drink. Moderate average in amount, intensity, quality, or degree. Self-disciplined able to control one's desires and actions. Temperate showing moderation or self-restraint.
Exam: SSC CGL 16/09/2025 (Shift 3)

Q.24 INSALUBRIOUS
A. Wholesome
B. Filthy
C. Morbid
D. Unhealthy
Ans: A
Exp: Wholesome promoting good health and well-being. Insalubrious unwholesome or unhealthy, often referring to a place or environment. Filthy - very dirty or unpleasant. Morbid having an unhealthy interest in disturbing subjects like death or disease. Unhealthy not in good health.
Exam: SSC CGL 16/09/2025 (Shift 3)

Q.25 ENERVATE
A. Weaken
B. Exhaust
C. Invigorate
D. Drain
Ans: C
Exp: Invigorate to give strength, energy, or vitality to. Enervate to weaken or drain someone of energy or strength. Weaken to make or become less strong. Exhaust - to drain of strength or energy. Drain to deprive of strength or vitality.
Exam: SSC CGL 17/09/2025 (Shift 1)

Q.26 IGNOMINY
A. Disgrace
B. Dishonour
C. Esteem
D. Shame
Ans: C
Exp: Esteem respect and admiration, typically for a person. Ignominy public shame or disgrace. Disgrace loss of reputation or respect as the result of a dishonourable action. Dishonour a state of shame or disgrace. Shame a painful feeling of humiliation or distress caused by the consciousness of foolish or dishonourable behaviour.
Exam: SSC CGL 17/09/2025 (Shift 2)

Q.27 EFFULGENT
A. Meretricious
B. Fulminant
C. Lacklustre
D. Seraphic
Ans: C
Exp: Lacklustre - not shining. Effulgent - shining brightly. Fulminant (of a disease or symptom) severe and sudden in onset. Meretricious apparently attractive but having in reality no value or integrity. Seraphic relating to or characteristic of a high ranking angel.
Exam: SSC CGL 17/09/2025 (Shift 2)

Q.28 Obdurate
A. Unyielding
B. Stubborn
C. Flexible
D. Callous
Ans: C
Exp: Flexible willing to change or adapt easily. Obdurate stubborn, inflexible, or unwilling to change one's mind. Unyielding not willing to change; stubborn. Stubborn refusing to change one's opinion or attitude. Callous - emotionally insensitive.
Exam: SSC CGL 17/09/2025 (Shift 3)

Q.29 STUPOR
A. Drowsiness
B. Alertness
C. Torpor
D. Coma
Ans: B
Exp: Alertness the state of being watchful and prompt to act. Stupor a state of near-unconsciousness or insensibility. Drowsiness - a state of feeling sleepy. Torpor a state of physical or mental inactivity. Coma a state of deep unconsciousness that lasts for a prolonged or indefinite period.
Exam: SSC CGL 18/09/2025 (Shift 1)

Q.30 VACILLATE
A. Waver
B. Hesitate
C. Decide
D. Falter
Ans: C
Exp: Decide to make a firm choice or conclusion. Vacillate to be unable to make a firm decision. Waver to move back and forth or show indecision. Hesitate to pause before saying or doing something due to uncertainty. Falter - to lose strength or confidence.
Exam: SSC CGL 18/09/2025 (Shift 2)

Q.31 IGNOMINY
A. Shame
B. Renown
C. Disrepute
D. Obscurity
Ans: B
Exp: Renown the state of being known and admired by many people for some special achievement or skill. Ignominy public shame or disgrace. Shame a painful feeling of humiliation or distress caused by the consciousness of wrong or foolish behaviour. Disrepute the state of being held in low esteem by the public. Obscurity the state of being unknown, inconspicuous, or unimportant.
Exam: SSC CGL 18/09/2025 (Shift 3)

Q.32 INEFFABLE
A. Expressible
B. Unspeakable
C. Indescribable
D. Sublime
Ans: A
Exp: Expressible able to be expressed or described in words. Ineffable too great or extreme to be expressed or described in words. Unspeakable too bad or shocking to express in words. Indescribable impossible to describe adequately. Sublime of great beauty or excellence that inspires awe.
Exam: SSC CGL 19/09/2025 (Shift 1)

Q.33 TRUCULENT
A. Belligerent
B. Pugnacious
C. Amiable
D. Aggressive
Ans: C
Exp: Amiable having or displaying a friendly and pleasant manner. Truculent eager or quick to argue or fight. Belligerent - hostile and aggressive. Pugnacious eager or quick to argue, quarrel, or fight. Aggressive ready or likely to attack or confront.
Exam: SSC CGL 19/09/2025 (Shift 2)

Q.34 Pernicious
A. Destructive
B. Harmless
C. Noxious
D. Baneful
Ans: B
Exp: Harmless not capable of causing injury or damage. Pernicious causing great harm or damage. Destructive causing destruction or serious damage. Noxious harmful, poisonous, or very unpleasant. Baneful - causing ruin, injury, or death.
Exam: SSC CGL 19/09/2025 (Shift 3)

Q.35 GARRULOUS
A. Talkative
B. Verbose
C. Reticent
D. Communicative
Ans: C
Exp: Reticent not revealing one's thoughts or feelings readily. Garrulous excessively talkative, especially on trivial matters. Talkative - fond of talking. Verbose using or expressed in more words than are needed. Communicative willing to talk or impart information.
Exam: SSC CGL 20/09/2025 (Shift 1)

Q.36 Lethargic
A. Sluggish
B. Energetic
C. Lazy
D. Inactive
Ans: B
Exp: Energetic full of energy and enthusiasm. Lethargic - dull, tired, or lacking energy. Sluggish - lacking energy or alertness. Lazy unwilling to work or use energy. Inactive - not engaging in physical activity.
Exam: SSC CGL 20/09/2025 (Shift 2)

Q.37 PROLIFIC
A. Abundant
B. Fruitful
C. Barren
D. Productive
Ans: C
Exp: Barren (of land) too poor to produce much or any vegetation. Prolific (of a plant, animal, or person) producing much fruit or foliage or many offspring. Abundant existing or available in large quantities. Fruitful (of a tree, plant, or land) producing much fruit. Productive (of a person, company, or country) producing or providing a large amount of something.
Exam: SSC CGL 21/09/2025 (Shift 1)

Q.38 PROPINQUITY
A. Vicinity
B. Remoteness
C. Affinity
D. Contiguity
Ans: B
Exp: Remoteness the state of being far away in distance, time, or relation. Propinquity nearness or closeness in space, time, or relationship. Vicinity the area near or surrounding a particular place. Affinity a natural liking or attraction toward someone or something. Contiguity the state of being in contact or close proximity.
Exam: SSC CGL 21/09/2025 (Shift 2)

Q.39 EXONERATE
A. Absolve
B. Convict
C. Clear
D. Acquit
Ans: B
Exp: Convict declare (someone) to be guilty of a criminal offence by the verdict of a jury or the decision of a judge in a court of law. Exonerate - (especially of an official body) absolve (someone) from blame for a fault or wrongdoing, especially after due consideration of the case. Absolve declare (someone) free from guilt, obligation, or punishment. Clear (of a person or organization) prove the innocence of. Acquit free (someone) from a criminal charge by a verdict of not guilty.
Exam: SSC CGL 21/09/2025 (Shift 3)

Q.40 ESOTERIC
A. Abstract
B. Common
C. Hidden
D. Secret
Ans: B
Exp: Common - ordinary, familiar, or easily understood by many people. Esoteric - intended for or likely to be understood by only a small number of people with specialized knowledge or interest. Abstract existing in thought or as an idea but not having a physical existence. Hidden - kept out of sight or secret. Secret something kept unknown or concealed from others.
Exam: SSC CGL 22/09/2025 (Shift 1)

Q.41 PRODIGAL
A. Wasteful
B. Extravagant
C. Frugal
D. Lavish
Ans: C
Exp: Frugal - sparing or economical with regard to money or food, and careful in spending. Prodigal spending money or resources freely and recklessly. Wasteful (of a person, action, or thing) using or expending something carelessly, extravagantly, or to no purpose. Extravagant lacking restraint in spending money or using resources. Lavish sumptuously rich, elaborate, or luxurious.
Exam: SSC CGL 22/09/2025 (Shift 2)

Q.42 PERNICIOUS
A. Harmful
B. Beneficial
C. Destructive
D. Detrimental
Ans: B
Exp: Beneficial producing a good or helpful effect. Pernicious having a harmful or destructive effect, especially in a gradual or subtle way. Harmful - causing harm or damage. Destructive - causing great damage. Detrimental - tending to cause harm.
Exam: SSC CGL 22/09/2025 (Shift 3)

Q.43 Benevolent
A. Philanthropic
B. Kind
C. Malignant
D. Compassionate
Ans: C
Exp: Malignant evil in nature or effect. Benevolent - well meaning and kindly. Kind having or showing a friendly, generous, and considerate nature. Philanthropic (of a person or institution) seeking to promote the welfare of others, especially by donating money to good causes; generous and benevolent. Compassionate feeling or showing sympathy and concern for others.
Exam: SSC CGL 23/09/2025 (Shift 1)

Q.44 IMPERIOUS
A. Arrogant
B. Domineering
C. Submissive
D. Overbearing
Ans: C
Exp: Submissive - ready to conform to the authority or will of others. Imperious - arrogant and domineering. Arrogant having an exaggerated sense of one's own importance or abilities. Domineering asserting one's will over others in an overbearing way. Overbearing- unpleasantly overpowering.
Exam: SSC CGL 23/09/2025 (Shift 2)

Q.45 RECONDITE
A. Obscure
B. Simple
C. Esoteric
D. Profound
Ans: B
Exp: Simple easy to understand or plain. Recondite little known, obscure, or difficult to understand. Obscure not clearly expressed or easily understood. Esoteric intended for or likely to be understood by only a small number of people with specialized knowledge. Profound - very great or intense.
Exam: SSC CGL 23/09/2025 (Shift 3)

Q.46 DEBILITATE
A. Fledgling
B. Strengthen
C. Enervate
D. Groundbreaking
Ans: B
Exp: Strengthen - make or become stronger. Debilitate make (someone) very weak and infirm. Fledgling new and without experience. Enervate cause (someone) to feel drained of energy or vitality. Groundbreaking brand new, important and original.
Exam: SSC CGL 24/09/2025 (Shift 1)

Q.47 EXTIRPATE
A. Eradicate
B. Uproot
C. Preserve
D. Annihilate
Ans: C
Exp: Preserve to protect or keep safe from harm, decay, or destruction. Extirpate to completely destroy, remove, or eradicate. Eradicate to remove or destroy completely. Uproot to pull out from the root. Annihilate - to destroy completely.
Exam: SSC CGL 24/09/2025 (Shift 2)

Q.48 OBSTINACY
A. Stubbornness
B. Flexibility
C. Tenacity
D. Firmness
Ans: B
Exp: Flexibility the quality of bending easily without breaking. Obstinacy the quality of being determined to do what you want and refusing to do anything else. Stubbornness the quality or condition of being stubborn. Tenacity the quality or fact of being very determined. Firmness the quality of being resolute or determined.
Exam: SSC CGL 24/09/2025 (Shift 3)

Q.49 ALACRITY
A. Eagerness
B. Apathy
C. Promptness
D. Glee
Ans: B
Exp: Apathy lack of interest, enthusiasm, or concern. Alacrity - brisk and cheerful readiness. Eagerness enthusiasm to do or to have something. Promptness the quality of being quick to act or arrive. Glee - great delight.
Exam: SSC CGL 25/09/2025 (Shift 1)

Q.50 APOCRYPHAL
A. Spurious
B. Authentic
C. Dubious
D. Questionable
Ans: B
Exp: Authentic - genuine, real, or true. Apocryphal - of doubtful authenticity. Spurious false or not genuine. Dubious - doubtful or uncertain. Questionable open to doubt or suspicion.
Exam: SSC CGL 25/09/2025 (Shift 2)

Q.51 EXACERBATE
A. Intensify
B. Ameliorate
C. Aggravate
D. Heighten
Ans: B
Exp: Ameliorate - make (something bad or unsatisfactory) better. Exacerbate make (a problem, bad situation, or negative feeling) worse. Intensify become or make more intense. Aggravate make (a problem, injury, or offence) worse or more serious. Heighten make or become more intense.
Exam: SSC CGL 25/09/2025 (Shift 3)

Q.52 VERACIOUS
A. Truthful
B. Honest
C. Deceptive
D. Sincere
Ans: C
Exp: Deceptive giving an appearance or impression different from the true one. Veracious speaking or representing the truth. Truthful - honest; telling the truth. Honest- free from deceit; morally upright. Sincere genuine; without pretense or hypocrisy.
Exam: SSC CGL 26/09/2025 (Shift 1)

Q.53 EXACERBATE
A. Worsen
B. Aggravate
C. Alleviate
D. Intensify
Ans: C
Exp: Alleviate make (suffering, deficiency, or a problem) less severe. Exacerbate make (a problem, bad situation, or negative feeling) worse. Worsen make or become worse. Aggravate make (a problem, injury, or offence) worse or more serious. Intensify become or make more intense.
Exam: SSC CGL 26/09/2025 (Shift 2)

Q.54 LUCID
A. Clear
B. Obscure
C. Understandable
D. Evident
Ans: B
Exp: Obscure not clear or hard to understand. Lucid - expressed clearly. Clear easy to perceive, understand, or interpret. Understandable - able to be understood. Evident clearly seen or understood.
Exam: SSC CGL 26/09/2025 (Shift 3)

Q.55 GARRULOUS
A. Talkative
B. Verbose
C. Reticent
D. Communicative
Ans: C
Exp: Reticent not revealing one's thoughts or feelings readily. Garrulous excessively talkative, especially on trivial matters. Talkative - fond of talking. Verbose using or expressed in more words than are needed. Communicative willing to talk or impart information.
Exam: SSC CGL 14/10/2025 (Shift 1)

Q.56 TACITURN
A. Reserved
B. Loquacious
C. Quiet
D. Uncommunicative
Ans: B
Exp: Loquacious tending to talk a great deal. Taciturn (of a person) reserved or uncommunicative in speech. Reserved slow to reveal emotion or opinions. Quiet - making little or no noise. Uncommunicative unwilling to impart information or express feelings.
Exam: SSC CGL 14/10/2025 (Shift 2)

Q.57 DEBILITATE
A. Fledgling
B. Strengthen
C. Enervate
D. Groundbreaking
Ans: B
Exp: Strengthen make or become stronger. Debilitate make (someone) very weak and infirm. Fledgling new and without experience. Enervate cause (someone) to feel drained of energy or vitality. Groundbreaking brand new, important and original.
Exam: SSC CGL 14/10/2025 (Shift 3)

    };

    const app = {
        questions: [], userAns: {}, visited: new Set(), bookmarks: new Set(),
        currentIdx: 0, timer: 900, interval: null, currentCat: "", currentSetNum: 1,

        savedItems: JSON.parse(localStorage.getItem('ssc_saved') || '{}'),
        viewMode: 'normal', // Track if viewing blunders or saved items

        init() {
            const grid = document.getElementById('english-topics-grid');
            grid.innerHTML = TOPICS.map(t => `<div class="menu-card" onclick="app.showSets('${t}')"><h3>${t}</h3></div>`).join('');

        showTopics(sub) { if(sub === 'English') document.getElementById('english-topics-area').style.display = 'block'; },

        showSets(cat) {
            this.currentCat = cat;
            this.viewMode = 'normal'; // Reset view mode
            const allQs = this.parseData(RAW_DATA[cat] || "");
            this.hideScreens();
            document.getElementById('screen-sets').classList.add('active');
            document.getElementById('set-title').innerText = cat.toUpperCase();
            const container = document.getElementById('set-list-container');
            container.innerHTML = '';
            if(allQs.length === 0) { container.innerHTML = '<p style="color:#666; text-align:center; grid-column:1/-1">No data available.</p>'; return; }
            for(let i=0; i < allQs.length; i+=25) {
                const setNum = (i/25)+1;
                const chunk = allQs.slice(i, i+25);
                const btn = document.createElement('div');
                btn.className = 'menu-card';
                btn.onclick = () => app.startTest(chunk, setNum);
                btn.innerHTML = `<h3>SET ${setNum}</h3><p>Q ${i+1} - ${Math.min(i+25, allQs.length)}</p>`;
                container.appendChild(btn);
            }
        },

        parseData(raw) {
            if(!raw) return [];
            return raw.trim().split(/Q\.\d+/).filter(b => b.trim()).map(block => {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l);
                let qText = "", options = [], ans = "", exp = "", exam = "", instr = "";
                lines.forEach(l => {
                    if(l.startsWith('A.')) options[0] = l.slice(2).trim();
                    else if(l.startsWith('B.')) options[1] = l.slice(2).trim();
                    else if(l.startsWith('C.')) options[2] = l.slice(2).trim();
                    else if(l.startsWith('D.')) options[3] = l.slice(2).trim();
                    else if(l.startsWith('Ans:')) ans = l.slice(4).trim().toUpperCase();
                    else if(l.startsWith('Exp:')) exp = l.slice(4).trim();
                    else if(l.startsWith('Exam:')) exam = l.slice(5).trim();
                    else { if(l.toLowerCase().includes('select') || l.toLowerCase().includes('choose')) instr = l; else qText += l + " "; }
                });
                return { instr, q: qText.trim(), options, correct: {'A':0,'B':1,'C':2,'D':3}[ans.charAt(0)], exp, exam };
            });
        },

        startTest(qs, num) {
            this.questions = qs; this.currentSetNum = num; this.userAns = {}; this.visited = new Set([0]); this.bookmarks = new Set();
            this.currentIdx = 0; this.timer = 900; this.hideScreens();
            this.viewMode = 'normal'; // Reset view mode when starting test
            document.getElementById('screen-test').classList.add('active');
            document.getElementById('timer').style.display = 'block';
            document.getElementById('test-header-name').innerText = `${this.currentCat} - SET ${num}`;
            this.renderQuestion(); this.startTimer();
        },

        renderQuestion() {
            const q = this.questions[this.currentIdx];
            document.getElementById('q-prog').innerText = `Q${this.currentIdx+1}/${this.questions.length}`;
            document.getElementById('exam-tag-display').innerText = q.exam || "SSC EXAM";
            document.getElementById('instruction-area').innerHTML = q.instr ? `<div class="instruction-box">${q.instr}</div>` : '';
            document.getElementById('q-text').innerText = q.q;
            
            const isSaved = this.savedItems[this.currentCat] && this.savedItems[this.currentCat].some(x => x.q === q.q);
            document.getElementById('star-btn').classList.toggle('active', isSaved);
            
            document.getElementById('options-area').innerHTML = q.options.map((opt, i) => `<button class="opt-btn ${this.userAns[this.currentIdx] === i ? 'selected' : ''}" onclick="app.select(${i})"><b>${String.fromCharCode(65+i)}.</b> ${opt}</button>`).join('');
            this.renderPalette();
        },

        renderPalette() {
            document.getElementById('palette').innerHTML = this.questions.map((_, i) => {
                let cls = this.userAns[i] !== undefined ? 'answered' : (this.visited.has(i) ? 'visited' : '');
                return `<div class="p-num ${cls} ${this.currentIdx === i ? 'current' : ''}" onclick="app.jump(${i})">${i+1}</div>`;
            }).join('');
        },

        select(i) { this.userAns[this.currentIdx] = i; this.renderQuestion(); },
        clearResponse() { delete this.userAns[this.currentIdx]; this.renderQuestion(); },
        jump(i) { this.currentIdx = i; this.visited.add(i); this.renderQuestion(); },
        next() { if(this.currentIdx < this.questions.length-1) { this.currentIdx++; this.visited.add(this.currentIdx); this.renderQuestion(); } },
        prev() { if(this.currentIdx > 0) { this.currentIdx--; this.renderQuestion(); } },
        startTimer() { clearInterval(this.interval); this.interval = setInterval(() => { this.timer--; let m = Math.floor(this.timer/60), s = this.timer%60; document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`; if(this.timer <= 0) this.submit(); }, 1000); },

        submit() {
            if(!confirm("Submit Test?")) return;
            clearInterval(this.interval); document.getElementById('timer').style.display = 'none';
            this.hideScreens(); document.getElementById('screen-analysis').classList.add('active');
            let r = 0, w = 0, s = 0; let html = "";
            
            if(!this.blunders[this.currentCat]) this.blunders[this.currentCat] = [];

            this.questions.forEach((q, i) => {
                const u = this.userAns[i]; const isCorrect = u === q.correct;
                if(u === undefined) s++; 
                else if(isCorrect) r++; 
                else { 
                    w++; 
                    if(!this.blunders[this.currentCat].some(x => x.q === q.q)) this.blunders[this.currentCat].push(q);
                }
                html += `<div class="sol-box"><div style="font-weight:bold; margin-bottom:10px">Q.${i+1} ${q.q}</div>${q.options.map((o, idx) => `<div style="color:${idx===q.correct?'var(--succ)':(idx===u?'var(--err)':'#666')}">${String.fromCharCode(65+idx)}. ${o}</div>`).join('')}<div style="margin-top:10px; font-size:0.85rem; border-top:1px solid #222; padding-top:10px"><b>EXP:</b> ${q.exp}</div></div>`;
            });
            this.lastStats = { score: (r * 2) - (w * 0.5), r, w, s };
            this.viewMode = 'normal'; // Normal test mode
            document.getElementById('analysis-header-area').innerHTML = `<div class="score-box"><h2 style="font-family:'Orbitron'; color:var(--neon-yellow); font-size:0.8rem">FINAL SCORE</h2><h1 style="font-size:3.5rem">${this.lastStats.score.toFixed(2)}</h1><div style="display:flex; justify-content:space-around; margin-top:15px; font-family:'Orbitron'; font-size:0.7rem"><span style="color:var(--succ)">RIGHT: ${r}</span> <span style="color:var(--err)">WRONG: ${w}</span> <span style="color:var(--sky)">UA: ${s}</span></div></div>`;
            document.getElementById('analysis-list').innerHTML = html;
            localStorage.setItem('ssc_blunders', JSON.stringify(this.blunders));
            this.updateAuxGrids();
        },

        generatePDF() {
            const time = new Date().toLocaleString();
            let reportType = 'EXAM PERFORMANCE REPORT';
            let topicLabel = this.currentCat.toUpperCase();
            
            // Check view mode to determine report type
            if(this.viewMode === 'blunders') {
                reportType = 'BLUNDERS REVIEW REPORT';
                topicLabel = `${this.currentCat.toUpperCase()} - BLUNDERS`;
            } else if(this.viewMode === 'saved') {
                reportType = 'SAVED ITEMS REPORT';
                topicLabel = `${this.currentCat.toUpperCase()} - SAVED`;
            }
            
            let html = `<div style="background:#fff; color:#000; padding:20px; font-family:'Inter', sans-serif;"><div style="border-bottom:3px solid #000; padding-bottom:10px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:flex-end;"><div><h1 style="margin:0; font-family:'Orbitron'; font-size:22px; color:#000;">THE SSC SCHOLARS OFFICIAL</h1><p style="margin:2px 0; font-size:12px; font-weight:bold; color:#444;">${reportType} | 2026</p></div><div style="text-align:right; font-size:10px; color:#666;"><b>DATE:</b> ${time}<br><b>TOPIC:</b> ${topicLabel}</div></div>`;
            
            // Only show marks section for normal tests, not for blunders/saved
            if(this.viewMode === 'normal') {
                html += `<div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:20px;"><div style="border:1px solid #000; padding:10px; text-align:center;"><b>MARKS: ${this.lastStats.score.toFixed(2)}</b></div><div style="border:1px solid #000; padding:10px; text-align:center; background:#e8f5e9;">RIGHT: ${this.lastStats.r}</div><div style="border:1px solid #000; padding:10px; text-align:center; background:#ffebee;">WRONG: ${this.lastStats.w}</div><div style="border:1px solid #000; padding:10px; text-align:center; background:#f5f5f5;">UA: ${this.lastStats.s}</div></div>`;
            } else {

            }
            
            html += `<div style="display:flex; flex-direction:column; gap:12px;">`;
            
            this.questions.forEach((q, i) => {
                const u = this.userAns[i]; const isCorrect = u === q.correct;
                const statusColor = u === undefined ? '#9e9e9e' : (isCorrect ? '#2e7d32' : '#c62828');
                
                // For blunders and saved, don't show status (they're for reference)
                let statusText = '';
                if(this.viewMode === 'normal') {
                    statusText = `<span style="font-size:9px; color:${statusColor};">${u === undefined ? 'UA' : (isCorrect ? 'CORRECT' : 'INCORRECT')}</span>`;

                html += `<div style="border:1px solid #eee; padding:10px; page-break-inside:avoid; border-left:4px solid ${this.viewMode === 'normal' ? statusColor : '#2e7d32'};"><div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span><b>Q.${i+1}</b> [${q.exam || 'SSC'}]</span>${statusText}</div><div style="font-size:12px; margin-bottom:8px;">${q.q}</div><div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; font-size:11px;"><div>A. ${q.options[0]}</div><div>B. ${q.options[1]}</div><div>C. ${q.options[2]}</div><div>D. ${q.options[3]}</div></div><div style="font-size:10px; padding:6px; background:#f9f9f9; border:1px solid #ddd; margin-top:5px;"><b>ANS: ${String.fromCharCode(65+q.correct)}</b><br>EXP: ${q.exp}</div></div>`;
            });
            html += `</div><div style="text-align:center; margin-top:40px; border-top:2px solid #000; padding-top:15px;"><p>JOIN OUR OFFICIAL TELEGRAM CHANNEL</p><a href="https://t.me/thesscscholarsofficial" style="color:#0088cc; text-decoration:none; font-weight:bold;">t.me/thesscscholarsofficial</a><p>© 2026 THE SSC SCHOLARS OFFICIAL</p></div></div>`;
            const original = document.body.innerHTML; document.body.innerHTML = html; window.print(); document.body.innerHTML = original; location.reload(); 
        },

            const bGrid = document.getElementById('blunder-grid'); const sGrid = document.getElementById('saved-grid');
            if(bGrid) bGrid.innerHTML = Object.keys(this.blunders).map(cat => this.blunders[cat].length > 0 ? `<div class="menu-card" onclick="app.viewSpecial('${cat}', 'blunders')"><h3>${cat}</h3><p>${this.blunders[cat].length} Errors</p></div>` : '').join('');

        toggleBookmark() {
            const q = this.questions[this.currentIdx]; 
            if(!this.savedItems[this.currentCat]) this.savedItems[this.currentCat] = [];
            const idx = this.savedItems[this.currentCat].findIndex(x => x.q === q.q);
